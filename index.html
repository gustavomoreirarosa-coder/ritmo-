/* ---------- ETAPA 4 · motor de regras ---------- */
function motorRegras(){ return cache("motor",motorRegrasCalc); }
/* limite de horário para ainda fazer sentido sugerir a janela de estudo */
function jt0Hora(je){ return je.melhor.h*60; }

function motorRegrasCalc(){
  var d=dia(), min=UI.agora.getHours()*60+UI.agora.getMinutes();
  var blocos=montarDia(UI.agora);
  var vis=visiveis(d,blocos);
  var feitos=vis.filter(function(b){ return d.feitos[b.id]; }).length;
  var abertas=N.filter(function(x){ return x.duvida&&!x.resolvida; });
  var r=[];
  var add=function(o){ r.push(o); };

  /* --- provas --- */
  var prox=S.provas.filter(function(x){ return diasAte(x.data)>=0; })
                   .sort(function(a,b){ return a.data.localeCompare(b.data); })[0];
  if(prox){
    var dd=diasAte(prox.data);
    var dv=abertas.filter(function(x){ return x.tag===prox.materia; }).length;
    var horas=(porMateria(7)[prox.materia]||0)/60;
    if(dd<=3){
      add({tipo:"atencao",pri:100,tom:"urgente",tit:(dd===0?"Prova hoje":dd===1?"Prova amanhã":"Prova em "+dd+" dias"),
        txt:prox.materia+" · "+(dv?dv+(dv===1?" dúvida aberta pra fechar hoje":" dúvidas abertas pra fechar hoje")
          :horas<1?"você deu menos de 1h pra ela nos últimos 7 dias":"revise o que já anotou"),
        acao:{lab:"abrir estudo",cmd:"tab:estudo"}});
    } else if(dd<=7 && horas<2){
      add({tipo:"sugestao",pri:70,tom:"atencao",tit:"Prova em "+dd+" dias",
        txt:prox.materia+" teve "+horas.toFixed(1)+"h nos últimos 7 dias. Começar agora custa menos que a véspera.",
        acao:{lab:"abrir estudo",cmd:"tab:estudo"}});
    }
  }

  /* --- atraso: ignora blocos de base e só olha as últimas 4 horas --- */
  var conta=function(b){ return b.k!=="aula" && b.k!=="base"; };
  var atrasados=vis.filter(function(b){
    return conta(b) && !d.feitos[b.id] && min>=b.t+b.dur && (min-(b.t+b.dur))<=240;
  });
  var pesados=atrasados.filter(function(b){ return b.e||b.k==="estudo"||b.k==="treino"; });
  var restantes=vis.filter(function(b){ return conta(b) && b.t+b.dur>min && !d.feitos[b.id]; });
  if(atrasados.length>=2 && pesados.length>=1 && restantes.length && min<1320){
    add({tipo:"sugestao",pri:66,tom:"atencao",tit:atrasados.length+" blocos ficaram pra trás",
      txt:"Dá pra encaixar o que sobrou a partir de agora sem mexer na aula nem no molde da rotina. Você confere antes de aplicar.",
      acao:{lab:"ver proposta",cmd:"replanejar"}});
  } else if(pesados.length===1 && min<1320){
    add({tipo:"analise",pri:44,tom:"neutro",tit:"Um bloco ficou pra trás",
      txt:pesados[0].titulo+" passou sem marcar. Se ainda fizer sentido, marca; se não, deixa ir — dia salvo é dia que não zerou.",
      acao:null});
  }

  /* --- bloco cronicamente pulado (histórico) --- */
  var cronico=null;
  vis.forEach(function(b){
    var hb=histBloco(b.id,14);
    if(hb.t>=7 && hb.f/hb.t<=0.3 && (!cronico||hb.f/hb.t<cronico.taxa))
      cronico={b:b,taxa:hb.f/hb.t,hb:hb};
  });
  if(cronico){
    add({tipo:"analise",pri:60,tom:"atencao",tit:"Esse bloco não cola",
      txt:cronico.b.titulo+" foi feito "+cronico.hb.f+" de "+cronico.hb.t+" dias. Depois de duas semanas assim, o horário está errado — não você.",
      acao:{lab:"ajustar rotina",cmd:"ir-rotina"}});
  }

  /* --- dia da semana historicamente fraco --- */
  var ds=porDiaSemana(28), hoje=UI.agora.getDay();
  if(min<720 && ds[hoje]>0 && ds[hoje]<0.4){
    add({tipo:"analise",pri:50,tom:"neutro",tit:NOMES_DIA[hoje].charAt(0).toUpperCase()+NOMES_DIA[hoje].slice(1)+" costuma ser difícil",
      txt:"Nas últimas semanas você fechou "+Math.round(ds[hoje]*100)+"% dos blocos nesse dia. Considere ligar o modo sobrevivência agora e garantir o essencial.",
      acao:null});
  }

  /* --- proteína proporcional ao horário --- */
  var esperado=Math.max(0,Math.min(1,(min-480)/(1380-480)));
  var alvo=metaProt()*esperado;
  if(esperado>0.35 && num(d.prot) < alvo*0.6){
    var med14=0,c14=0;
    serieDias(14).forEach(function(x){ if(x.prot>0){ med14+=x.prot; c14++; } });
    add({tipo:"atencao",pri:80,tom:"atencao",tit:"Proteína atrasada",
      txt:num(d.prot)+" g até agora, quando o normal seria perto de "+Math.round(alvo)+" g."
        +(c14&&med14/c14<metaProt()*0.75?" Sua média de 14 dias também está baixa ("+Math.round(med14/c14)+" g).":"")
        +" Estimulante corta a fome — nesse caso comer é decisão, não vontade.",
      acao:null});
  }

  /* --- água --- */
  if(min>=1020 && num(d.agua) < metaAgua()*0.5){
    add({tipo:"atencao",pri:55,tom:"neutro",tit:"Água baixa",
      txt:num(d.agua)+" de "+metaAgua()+" copos. Ainda dá pra recuperar antes de dormir sem acordar de madrugada.",
      acao:null});
  }

  /* --- descanso --- */
  var seguidos=0;
  for(var i=0;i<10;i++){
    if((S.dias[chave(diasAtras(i))]||{}).treino) seguidos++; else break;
  }
  if(seguidos>=6){
    add({tipo:"sugestao",pri:75,tom:"atencao",tit:seguidos+" dias de treino seguidos",
      txt:"Sem folga, o volume vira desgaste e o sono piora — o que derruba tudo o mais. Um dia de descanso ativo rende mais que o sétimo treino.",
      acao:null});
  }
  if(min>=1350 && feitos>=vis.length*0.7){
    add({tipo:"sugestao",pri:40,tom:"bom",tit:"Já deu por hoje",
      txt:"Você fechou "+feitos+" de "+vis.length+" blocos. Continuar agora tira do sono de amanhã.",
      acao:null});
  }

  /* --- revisão --- */
  var rev=vis.filter(function(b){ return b.k==="estudo"; }).sort(function(a,b){ return b.t-a.t; })[0];
  if(rev && min>=rev.t-45 && min<rev.t+rev.dur && !d.feitos[rev.id]){
    add({tipo:"sugestao",pri:85,tom:"neutro",tit:"Revisão às "+hhmm(rev.t),
      txt:"15 minutos relendo o caderno hoje valem mais que 2 horas na véspera da prova.",
      acao:{lab:"abrir modelo",cmd:"anotar:1"}});
  }
  var esfriando=S.materias.map(function(m){ return {m:m,d:ultimoEstudo(m)}; })
    .filter(function(x){ return x.d!==null && x.d>=7; })
    .sort(function(a,b){ return b.d-a.d; })[0];
  if(esfriando){
    add({tipo:"atencao",pri:52,tom:"neutro",tit:"Matéria esfriando",
      txt:esfriando.m+" está há "+esfriando.d+" dias sem nenhum minuto. Passa dos 10 e custa quase como aprender do zero.",
      acao:{lab:"abrir estudo",cmd:"tab:estudo"}});
  }
  if(abertas.length>=5){
    add({tipo:"atencao",pri:58,tom:"atencao",tit:abertas.length+" dúvidas abertas",
      txt:"Dúvida que sobrevive uma semana vira buraco na prova. Fecha as três mais antigas.",
      acao:{lab:"abrir dúvidas",cmd:"ir-duvidas"}});
  }

  /* --- sequência em risco --- */
  var seq=sequencias();
  if(seq.atual>=3 && min>=1200 && vis.length && feitos/vis.length<0.5){
    var faltam=Math.ceil(vis.length*0.5)-feitos;
    add({tipo:"atencao",pri:88,tom:"atencao",tit:"Sequência de "+seq.atual+" dias em risco",
      txt:"Faltam "+faltam+" "+(faltam===1?"bloco":"blocos")+" pra manter o dia contando. Modo sobrevivência reduz essa conta.",
      acao:null});
  }

  /* --- dormiu tarde ontem --- */
  var dt=dormiuTarde();
  if(dt && dt.tarde && min<900){
    add({tipo:"sugestao",pri:78,tom:"atencao",tit:"Ontem terminou tarde",
      txt:"Sua última marcação foi "+hhmm(dt.min)+". Dia curto de sono rende menos e cobra caro à noite — "
        +"considere cortar um bloco de estudo hoje em vez de arrastar todos pela metade.",
      acao:{lab:"ligar sobrevivência",cmd:"sobrev"}});
  }

  /* --- excesso de tarefas no dia --- */
  var sc=sobrecarga();
  if(sc && sc.razao>1.6 && min<780){
    add({tipo:"analise",pri:64,tom:"atencao",tit:"Dia planejado acima do seu normal",
      txt:"Hoje soma "+Math.round(sc.planejado/60)+"h de tarefas, e sua mediana concluída é "
        +(sc.mediana/60).toFixed(1)+"h. Escolher agora o que cai é melhor que descobrir às 23h.",
      acao:{lab:"ajustar rotina",cmd:"ir-rotina"}});
  }

  /* --- horário melhor para treino --- */
  var jt=melhorJanela("treino",28);
  if(jt && min<720){
    var trHoje=vis.filter(function(b){ return b.k==="treino"; })[0];
    if(trHoje && !d.feitos[trHoje.id]){
      var hAtual=Math.floor(trHoje.t/60);
      if(Math.abs(hAtual-jt.melhor.h)>=2)
        add({tipo:"analise",pri:48,tom:"neutro",tit:"O treino renderia mais mais cedo",
          txt:"Está marcado para "+hhmm(trHoje.t)+", mas você conclui "+Math.round(jt.melhor.taxa*100)
            +"% dos treinos quando ficam entre "+pad(jt.melhor.h)+"h e "+pad(jt.melhor.h+2)+"h.",
          acao:{lab:"ajustar rotina",cmd:"ir-rotina"}});
    }
  }

  /* --- horário melhor para estudo --- */
  var je=melhorJanela("estudo",28);
  if(je && min<jt0Hora(je)){
    add({tipo:"analise",pri:46,tom:"neutro",tit:"Seu melhor horário de estudo é "+pad(je.melhor.h)+"h",
      txt:Math.round(je.melhor.taxa*100)+"% dos blocos concluídos nessa faixa, contra "
        +Math.round(je.pior.taxa*100)+"% às "+pad(je.pior.h)+"h. Se for cortar algo hoje, corte o de fora dessa janela.",
      acao:null});
  }

  /* --- tarefa com prazo estourando --- */
  var venc=N.filter(function(x){
    if(!x.prazo) return false;
    var p=progressoNota(x);
    if(p.total && p.feitos===p.total) return false;
    return diasAte(x.prazo)<=1;
  }).sort(function(a,b){ return diasAte(a.prazo)-diasAte(b.prazo); })[0];
  if(venc){
    var dv2=diasAte(venc.prazo);
    add({tipo:"atencao",pri:82,tom:dv2<0?"urgente":"atencao",
      tit:dv2<0?"Tarefa vencida":dv2===0?"Tarefa vence hoje":"Tarefa vence amanhã",
      txt:venc.txt.split("\n")[0].replace(/^\s*\[[ x]?\]\s*/i,"").slice(0,80)
        +(venc.pri==="alta"?" — marcada como alta prioridade.":"."),
      acao:{lab:"abrir notas",cmd:"tab:notas"}});
  }

  /* --- sem treino registrado --- */
  var semTreino=0;
  for(var st=1;st<=14;st++){
    if((S.dias[chave(diasAtras(st))]||{}).treino) break;
    semTreino++;
  }
  if(semTreino>=3 && semTreino<14){
    add({tipo:"atencao",pri:69,tom:"atencao",tit:"Sem treino há "+semTreino+" dias",
      txt:"Seu último treino registrado foi há "+semTreino+" dias. Se treinou e esqueceu de marcar, "
        +"vale registrar; se não treinou, um treino curto hoje já quebra a sequência.",
      acao:{lab:"abrir treino",cmd:"tab:treino"}});
  }

  /* --- meta perto de fechar --- */
  var quase=(S.metas2||[]).map(function(g){ return {g:g,P:progressoMeta(g)}; })
    .filter(function(x){ return x.P.estado!=="feita" && x.P.pct>=70 && x.P.falta>0
      && x.P.per.restantes>0 && x.P.modo!=="media"; })
    .sort(function(a,b){ return b.P.pct-a.P.pct; })[0];
  if(quase){
    add({tipo:"meta",pri:54,tom:"bom",tit:"Faltam "+fmtMeta(quase.P.falta,quase.g)+" para fechar",
      txt:'"'+quase.g.titulo+'" está em '+Math.round(quase.P.pct)+"%, com "+quase.P.per.restantes
        +" dias de "+(quase.g.escopo==="ano"?"ano":"mês")+" pela frente. No ritmo atual, dá.",
      acao:{lab:"ver metas",cmd:"tab:dados"}});
  }

  /* --- leitura da semana --- */
  var sem7=serieDias(7), p7=0, n7=0;
  sem7.forEach(function(x){ if(x.reg){ p7+=x.pct; n7++; } });
  if(n7>=4){
    add({tipo:"analise",pri:26,tom:p7/n7>=0.8?"bom":"neutro",
      tit:"Você concluiu "+Math.round(p7/n7*100)+"% da rotina nesta semana",
      txt:(p7/n7>=0.8?"Semana forte. ":"")+"Foram "+n7+" dias com registro nos últimos 7.",
      acao:null});
  }

  /* --- meta do mês em risco --- */
  var risco=(S.metas2||[]).map(function(g){ return {g:g,P:progressoMeta(g)}; })
    .filter(function(x){ return x.g.escopo==="mes" && x.P.estado==="atrasada" && x.P.per.restantes<=10 && x.P.per.restantes>0; })
    .sort(function(a,b){ return a.P.pct-b.P.pct; })[0];
  if(risco){
    add({tipo:"meta",pri:58,tom:"atencao",tit:'"'+risco.g.titulo+'" está atrasada',
      txt:Math.round(risco.P.pct)+"% com "+risco.P.per.restantes+" dias de mês restando. "
        +"Para fechar, o ritmo precisa subir para "+fmtMeta(risco.P.falta/risco.P.per.restantes,risco.g)+" por dia.",
      acao:{lab:"ver metas",cmd:"tab:dados"}});
  }

  /* --- domingo: relatório e plano --- */
  if(UI.agora.getDay()===0 && min>=600){
    var temP=Object.keys(S.planoEstudo||{}).some(function(k){ return k>hojeKey(); });
    if(!temP)
      add({tipo:"sugestao",pri:72,tom:"neutro",tit:"Semana sem plano",
        txt:"Montar o plano agora distribui as matérias pelos blocos de estudo dos próximos 7 dias, priorizando provas e dúvidas abertas.",
        acao:{lab:"montar plano",cmd:"psem-montar"}});
    add({tipo:"analise",pri:62,tom:"neutro",tit:"Relatório da semana pronto",
      txt:"Comparação com a semana anterior e três ajustes concretos, cada um baseado num número que o app já tem.",
      acao:{lab:"ver relatório",cmd:"tab:dados"}});
  }

  /* --- fallback --- */
  if(feitos && feitos===vis.length)
    add({tipo:"analise",pri:30,tom:"bom",tit:"Dia fechado",txt:"Todos os blocos concluídos. Não force mais nada.",acao:null});
  else if(feitos>=3)
    add({tipo:"analise",pri:20,tom:"bom",tit:feitos+" blocos fechados",txt:"O dia já está no lucro. Segue no próximo.",acao:null});
  else
    add({tipo:"sugestao",pri:10,tom:"neutro",tit:"Um de cada vez",txt:"Só o bloco do card acima importa agora. O resto pode esperar.",acao:null});

  r.forEach(function(x){
    if(!x.tipo) x.tipo = (x.tom==="urgente"||x.tom==="atencao") ? "atencao" : "sugestao";
  });
  return r.sort(function(a,b){ return b.pri-a.pri; });
}

/* ---------- ETAPA 3 · agregação ---------- */
function serieDias(n,offset){ return cache("sd:"+n+":"+(offset||0),function(){ return serieDiasCalc(n,offset); }); }
function serieDiasCalc(n,offset){
  offset=offset||0;
  var out=[];
  for(var i=n-1;i>=0;i--){
    var d=diasAtras(i+offset), k=chave(d), reg=S.dias[k]||null;
    var base=montarDia(d);
    var vis=reg?visiveis(reg,base):base;
    var f=reg?Object.keys(reg.feitos||{}).length:0;
    var min=somaMin(reg);
    out.push({d:d,k:k,reg:reg,
      pct: vis.length?Math.min(1,f/vis.length):0,
      feitos:f, total:vis.length, min:min,
      prot:num(reg&&reg.prot),
      agua:num(reg&&reg.agua),
      treino:reg?!!reg.treino:false,
      refs:reg?Object.keys(reg.refs||{}).length:0});
  }
  return out;
}
function sequencias(){ return cache("seq",sequenciasCalc); }
function sequenciasCalc(){
  var ks=Object.keys(S.dias).sort();
  if(!ks.length) return {atual:0,melhor:0};
  var melhor=0,run=0,anterior=null;
  ks.forEach(function(k){
    var reg=S.dias[k], f=Object.keys(reg.feitos||{}).length;
    var pp=k.split("-").map(Number), dt=new Date(pp[0],pp[1]-1,pp[2]);
    var base=montarDia(dt);
    var vis=visiveis(reg,base);
    var ok=vis.length?(f/vis.length)>=0.5:false;
    var seguido = anterior===null ? true : ((dt-anterior)/86400000)<=1.5;
    run = (ok&&seguido) ? run+1 : (ok?1:0);
    melhor=Math.max(melhor,run);
    anterior=dt;
  });
  var atual=0, hoje=new Date(UI.agora);
  for(var i=0;i<400;i++){
    var d=new Date(hoje); d.setDate(d.getDate()-i);
    var reg=S.dias[chave(d)];
    if(!reg){ if(i===0) continue; break; }
    var vis=visiveis(reg,montarDia(d));
    var f=Object.keys(reg.feitos||{}).length;
    if(vis.length && f/vis.length>=0.5) atual++;
    else if(i>0) break;
  }
  return {atual:atual,melhor:Math.max(melhor,atual)};
}
function porDiaSemana(n){ return cache("pds:"+n,function(){ return porDiaSemanaCalc(n); }); }
function porDiaSemanaCalc(n){
  var soma=[0,0,0,0,0,0,0], cnt=[0,0,0,0,0,0,0];
  serieDias(n).forEach(function(x){
    if(!x.reg) return;
    var w=x.d.getDay();
    soma[w]+=x.pct; cnt[w]++;
  });
  return soma.map(function(v,i){ return cnt[i]?v/cnt[i]:0; });
}
function variacao(atual,antes){
  if(!antes) return atual?100:0;
  return Math.round((atual-antes)/antes*100);
}

/* ---------- ETAPA 3 · gráficos ---------- */
function grafLinha(vals,cor,alt){
  var n=vals.length; if(!n) return "";
  var max=1; vals.forEach(function(v){ max=Math.max(max,v); });
  var pts=vals.map(function(v,i){
    return [(i/(n-1||1))*100, 38-(v/max)*34];
  });
  var linha=pts.map(function(pt,i){ return (i?"L":"M")+pt[0].toFixed(2)+" "+pt[1].toFixed(2); }).join(" ");
  var area=linha+" L100 40 L0 40 Z";
  var gid="grad"+(++seqGrad);   /* determinístico: facilita comparar renders */
  return '<div class="graf" style="--c:'+cor+';height:'+(alt||96)+'px">'
    +'<svg viewBox="0 0 100 40" preserveAspectRatio="none">'
    +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="'+cor+'" stop-opacity=".35"/>'
    +'<stop offset="100%" stop-color="'+cor+'" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#'+gid+')"/>'
    +'<path d="'+linha+'" fill="none" stroke="'+cor+'" stroke-width="1.6" '
    +'vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>'
    +'</svg><b class="graf-max">'+Math.round(max)+'</b></div>';
}
function grafBarras(vals,labs,cor,alt){
  var max=1; vals.forEach(function(v){ max=Math.max(max,v); });
  return '<div class="graf-b" style="--c:'+cor+'">'
    +'<div class="gb-bars" style="height:'+(alt||70)+'px">'
    +vals.map(function(v,i){
      return '<span class="gb"><i style="height:'+Math.max(2,v/max*100)+'%"></i></span>';
    }).join("")+'</div>'
    +(labs?'<div class="gb-labs">'+labs.map(function(l){ return '<span>'+l+'</span>'; }).join("")+'</div>':"")
    +'</div>';
}
function mapaCalor(serie){
  return '<div class="calor">'+serie.map(function(x){
    var t=x.d.getDate();
    return '<i style="opacity:'+(x.reg?(0.12+x.pct*0.62).toFixed(3):0.05)+'" title="'+t+'"></i>';
  }).join("")+'</div>';
}
function delta(v,sufixo){
  var cls=v>0?"up":v<0?"down":"";
  return '<span class="delta '+cls+'">'+(v>0?"+":"")+v+'%'+(sufixo||"")+'</span>';
}

function histBloco(id,n){ return cache("hb:"+id+":"+n,function(){ return histBlocoCalc(id,n); }); }
function histBlocoCalc(id,n){
  var f=0,t=0;
  for(var i=1;i<=n;i++){
    var reg=S.dias[chave(diasAtras(i))];
    if(!reg) continue;
    t++;
    if(reg.feitos&&reg.feitos[id]) f++;
  }
  return {f:f,t:t};
}
function prioDe(b){ return (b.p===undefined?1:b.p); }

/* Só a primeira letra: text-transform:capitalize deixava "3 De Agosto". */
function maiuscula(t){ return String(t).charAt(0).toUpperCase()+String(t).slice(1); }

function saudacao(){
  var h=UI.agora.getHours();
  if(h<5) return t("acordado");
  if(h<12) return t("bomDia");
  if(h<18) return t("boaTarde");
  return t("boaNoite");
}

/* o dashboard continua com um aviso só: o topo do motor de regras */
function avisoDia(){
  var t=motorRegras()[0];
  return {tom:t.tom, txt:t.txt, tipo:t.tipo||"sugestao", tit:t.tit};
}

function janelaMed(){
  if(!S.med.ativo) return null;
  return { ini:S.med.hora, fim:S.med.hora + S.med.horas*60 };
}
function dentroJanela(t){
  var j=janelaMed();
  return j ? (t>=j.ini && t<j.fim) : false;
}

/* =====================================================================
   COMPONENTES
   Trechos de marcação usados por mais de uma tela. Alterar aqui muda
   em todos os lugares de uma vez.

/* Linha de barra horizontal: rótulo, trilha proporcional e valor. */
function linhaBarra(rotulo,frac,valor,classe){
  var f=Math.max(0,Math.min(1,frac||0));
  return '<div class="barra-linha"><span class="barra-lab">'+esc(rotulo)+'</span>'
    +'<div class="btrack"><div class="bfill'+(classe?" "+classe:"")+'" style="width:'+(f*100)+'%"></div></div>'
    +'<span class="barra-v">'+valor+'</span></div>';
}

/* Item da linha do tempo, usado pelo Hoje e pelo Mês.
   `interativo` liga o toque para marcar/desmarcar (só o Hoje).
   `marcas`    exibe prioridade — o Mês é uma consulta e fica sem elas. */
function itemBloco(b,feito,estado,interativo,marcas,extras){
  var classes="bloco"+(estado?" "+estado:"")+(feito?" feito":"")
    +((marcas&&prioDe(b)===0)?" leve":"")
    +((marcas&&UI.pulso===b.id)?" pop":"");
  return '<li class="'+classes+'" style="--c:'+CORES[b.k]+'"'
    +(interativo?' data-a="marcar:'+escA(b.id)+'"':'')+'>'
    +'<span class="bl-hora">'+hhmm(b.t)+'</span>'
    +'<span class="bl-pino">'+icone(ICON[b.k],17)+'</span>'
    +'<span class="bl-tit">'+esc(b.titulo)
    +(b.e?'<i class="bl-ess">essencial</i>':'')
    +((marcas&&prioDe(b)===2)?'<i class="bl-alta">alta</i>':'')
    +(extras||'')+'</span>'
    +'<span class="bl-check">'+(feito?icone("check",16,2.3):"")+'</span></li>';
}

/* Minutos formatados de forma compacta: 45m, 1.5h. */
/* Corta com reticências: texto truncado seco parece bug. */
function corta(t,n){
  t=String(t||"");
  return t.length>n ? t.slice(0,n-1).trimEnd()+"…" : t;
}

function fmtMin(v){ return v>=60 ? (v/60).toFixed(1)+"h" : v+"m"; }

/* ================= render ================= */
function aplicarTema(){
  var t=(S.tema==="claro") ? "claro" : "escuro";
  document.body.setAttribute("data-tema", t);
  if(document.documentElement) document.documentElement.setAttribute("data-tema", t);
}

function render(){
  C={}; seqGrad=0;      /* invalida o cache e os ids do ciclo anterior */
  aplicarTema();
  var foco=document.activeElement;
  var fid=foco&&foco.getAttribute?foco.getAttribute("data-f"):null;
  var sel=foco&&foco.selectionStart;

  if(!UI.materia || S.materias.indexOf(UI.materia)<0) UI.materia=S.materias[0]||"";
  if(!UI.tag || tags().indexOf(UI.tag)<0) UI.tag=tags()[0];
  if(!UI.novaProva.materia || S.materias.indexOf(UI.novaProva.materia)<0) UI.novaProva.materia=S.materias[0]||"";

  var d=dia();
  var blocos=montarDia(UI.agora);
  var vis=d.sobrevivencia?blocos.filter(function(b){return b.e;}):blocos;
  var min=UI.agora.getHours()*60+UI.agora.getMinutes();

  var html="";
  if(UI.temAtualizacao){
    html += '<div class="atualizar"><div><b>Nova versão disponível</b>'
          + '<span>seus dados são preservados</span></div>'
          + '<button data-a="pwa-atualizar">Atualizar</button></div>';
  }
  if(tentSalvar>0){
    html += '<div class="alerta" style="background:#FF7A45"><div><b>App offline</b><span>tentando reconectar…</span></div></div>';
  }
  if(UI.alerta){
    html += '<div class="alerta"><div><b>'+esc(UI.alerta)+'</b><span>começou agora</span></div>'
          + '<button data-a="alerta-ok">ok</button></div>';
  }
  html += '<header class="top"><div>'
   + '<div class="eyebrow">'+NOMES_DIA[UI.agora.getDay()]+' · '+pad(UI.agora.getDate())+'/'+pad(UI.agora.getMonth()+1)+'</div>'
   + '<h1 class="logo">RITMO</h1></div>'
   + '<div class="top-dir"><span class="clock">'+hhmm(min)+'</span>'
   + '<button class="gear" data-a="ajustes" aria-label="Ajustes">'+icone("ajustes",17)+'</button></div></header><main>';

  var entrar = (UI.abaAnterior!==UI.aba);
  UI.abaAnterior=UI.aba;
  html = html.replace('<main>','<main'+(entrar?' class="entrar"':'')+'>');
  if(UI.aba==="hoje") html+=viewHoje(d,vis,min);
  if(UI.aba==="treino") html+=viewTreino(d);
  if(UI.aba==="estudo") html+=viewEstudo(d);
  if(UI.aba==="notas") html+=viewNotas();
  if(UI.aba==="mes") html+=viewMes();
  if(UI.aba==="dados") html+=viewDados();
  html+="</main>";
  if(UI.ajustes) html+=viewAjustes();

  var abas=[["hoje","Hoje","hoje"],["mes","Mês","calendario"],["treino","Treino","treino"],["estudo","Estudo","estudo"],["notas","Notas","notas"],["dados","Dados","dados"]];
  html+='<nav>'+abas.map(function(a){
    return '<button class="navbtn'+(UI.aba===a[0]?" on":"")+'" data-a="tab:'+a[0]+'" aria-label="'+a[1]+'">'
      +'<span class="navic">'+icone(a[2],21)+'</span>'+a[1]+'</button>';
  }).join("")+'</nav>';

  /* O relógio dispara um render a cada 20s. Se o resultado for igual ao
     que já está na tela, escrever no DOM só causaria trabalho de layout,
     perda de posição de rolagem e reinício de animações. */
  if(html===UI.ultimoHTML) return;
  UI.ultimoHTML=html;
  document.getElementById("app").innerHTML=html;
  UI.pulso=null;                  /* a animação de confirmação toca uma vez só */
  if(fid){
    var alvo=document.querySelector('[data-f="'+fid+'"]');
    if(alvo){ alvo.focus(); try{ alvo.setSelectionRange(sel,sel); }catch(e){} }
  }
}

/* ---- hoje ---- */
/* A tela responde três perguntas, nesta ordem:
   1. Como está meu dia?     -> saudação + barra de progresso
   2. O que faço agora?      -> card Agora, sozinho, sem concorrência
   3. Como está meu progresso? -> anéis + agenda curta                     */
function viewHoje(d,vis,min){
  var atual=null,prox=null;
  for(var i=0;i<vis.length;i++){
    if(min>=vis[i].t && min<vis[i].t+vis[i].dur) atual=vis[i];
    if(!prox && vis[i].t>min) prox=vis[i];
  }
  var cor=atual?CORES[atual.k]:"var(--fraco)";
  var feitos=vis.filter(function(b){return d.feitos[b.id];}).length;
  var pct=vis.length?Math.round(feitos/vis.length*100):0;
  var mm=somaMin(d);
  var h="";

  /* ---------- 1. como está meu dia ---------- */
  var dt=UI.agora;
  h+='<section class="dash-ola">'
   + '<span class="ola-data">'+maiuscula(NOMES_DIA[dt.getDay()])+', '+dt.getDate()
   + ' de '+MES_NOME[dt.getMonth()]+'</span>'
   + '<h2>'+saudacao()+(S.nome?', '+esc(S.nome):'')+'</h2>'
   + '</section>';

  h+='<div class="dia-barra"><div class="db-topo">'
   + '<span>'+pct+'% '+t("diaConcluido")+'</span><b>'+feitos+'/'+vis.length+'</b></div>'
   + '<div class="ptrack"><div class="pfill" style="width:'+pct+'%"></div></div></div>';

  /* ---------- 2. o que faço agora ---------- */
  h+='<section class="agora" style="--c:'+cor+'">';
  if(atual){
    var dec=Math.min(1,(min-atual.t)/atual.dur);
    var rev=atual.titulo.toLowerCase().indexOf("revis")===0;
    var mp=(atual.k==="estudo")?materiaDoBloco(hojeKey(),atual.id):null;
    h+='<div class="agora-bar" style="width:'+(dec*100)+'%"></div>'
      +'<div class="agora-tag"><i class="pulso"></i>agora</div>'
      +'<h2 class="agora-tit">'+esc(atual.titulo)+'</h2>'
      +'<div class="agora-meta">'+hhmm(atual.t)+' — '+hhmm(atual.t+atual.dur)
      +' <span class="agora-falta">faltam '+(atual.t+atual.dur-min)+' min</span></div>'
      +(mp?'<div class="agora-mat">matéria de hoje: <b>'+esc(mp)+'</b></div>':'')
      +(atual.nota?'<p class="agora-nota">'+esc(atual.nota)+'</p>':'')
      +'<div class="agora-acoes"><button class="agora-btn'+(d.feitos[atual.id]?" done":"")+'" data-a="marcar:'+escA(atual.id)+'">'
      +(d.feitos[atual.id]?"✓ feito":"marcar como feito")+'</button>'
      +'<button class="agora-nota-btn" data-a="anotar:'+(rev?1:0)+'">'+(rev?"escrever as 3 linhas":"anotar")+'</button></div>';
  } else {
    h+='<div class="agora-tag">agora</div><h2 class="agora-tit">Janela livre</h2>'
      +'<p class="agora-nota">'+(prox?"Nada agendado até "+hhmm(prox.t)+". Se sobrou energia, puxa o próximo pra frente."
        :"O dia acabou. Fecha o app e vai dormir.")+'</p>';
  }
  h+='</section>';

  /* próxima atividade, sozinha */
  if(prox){
    h+='<button class="dash-prox" data-a="marcar:'+escA(prox.id)+'" style="--c:'+CORES[prox.k]+'">'
      +'<span class="prox-ic">'+icone(ICON[prox.k],18)+'</span>'
      +'<span class="prox-txt"><em>a seguir · '+hhmm(prox.t)+'</em><b>'+esc(prox.titulo)+'</b></span>'
      +'<span class="prox-em">em '+(prox.t-min)+' min</span></button>';
  }

  /* ---------- 3. como está meu progresso ---------- */
  var ma=metaAgua(), mp2=metaProt();
  var refs=Object.keys(d.refs||{}).length;
  var anel=function(rot,valor,frac,cor,detalhe,acao){
    var r=17, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,frac)));
    return '<button class="anel-c"'+(acao?' data-a="'+acao+'"':'')+'>'
      +'<span class="anel"><svg width="42" height="42" viewBox="0 0 42 42">'
      +'<circle cx="21" cy="21" r="'+r+'" fill="none" stroke="var(--linha)" stroke-width="3.4"/>'
      +'<circle cx="21" cy="21" r="'+r+'" fill="none" stroke="'+cor+'" stroke-width="3.4" '
      +'stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" '
      +'transform="rotate(-90 21 21)"/></svg><i>'+valor+'</i></span>'
      +'<span class="anel-r">'+rot+'</span>'
      +'<span class="anel-d">'+detalhe+'</span></button>';
  };

  var metasAtivas=(S.metas2||[]).map(function(g){ return {g:g,P:progressoMeta(g)}; })
    .filter(function(x){ return x.P.pct<100; })
    .sort(function(a,b){ return b.P.pct-a.P.pct; });

  h+='<h3 class="sub">'+t("progressoDia")+'</h3><div class="aneis">'
   + anel(t("agua"), num(d.agua), num(d.agua)/ma, "var(--verde)", "de "+ma+" copos", null)
   + anel(t("estudo"), (mm>=60?(mm/60).toFixed(1)+"h":mm+"m"), Math.min(1,mm/120), "var(--azul)",
          "de 2h por dia", "tab:estudo")
   + anel(t("treino"), d.treino?"✓":"—", d.treino?1:0, "var(--laranja)",
          d.treino?esc(d.treino):"não feito", "tab:treino")
   + anel(t("comida"), refs+"/"+REFEICOES.length, refs/REFEICOES.length, "var(--ambar)",
          num(d.prot)+"g de "+mp2+"g", null)
   + (metasAtivas.length
      ? anel(t("metas"), Math.round(metasAtivas[0].P.pct)+"%", metasAtivas[0].P.pct/100, "var(--roxo)",
             esc(metasAtivas[0].g.titulo), "tab:dados")
      : "")
   + '</div>';

  /* ---------- resumo da semana e do mês ---------- */
  var s7=serieDias(7), s30=serieDias(30);
  var agrega=function(serie){
    var o={min:0,treinos:0,pct:0,n:0,blocos:0};
    serie.forEach(function(x){
      o.min+=x.min; if(x.treino) o.treinos++;
      o.blocos+=x.feitos;
      if(x.reg){ o.pct+=x.pct; o.n++; }
    });
    o.media=o.n?o.pct/o.n:0;
    return o;
  };
  var A7=agrega(s7), A30=agrega(s30);
  /* Descanso = tempo dos blocos de base concluídos (pausas, livre, sono). */
  var descanso=0;
  vis.forEach(function(b){ if(b.k==="base" && d.feitos[b.id]) descanso+=b.dur; });
  var seqD=sequencias();

  h+='<h3 class="sub">Resumo</h3>'
   + '<div class="resumo-g">'
   + '<div class="rg"><span>'+t("semanaAtual")+'</span>'
   +   '<b>'+Math.round(A7.media*100)+'%</b>'
   +   '<i>'+(A7.min/60).toFixed(1)+'h de estudo · '+A7.treinos+' treinos</i></div>'
   + '<div class="rg"><span>'+t("mesAtual")+'</span>'
   +   '<b>'+Math.round(A30.media*100)+'%</b>'
   +   '<i>'+(A30.min/60).toFixed(1)+'h de estudo · '+A30.treinos+' treinos</i></div>'
   + '</div>'
   + '<div class="dash-resumo">'
   + metrica(fmtMin(mm),t("tempoProdutivo"), Math.min(1,mm/240), 'var(--azul)')
   + metrica(fmtMin(descanso),t("tempoDescanso"), Math.min(1,descanso/180), 'var(--verde)')
   + metrica(A30.blocos+'',t("tarefasConcluidas"), Math.min(1,A30.blocos/200), 'var(--roxo)')
   + metrica(seqD.atual+'',t("sequencia"), Math.min(1,seqD.atual/21), 'var(--laranja)')
   + '</div>';

  /* ---------- assistente: uma mensagem só ---------- */
  var av=avisoDia(), vz=VOZES[av.tipo]||VOZES.sugestao;
  h+='<div class="dash-aviso '+av.tom+'"><span class="aviso-ic"></span>'
   + '<div class="aviso-txt"><span class="voz">'+vz.ic+' '+vz.lab+'</span>'
   + '<p>'+esc(av.txt)+'</p></div></div>';

  /* proposta de replanejamento, quando pedida */
  if(UI.plano){
    var pl=UI.plano;
    h+='<div class="plano"><div class="plano-top"><b>Proposta para o resto do dia</b>'
      +'<span>nada muda até você confirmar</span></div>';
    if(!pl.mudancas.length && !pl.cortados.length){
      h+='<p class="plano-vazio">Nada a remanejar: o que sobrou já cabe nos horários atuais.</p>';
    } else {
      h+='<ul class="plano-lista">'+pl.mudancas.map(function(m){
        return '<li><span class="pl-tit">'+esc(m.titulo)+'</span>'
          +'<span class="pl-de">'+hhmm(m.de)+'</span><span class="pl-seta">→</span>'
          +'<span class="pl-para">'+hhmm(m.para)+'</span></li>';
      }).join("")+'</ul>';
      if(pl.cortados.length){
        var tres=pl.cortados.slice(0,3).map(function(b){ return esc(b.titulo); }).join(", ");
        var resto=pl.cortados.length-3;
        h+='<p class="plano-corte">Não cabe hoje: '+tres+(resto>0?" e mais "+resto:"")+'. '
          +(pl.cortados.length>=4?"O dia já estava cheio demais — escolher o que cai é parte do trabalho."
            :"Fica para amanhã.")+'</p>';
      }
      h+='<p class="plano-nota">A aula e os blocos já feitos não se movem. Isso vale só para hoje.</p>';
    }
    h+='<div class="plano-btns">'
      +(pl.mudancas.length?'<button class="btn-salvar" data-a="plano-ok">aplicar só hoje</button>':'')
      +'<button class="btn-ghost-mini" data-a="plano-nao">cancelar</button></div></div>';
  } else if(d.ajuste){
    h+='<div class="plano aplicado"><div class="plano-top"><b>Horários remanejados hoje</b>'
      +'<span>válido só para hoje</span></div>'
      +'<div class="plano-btns"><button class="btn-ghost-mini" data-a="plano-undo">voltar aos horários originais</button></div></div>';
  }

  /* sugestões seguintes */
  var sug=motorRegras().slice(1).filter(function(x){ return x.pri>=40; }).slice(0,2);
  if(sug.length){
    h+='<h3 class="sub">Assistente Ritmo</h3><div class="sugs">'
      +sug.map(function(x){
        var v=VOZES[x.tipo]||VOZES.sugestao;
        return '<div class="sug '+x.tom+'"><span class="sug-ic"></span><div class="sug-txt">'
          +'<span class="voz">'+v.ic+' '+v.lab+'</span>'
          +'<b>'+esc(x.tit)+'</b><p>'+esc(x.txt)+'</p>'
          +(x.acao?'<button class="sug-btn" data-a="'+x.acao.cmd+'">'+esc(x.acao.lab)+' →</button>':'')
          +'</div></div>';
      }).join("")+'</div>';
  }

  /* medicação */
  var jm=janelaMed();
  if(jm){
    var ativo = min>=jm.ini && min<jm.fim;
    h += '<div class="med'+(ativo?" on":"")+'"><span class="med-dot"></span><div class="med-txt">'
      + (d.med?"Medicação tomada hoje":"Você tomou a medicação hoje?")
      + '<em>'+(ativo?"janela ativa até "+hhmm(jm.fim):"janela: "+hhmm(jm.ini)+" → "+hhmm(jm.fim))+'</em></div>'
      + '<button class="med-btn" data-a="med-check">'+(d.med?"✓ sim":"marcar")+'</button></div>';
  }

  /* ---------- agenda: só o que vem, com opção de abrir o dia ---------- */
  var restantes=vis.filter(function(b){ return b.t+b.dur>min; });
  var lista = UI.diaTodo ? vis : restantes.slice(0,4);
  h+='<h3 class="sub">'+t("agenda")+'</h3>';
  if(!lista.length){
    h+='<div class="vazio">Nada mais agendado hoje.</div>';
  } else {
    h+='<ul class="timeline">'+lista.map(function(b){
      var feito=!!d.feitos[b.id];
      var estado=(atual&&atual.id===b.id)?"atual":((min>=b.t+b.dur&&!feito)?"passou":"");
      var pico=(b.k==="estudo")&&dentroJanela(b.t);
      var mpb=(b.k==="estudo")?materiaDoBloco(hojeKey(),b.id):null;
      return itemBloco(b,feito,estado,true,true,
        (mpb?'<i class="bl-mat">'+esc(mpb)+'</i>':'')+(pico?'<i class="bl-pico">na janela</i>':''));
    }).join("")+'</ul>';
  }
  if(vis.length>lista.length || UI.diaTodo)
    h+='<button class="ver-dia" data-a="dia-todo">'
      +(UI.diaTodo?"mostrar só o que vem":"ver o dia inteiro ("+vis.length+" blocos)")+'</button>';

  /* sobrevivência */
  h+='<button class="sobrev'+(d.sobrevivencia?" on":"")+'" data-a="sobrev"><span class="sdot"></span><span>'
    +'<strong>Modo sobrevivência</strong><em>'
    +(d.sobrevivencia?"só o essencial. dia salvo é dia que não zerou."
      :"dia ruim? liga aqui e a rotina encolhe pro mínimo.")
    +'</em></span></button>';

  /* comida */
  h+='<h3 class="sub">Comida de hoje</h3><div class="refs">'
    +REFEICOES.map(function(r){ return '<button class="ref'+(d.refs[r]?" on":"")+'" data-a="ref:'+escA(r)+'">'+r+'</button>'; }).join("")
    +'</div>';
  var pctProt=Math.max(0,Math.min(100,num(d.prot)/mp2*100));
  h+='<div class="medidor"><div class="med-top"><span>Proteína</span><b>'+num(d.prot)+' / '+mp2+' g</b></div>'
    +'<div class="ptrack"><div class="pfill prot" style="width:'+pctProt+'%"></div></div>'
    +'<div class="quick"><button data-a="prot:20">+20g</button><button data-a="prot:30">+30g</button>'
    +'<button data-a="prot:40">+40g</button><button class="undo" data-a="prot:-20">−20g</button></div></div>';
  var copos="";
  for(var c=0;c<ma;c++) copos+='<button class="copo'+(c<d.agua?" on":"")+'" data-a="agua:'+c+'" aria-label="copo '+(c+1)+'"></button>';
  h+='<div class="medidor"><div class="med-top"><span>Água</span><b>'+num(d.agua)+' / '+ma+' copos</b></div>'
    +'<div class="copos">'+copos+'</div></div>';
  return h;
}

function metrica(valor,rotulo,frac,cor){
  var f=Math.max(0,Math.min(1,frac||0));
  return '<div class="mtr" style="--c:'+cor+'"><b>'+valor+'</b><span>'+rotulo+'</span>'
    +'<div class="mtr-tr"><div class="mtr-fl" style="width:'+(f*100)+'%"></div></div></div>';
}

/* ---- treino ---- */
function viewTreino(d){
  var t=TREINOS[S.rotacao];
  function ultimo(n){ return (S.cargas[n]&&S.cargas[n][0])||null; }
  function est(n){
    var u=ultimo(n),a=UI.reg[n];
    if(!u||!a||!a.kg||!a.reps) return "";
    var v=Number(a.kg)*Number(a.reps), va=u.kg*u.reps;
    return v>va?"up":v<va?"down":"eq";
  }
  var preench=Object.keys(UI.reg).filter(function(k){ return UI.reg[k].kg&&UI.reg[k].reps; }).length;
  var h='<div class="eyebrow" style="padding-top:8px">próximo treino da rotação</div>'
    +'<h2 class="treino-nome">'+t.nome+'</h2><div class="treino-foco">'+t.foco+'</div>'
    +'<p class="explica">Anote a série mais pesada. Se o volume (kg × reps) passou o da última vez, você progrediu — é isso que constrói músculo, não o check.</p>';
  h+='<ul class="exs">'+t.ex.map(function(e,i){
    var u=ultimo(e[0]),st=est(e[0]),r=UI.reg[e[0]]||{};
    var seta=st==="up"?"↑":st==="down"?"↓":st==="eq"?"=":"";
    return '<li class="ex'+(st?" "+st:"")+'"><div class="ex-head"><span class="ex-n">'+pad(i+1)+'</span>'
      +'<span class="ex-nome">'+esc(e[0])+'</span><span class="ex-series">'+e[1]+'</span></div>'
      +'<div class="ex-carga"><span class="ex-ult">'+(u?"último: "+u.kg+"kg × "+u.reps:"primeira vez")+'</span>'
      +'<input class="in" type="number" inputmode="decimal" placeholder="kg" value="'+(r.kg||"")+'" data-f="kg'+i+'" data-ex="'+escA(e[0])+'" data-campo="kg">'
      +'<span class="xx">×</span>'
      +'<input class="in" type="number" inputmode="numeric" placeholder="reps" value="'+(r.reps||"")+'" data-f="rp'+i+'" data-ex="'+escA(e[0])+'" data-campo="reps">'
      +'<span class="seta">'+seta+'</span></div></li>';
  }).join("")+'</ul>';
  h+='<button class="btn-grande" data-a="treino-ok">Concluir '+t.nome+' ('+preench+'/'+t.ex.length+' anotados) →</button>';
  if(d.treino) h+='<div class="flash">✓ '+esc(d.treino)+' registrado hoje</div>';
  h+='<div class="fila"><h3 class="sub">A fila</h3>'
    +TREINOS.map(function(x,i){ return '<span class="fila-item'+(i===S.rotacao?" on":"")+'">'+x.nome+'</span>'; }).join("")+'</div>';

  /* volume semanal e mensal */
  var v7=volumeTreino(7), v30=volumeTreino(30);
  var treinos30=0;
  for(var q=0;q<30;q++){
    if((S.dias[chave(diasAtras(q))]||{}).treino) treinos30++;
  }
  h+='<h3 class="sub">Volume</h3><div class="dash-resumo">'
    + metrica(Math.round(v7.vol/1000)+'<i>t</i>','7 dias', Math.min(1,v7.vol/30000), 'var(--laranja)')
    + metrica(Math.round(v30.vol/1000)+'<i>t</i>','30 dias', Math.min(1,v30.vol/120000), 'var(--laranja)')
    + metrica(v7.series+'','séries 7d', Math.min(1,v7.series/60), 'var(--laranja)')
    + metrica(treinos30+'','treinos 30d', Math.min(1,treinos30/20), 'var(--verde)')
    + '</div>'
    + '<p class="explica">Volume = carga × repetições somadas, em toneladas. É o número que mais se correlaciona com ganho de massa ao longo dos meses.</p>';

  /* recordes e evolução */
  var comHist=Object.keys(S.cargas||{}).filter(function(n){ return (S.cargas[n]||[]).length; });
  if(comHist.length){
    h+='<h3 class="sub">Recordes pessoais</h3><div class="prs">'
      +comHist.map(function(n){
        var r=recorde(n), hi=S.cargas[n];
        var ehHoje = hi[0] && (hi[0].kg*hi[0].reps)===(r.kg*r.reps);
        return '<div class="pr'+(ehHoje?" novo":"")+'"><span class="pr-nome">'+esc(n)+'</span>'
          +'<b>'+r.kg+'<i>kg</i> × '+r.reps+'</b>'
          +(ehHoje?'<em>atual</em>':'')+'</div>';
      }).join("")+'</div>';

    h+='<h3 class="sub">Evolução por exercício</h3>';
    h+=comHist.filter(function(n){ return S.cargas[n].length>=2; }).map(function(n){
      var hi=S.cargas[n].slice().reverse();
      var vals=hi.map(function(r){ return r.kg*r.reps; });
      var pri=vals[0], ult=vals[vals.length-1];
      var dif=Math.round((ult-pri)/pri*100);
      return '<div class="evo"><div class="evo-top"><span>'+esc(n)+'</span>'
        +'<b class="'+(dif>0?"up":dif<0?"down":"")+'">'+(dif>0?"+":"")+dif+'%</b></div>'
        + miniGrafico(vals,'var(--laranja)',34)
        +'<div class="evo-pe">'+hi.length+' sessões · '+hi[0].kg+'kg → '+hi[hi.length-1].kg+'kg</div></div>';
    }).join("") || '<div class="vazio">Registre a mesma carga duas vezes para ver a curva de evolução.</div>';
  }
  return h;
}

/* ---- estudo ---- */
function viewEstudo(d){
  /* se há plano e o usuário ainda não escolheu à mão, o pomodoro já vem
     com a matéria do bloco de estudo atual (ou do próximo do dia). */
  if(!UI.materiaTocada){
    var minA=UI.agora.getHours()*60+UI.agora.getMinutes(), kk=hojeKey(), alvo=null;
    montarDia(UI.agora).forEach(function(b){
      if(b.k!=="estudo") return;
      var mm=materiaDoBloco(kk,b.id);
      if(!mm) return;
      if(minA>=b.t && minA<b.t+b.dur) alvo=mm;
      else if(!alvo && b.t>minA) alvo=mm;
    });
    if(alvo && S.materias.indexOf(alvo)>=0) UI.materia=alvo;
  }
  var fut=S.provas.filter(function(p){ return diasAte(p.data)>=0; }).sort(function(a,b){ return a.data.localeCompare(b.data); });
  var h='<h3 class="sub" style="margin-top:10px">Provas</h3>';
  if(fut.length){
    h+='<div class="provas">'+fut.map(function(p){
      var n=diasAte(p.data);
      return '<div class="prova'+(n<=7?" perto":"")+'"><b>'+(n===0?"hoje":n)+'</b>'
        +'<span>'+(n===0?"":n===1?"dia":"dias")+'</span><em>'+esc(p.materia)+'</em>'
        +'<button data-a="prova-del:'+p.id+'">✕</button></div>';
    }).join("")+'</div>';
  }
  h+='<div class="add-prova"><select class="in-sel" data-f="psel">'
    +S.materias.map(function(m){ return '<option'+(m===UI.novaProva.materia?" selected":"")+'>'+esc(m)+'</option>'; }).join("")
    +'</select><input class="in-data" type="date" data-f="pdata" value="'+UI.novaProva.data+'">'
    +'<button class="btn-salvar" data-a="prova-add">+</button></div>';

  /* --- plano da semana --- */
  var temPlano=Object.keys(S.planoEstudo||{}).some(function(k){ return k>=hojeKey(); });
  h+='<h3 class="sub">Plano da semana</h3>';
  if(UI.planoSem){
    var ps=UI.planoSem;
    if(!ps.itens.length){
      h+='<div class="vazio">Não há blocos de estudo nos próximos 7 dias. Adicione blocos de estudo na rotina primeiro.</div>'
        +'<div class="plano-btns"><button class="btn-ghost-mini" data-a="psem-nao">fechar</button></div>';
    } else {
      h+='<div class="plano"><div class="plano-top"><b>Proposta para 7 dias</b>'
        +'<span>'+ps.itens.length+' blocos · nada muda até você confirmar</span></div>';
      var diaAtual="";
      h+='<ul class="psem">'+ps.itens.map(function(x){
        var cab="";
        if(x.data!==diaAtual){
          diaAtual=x.data;
          cab='<li class="psem-dia">'+NOMES_DIA[x.dia.getDay()]+' '+pad(x.dia.getDate())+'/'+pad(x.dia.getMonth()+1)+'</li>';
        }
        return cab+'<li class="psem-item"><span class="psem-h">'+hhmm(x.t)+'</span>'
          +'<span class="psem-txt"><b>'+esc(x.materia)+'</b><em>'+esc(x.motivo)+'</em></span></li>';
      }).join("")+'</ul>';
      var tot=ps.totais;
      h+='<div class="psem-tot">'+Object.keys(tot).sort(function(a,b){ return tot[b]-tot[a]; })
        .map(function(m){ return '<span>'+esc(m)+' <b>'+fmtMin(tot[m])+'</b></span>'; }).join("")+'</div>'
        +'<p class="plano-nota">Isso só define qual matéria cai em cada bloco de estudo. Horários e rotina não mudam.</p>'
        +'<div class="plano-btns"><button class="btn-salvar" data-a="psem-ok">usar este plano</button>'
        +'<button class="btn-ghost-mini" data-a="psem-nao">cancelar</button></div></div>';
    }
  } else if(temPlano){
    var prox=[];
    for(var pi=0;pi<7;pi++){
      var pd=diasFrente(pi), pk=chave(pd);
      montarDia(pd).forEach(function(b){
        if(b.k!=="estudo") return;
        var mm=materiaDoBloco(pk,b.id);
        if(mm) prox.push({d:pd,t:b.t,m:mm});
      });
    }
    h+='<div class="psem-ativo">'+prox.slice(0,6).map(function(x){
        return '<div class="psem-linha"><span>'+NOMES_DIA[x.d.getDay()].slice(0,3)+' '+hhmm(x.t)+'</span>'
          +'<b>'+esc(x.m)+'</b></div>';
      }).join("")+'</div>'
      +'<div class="plano-btns"><button class="btn-ghost-mini" data-a="psem-montar">refazer plano</button>'
      +'<button class="btn-ghost-mini" data-a="psem-limpar">remover</button></div>';
  } else {
    h+='<div class="vazio">Distribui as matérias pelos blocos de estudo dos próximos 7 dias, com base nas provas marcadas, nas dúvidas abertas e no tempo que cada uma já recebeu.</div>'
      +'<button class="btn-grande roxo" data-a="psem-montar" style="margin-top:10px">montar plano da semana</button>';
  }

  h+='<h3 class="sub">Bloco de estudo</h3><div class="materias">'
    +S.materias.map(function(m){ return '<button class="mat'+(m===UI.materia?" on":"")+'" data-a="mat:'+escA(m)+'">'+esc(m)+'</button>'; }).join("")
    +'</div>';

  var cfp=cfgPomo();
  h+='<div class="pomo-fases">'+[["foco","Foco",cfp.foco],["curto","Pausa curta",cfp.curto],
      ["longo","Pausa longa",cfp.longo]].map(function(x){
      return '<button class="pfase'+(UI.fase===x[0]?" on":"")+'" data-a="pomo-fase:'+x[0]+'">'
        +x[1]+'<i>'+x[2]+'min</i></button>';
    }).join("")+'</div>';
  var total=segundosDaFase(UI.fase),frac=1-UI.seg/total,R=74,C=2*Math.PI*R;
  h+='<div class="pomo"><svg viewBox="0 0 180 180" class="ring">'
    +'<circle cx="90" cy="90" r="'+R+'" class="ring-bg"></circle>'
    +'<circle cx="90" cy="90" r="'+R+'" class="ring-fg" id="ring" style="stroke-dasharray:'+C+';stroke-dashoffset:'+(C*(1-frac))+';stroke:'+(UI.fase==="foco"?"var(--azul)":UI.fase==="curto"?"var(--verde)":"var(--laranja)")+'"></circle>'
    +'</svg><div class="pomo-in"><div class="pomo-t" id="reloj">'+pad(Math.floor(UI.seg/60))+':'+pad(UI.seg%60)+'</div>'
    +'<div class="pomo-l">'+(UI.fase==="foco"?"foco":UI.fase==="curto"?"pausa curta":"pausa longa")+'</div>'
    +'<div class="pomo-c">'+ciclosHoje()+' de '+cfp.ate+' até a longa</div></div></div>'
    +'<div class="pomo-btns"><button class="btn-grande roxo" data-a="pomo">'+(UI.rodando?"pausar":"começar")+'</button>'
    +'<button class="btn-ghost" data-a="pomo-zerar">zerar</button></div>';

  var max=50; S.materias.forEach(function(m){ max=Math.max(max,d.minutos[m]||0); });
  h+='<h3 class="sub">Hoje por matéria</h3><div class="barras">'
    +S.materias.map(function(m){
        var v=num(d.minutos[m]);
        return linhaBarra(m, v/max, v+"m");
      }).join("")+'</div>';

  /* horas: hoje, semana, mês */
  var sem=serieEstudo(7), mes=serieEstudo(30);
  var somaSem=0; sem.forEach(function(x){ somaSem+=x.min; });
  var somaMes=0; mes.forEach(function(x){ somaMes+=x.min; });
  var hojeMin=sem[sem.length-1].min;
  h+='<h3 class="sub">Horas estudadas</h3>'
    +'<div class="dash-resumo">'
    + metrica((hojeMin/60).toFixed(1)+'<i>h</i>','hoje', Math.min(1,hojeMin/180), 'var(--roxo)')
    + metrica((somaSem/60).toFixed(1)+'<i>h</i>','7 dias', Math.min(1,somaSem/900), 'var(--roxo)')
    + metrica((somaMes/60).toFixed(1)+'<i>h</i>','30 dias', Math.min(1,somaMes/3600), 'var(--roxo)')
    + metrica((somaSem/7/60).toFixed(1)+'<i>h</i>','média/dia', Math.min(1,somaSem/7/180), 'var(--verde)')
    + '</div>';

  /* gráfico semanal */
  h+='<h3 class="sub">Últimos 7 dias</h3>'
    + miniGrafico(sem.map(function(x){ return x.min; }), 'var(--roxo)', 58)
    + '<div class="spark-lab">'+sem.map(function(x){
        return '<span>'+NOMES_DIA[x.d.getDay()][0].toUpperCase()+'</span>'; }).join("")+'</div>';

  /* gráfico mensal */
  h+='<h3 class="sub">Últimos 30 dias</h3>'
    + miniGrafico(mes.map(function(x){ return x.min; }), 'var(--verde)', 44)
    + '<p class="explica">Cada barra é um dia. Buraco isolado não é problema — sequência de buracos é.</p>';

  /* tempo por matéria em 30 dias */
  var pm=porMateria(30), maxPM=1;
  S.materias.forEach(function(m){ maxPM=Math.max(maxPM,pm[m]||0); });
  h+='<h3 class="sub">Tempo por matéria · 30 dias</h3><div class="barras">'
    +S.materias.map(function(m){
        var v=num(pm[m]);
        return linhaBarra(m, v/maxPM, fmtMin(v));
      }).join("")+'</div>';

  /* histórico do pomodoro */
  var cic=(S.pomo.ciclos||[]);
  if(cic.length){
    var serie14=[], labs=[];
    for(var ci=13;ci>=0;ci--){
      var kd=chave(diasAtras(ci));
      serie14.push(cic.filter(function(x){ return x.data===kd && x.fase==="foco"; }).length);
      labs.push(ci%2===0?String(diasAtras(ci).getDate()):"");
    }
    var totalCic=cic.filter(function(x){ return x.fase==="foco"; }).length;
    var minFoco=cic.reduce(function(a,x){ return a+(x.fase==="foco"?num(x.min):0); },0);
    var pausas=cic.filter(function(x){ return x.fase!=="foco"; }).length;
    h+='<h3 class="sub">Pomodoro</h3><div class="dash-resumo">'
      + metrica(ciclosHoje()+'','ciclos hoje', Math.min(1,ciclosHoje()/8), 'var(--azul)')
      + metrica(totalCic+'','ciclos no total', Math.min(1,totalCic/100), 'var(--azul)')
      + metrica(fmtMin(minFoco)+'','tempo focado', Math.min(1,minFoco/3000), 'var(--roxo)')
      + metrica(pausas+'','pausas', Math.min(1,pausas/100), 'var(--verde)')
      + '</div>'
      + '<div class="cartao"><div class="cartao-top"><span>Ciclos por dia · 14 dias</span></div>'
      + grafBarras(serie14, labs, '#6B8AFF', 62)
      + '<div class="cartao-pe">média de <b>'+(serie14.reduce(function(a,b){return a+b;},0)/14).toFixed(1)
      + '</b> ciclos por dia</div></div>';
  }

  /* revisões: o que está esfriando */
  var revs=S.materias.map(function(m){
      return {m:m, dias:ultimoEstudo(m)};
    }).filter(function(x){ return x.dias===null || x.dias>=3; })
      .sort(function(a,b){ return (b.dias===null?99:b.dias)-(a.dias===null?99:a.dias); });
  h+='<h3 class="sub">Revisar</h3>';
  if(!revs.length){
    h+='<div class="vazio">Nenhuma matéria parada há mais de 3 dias. Está tudo circulando.</div>';
  } else {
    h+='<div class="provas">'+revs.map(function(x){
      var lab = x.dias===null ? "nunca" : "há "+x.dias+"d";
      return '<div class="prova'+(x.dias===null||x.dias>=7?" perto":"")+'"><b>'+lab+'</b>'
        +'<span>sem tocar</span><em>'+esc(x.m)+'</em></div>';

/* =====================================================================
   CALENDÁRIO
   Eventos podem repetir. A recorrência é calculada na leitura — nada é
   materializado no banco, então mudar a regra corrige o passado e o
   futuro de uma vez.
   ===================================================================== */
var RECORRENCIAS=[["","Não repete"],["d","Todo dia"],["u","Dias úteis"],
                  ["s","Toda semana"],["m","Todo mês"]];

/* O evento cai nesta data? */
function eventoNoDia(ev,dataK,dt){
  if(ev.data===dataK) return true;
  if(!ev.rec) return false;
  if(dataK<ev.data) return false;
  var p=ev.data.split("-").map(Number);
  var origem=new Date(p[0],p[1]-1,p[2]);
  var difDias=Math.round((dt-origem)/86400000);
  if(difDias<0) return false;
  if(ev.rec==="d") return true;
  if(ev.rec==="u") return dt.getDay()>=1 && dt.getDay()<=5;
  if(ev.rec==="s") return difDias%7===0;
  if(ev.rec==="m") return dt.getDate()===origem.getDate();
  return false;
}
function eventosDoDia(dataK,dt){
  return (S.eventos||[]).filter(function(e){ return eventoNoDia(e,dataK,dt); })
    .sort(function(a,b){ return (a.hora==null?9999:a.hora)-(b.hora==null?9999:b.hora); });
}

    var vis=x.reg?visiveis(x.reg,montarDia(x.d)):montarDia(x.d);
    var pct=vis.length?Math.min(1,feitos/vis.length):0;
    return '<button class="sem-dia'+(x.k===hojeK?" hoje":"")+(x.k===UI.diaSel?" sel":"")+'" '
      +'data-a="sem-dia:'+escA(x.k)+'">'

      + x.provas.map(function(p){ return '<i class="sd-p sd-prova">'+esc(corta(p.materia,11))+'</i>'; }).join("")
      + x.evs.slice(0,3).map(function(e){

      + x.blocos.filter(function(b){ return b.e; }).slice(0,3).map(function(b){

          +' · '+FONTES[g.fonte].lab+'</em>'
          +'<span class="meta-selos">'
          +(g.categoria?'<i class="selo cat" style="color:'+(CAT_META[g.categoria]||CAT_META.outra).cor+'">'
             +(CAT_META[g.categoria]||CAT_META.outra).lab+'</i>':'')
          +(g.prioridade&&g.prioridade!=="normal"?'<i class="selo pri-'+esc(g.prioridade)+'">'+esc(g.prioridade)+'</i>':'')
          +(function(){
              var dp=diasParaPrazo(g);
              if(dp===null) return '';
              return '<i class="selo prazo'+(dp<0?" venceu":dp<=3?" perto":"")+'">'
                +(dp<0?"venceu":dp===0?"prazo hoje":"prazo em "+dp+"d")+'</i>';
            })()
          +'</span></div>'
          +'<button class="meta-x" data-a="meta-del:'+escA(g.id)+'">✕</button></div>'
          +'<div class="meta-num"><b>'+fmtMeta(P.acum,g)+'</b><span>de '+fmtMeta(g.alvo,g)+'</span>'
          +'<i class="meta-pct">'+Math.round(P.pct)+'%</i></div>'
          +'<div class="ptrack"><div class="pfill" style="width:'+barra+'%;background:'+cor+'"></div></div>'
          + grafMeta(P.serie, g.alvo, cor)
          +'<div class="meta-linhas">'
          +'<span><em>restam</em>'+P.per.restantes+' dias</span>'
          +'<span><em>ritmo</em>'+fmtMeta(P.ritmo*(g.escopo==="ano"?30:7),g)+(g.escopo==="ano"?"/mês":"/sem")+'</span>'
          +'<span><em>previsão</em>'+(P.modo==="media"?fmtMeta(P.previsto,g):fmtMeta(P.previsto,g))+'</span>'
          +'<span class="est '+P.estado.replace(" ","-")+'"><em>situação</em>'+P.estado+'</span>'
          +'</div>';
        if(P.dataPrevista && P.estado!=="feita")
          x+='<p class="meta-nota'+(P.dataPrevista>P.per.fim?' fora-do-prazo':'')+'">'
            +'No ritmo atual, você chega ao alvo em '+dataCurta(P.dataPrevista)
            +(P.dataPrevista>P.per.fim
               ? ' — depois do fim do período. Para fechar a tempo seriam '
                 +fmtMeta(P.falta/Math.max(1,P.per.restantes),g)+' por dia.'
               : '.')+'</p>';
        else if(P.estado==="feita")
          x+='<p class="meta-nota feita">Meta batida. Nada a fazer aqui.</p>';
        else if(!P.ritmo)
          x+='<p class="meta-nota">Sem progresso ainda — não dá pra projetar.</p>';
        if(g.obs) x+='<p class="meta-obs">'+esc(g.obs)+'</p>';
        if(g.fonte==="manual")
          x+='<div class="meta-manual"><input class="in-larga" type="number" inputmode="decimal" '
            +'data-metaval="'+escA(g.id)+'" value="'+num(g.valor)+'">'
            +'<button class="btn-ghost-mini" data-a="meta-inc:'+escA(g.id)+'">+'+(g.passo||1)+'</button></div>';
        return x+'</div>';
      }).join("");
    } else {
      h+='<div class="vazio">Nenhuma meta ainda. As de horas, treinos, rotina e água se atualizam sozinhas com o que você já registra; livros e dinheiro você informa.</div>';
    }
    h+='<h3 class="sub">Adicionar</h3><div class="modelos">'
      +MODELOS.filter(function(m){
          return !(S.metas2||[]).some(function(g){ return g.titulo===m.titulo; });
        }).map(function(m,i){
          return '<button class="modelo" data-a="meta-add:'+MODELOS.indexOf(m)+'">'
            +'<span>'+esc(m.titulo)+'</span><i>'+(m.escopo==="ano"?"ano":"mês")+'</i></button>';
        }).join("")+'</div>';
    if(UI.metaForm){
      h+='<div class="cartao"><input class="in-texto" data-f="mtit" placeholder="Nome da meta" value="'+escA(UI.novaMeta.titulo)+'" style="margin-bottom:8px">'
        +'<div class="tipos">'+ESCOPOS.map(function(e){
            return '<button class="tipo'+(UI.novaMeta.escopo===e[0]?" on":"")+'" data-a="mesc:'+e[0]+'">'+e[1]+'</button>';
          }).join("")+'</div>'
        +'<div class="metas" style="margin-bottom:8px">'
        +'<label>Categoria<select class="in-larga" data-f="mcat">'
        +Object.keys(CAT_META).map(function(c){
            return '<option value="'+c+'"'+(UI.novaMeta.categoria===c?" selected":"")+'>'+CAT_META[c].lab+'</option>';
          }).join("")+'</select></label>'
        +'<label>Prioridade<select class="in-larga" data-f="mpri">'
        +["normal","alta","baixa"].map(function(x){
            return '<option value="'+x+'"'+(UI.novaMeta.prioridade===x?" selected":"")+'>'+x+'</option>';
          }).join("")+'</select></label></div>'
        +'<label class="rot-campo">Prazo (opcional)<input class="in-larga" type="date" data-f="mprazo" value="'+escA(UI.novaMeta.prazo||"")+'"></label>'
        +'<label class="rot-campo">Observações<input class="in-texto" data-f="mobs" placeholder="Por que essa meta importa" value="'+escA(UI.novaMeta.obs||"")+'"></label>'
        +'<select class="in-cat" data-f="mfonte" style="width:100%;margin-bottom:8px">'
        +Object.keys(FONTES).map(function(k){
            return '<option value="'+k+'"'+(UI.novaMeta.fonte===k?" selected":"")+'>'+FONTES[k].lab+'</option>';
          }).join("")+'</select>'
        +'<input class="in-larga" type="number" inputmode="decimal" data-f="malvo" placeholder="Alvo" value="'+(UI.novaMeta.alvo||"")+'">'
        +'<div class="plano-btns" style="margin-top:10px"><button class="btn-salvar" data-a="meta-criar">criar meta</button>'
        +'<button class="btn-ghost-mini" data-a="meta-form">cancelar</button></div></div>';
    } else {
      h+='<button class="btn-ghost" data-a="meta-form">+ criar meta personalizada</button>';
    }
    return h;
  }

  if(!nReg){
    return h+'<div class="vazio">Ainda não há registro nesse período. Marque alguns blocos no Hoje e as estatísticas aparecem sozinhas.</div>';
  }

  /* destaques */
  h+='<div class="dash-resumo">'
    + metrica(seq.atual+'','sequência', Math.min(1,seq.atual/14), 'var(--verde)')
    + metrica(seq.melhor+'','recorde', Math.min(1,seq.melhor/21), 'var(--roxo)')
    + metrica(produtivos+'<i>/'+nReg+'</i>','dias bons', nReg?produtivos/nReg:0, 'var(--roxo)')
    + metrica(Math.round(somaPct/(nReg||1)*100)+'<i>%</i>','rotina média', somaPct/(nReg||1), 'var(--ambar)')
    + '</div>';

  /* ---- rotina ---- */
  if(mostra("rotina")){
    h+='<h3 class="sub">Rotina</h3>'
      + blocoLeitura("rotina",n);
    var T=turnos(Math.max(n,28));
    var tl=[["manha","manhã"],["tarde","tarde"],["noite","noite"]].filter(function(x){ return T[x[0]].t>0; });
    if(tl.length)
      h+='<div class="dash-resumo" style="grid-template-columns:repeat('+tl.length+',1fr)">'
        +tl.map(function(x){
          return metrica(Math.round((T[x[0]].taxa||0)*100)+'<i>%</i>', x[1], T[x[0]].taxa||0,
            'var(--roxo)');
        }).join("")+'</div>';
    var mr=medias(function(x){ return x.pct; },n);
    h+='<div class="dash-resumo">'
      + metrica(Math.round(mr.dia*100)+'<i>%</i>','média/dia',mr.dia,'var(--roxo)')
      + metrica(Math.round(somaPct/(nReg||1)*100)+'<i>%</i>','período',somaPct/(nReg||1),'var(--roxo)')
      + metrica(produtivos+'','dias bons',nReg?produtivos/nReg:0,'var(--verde)')
      + metrica((nReg-produtivos)+'','dias fracos',nReg?(nReg-produtivos)/nReg:0,'var(--ambar)')
      + '</div>'
      + mapaCalor(atual)
      + '<div class="graf-nota"><span>há '+n+' dias</span><span>hoje</span></div>';
    var ds=porDiaSemana(n);
    h+='<div class="cartao"><div class="cartao-top"><span>Conclusão por dia da semana</span>'
      + delta(variacao(somaPct/(nReg||1), aPct/(aNR||1)))+'</div>'
      + grafBarras(ds.map(function(v){ return Math.round(v*100); }),
          ["D","S","T","Q","Q","S","S"], 'var(--roxo)', 64)+'</div>';
    var pior=0; ds.forEach(function(v,k){ if(v<ds[pior]) pior=k; });
    var melhor=0; ds.forEach(function(v,k){ if(v>ds[melhor]) melhor=k; });
    if(ds[melhor]>0)
      h+='<p class="explica">Seu melhor dia é '+NOMES_DIA[melhor]+' ('+Math.round(ds[melhor]*100)+'%) e o pior é '
        +NOMES_DIA[pior]+' ('+Math.round(ds[pior]*100)+'%). Se a diferença for grande, o problema é o desenho daquele dia — não a sua disciplina.</p>';
  }

  /* ---- estudos ---- */
  if(mostra("estudo")){
    var sm=sessaoMedia(n);
    h+='<h3 class="sub">Estudos</h3>'
      + blocoLeitura("estudo",n)
      + '<div class="dash-resumo">'
      + metrica(Math.round(sm.media)+'<i>min</i>','por sessão',Math.min(1,sm.media/90),'var(--roxo)')
      + metrica(sm.dias+'','dias com estudo',n?sm.dias/n:0,'var(--roxo)')
      + metrica((somaMin/60/Math.max(1,n/7)).toFixed(1)+'<i>h</i>','por semana',Math.min(1,somaMin/60/Math.max(1,n/7)/15),'var(--verde)')
      + metrica((somaMin/60/Math.max(1,n/30)).toFixed(0)+'<i>h</i>','por mês',Math.min(1,somaMin/60/Math.max(1,n/30)/60),'var(--verde)')
      + '</div>'
      +'<div class="cartao"><div class="cartao-top"><span>Minutos por dia</span>'
      + delta(variacao(somaMin,aMin))+'</div>'
      + grafLinha(atual.map(function(x){ return x.min; }), '#7C6BFF', 100)
      + '<div class="cartao-pe"><b>'+(somaMin/60).toFixed(1)+'h</b> no período · média de '
      + Math.round(somaMin/n)+' min/dia</div></div>';

    var pm=porMateria(n), maxPM=1;
    S.materias.forEach(function(m){ maxPM=Math.max(maxPM,pm[m]||0); });
    h+='<div class="barras">'+S.materias.map(function(m){
        var v=num(pm[m]);
        return linhaBarra(m, v/maxPM, fmtMin(v));
      }).join("")+'</div>';
  }

  /* ---- treino ---- */
  if(mostra("treino")){
    var semanas=Math.max(1,Math.ceil(n/7)), volSem=[], labSem=[];
    for(var w=semanas-1;w>=0;w--){
      var v=volumeTreino((w+1)*7).vol - volumeTreino(w*7).vol;
      volSem.push(Math.round(v/1000));
      labSem.push(w===0?"atual":"-"+w);
    }
    volSem.reverse(); labSem.reverse();
    var tp=treinoPerdidos(n);
    h+='<h3 class="sub">Treino</h3>'
      + blocoLeitura("treino",n)
      + '<div class="dash-resumo">'
      + metrica(treinos+'','feitos',Math.min(1,treinos/(n/7*4)),'var(--laranja)')
      + metrica(tp.perdidos+'','perdidos',tp.agendados?tp.perdidos/tp.agendados:0,'var(--rosa)')
      + metrica(Math.round((tp.taxa||0)*100)+'<i>%</i>','aproveitamento',tp.taxa||0,'var(--verde)')
      + metrica((treinos/Math.max(1,n/7)).toFixed(1)+'','por semana',Math.min(1,treinos/Math.max(1,n/7)/5),'var(--laranja)')
      + '</div>'
      +'<div class="cartao"><div class="cartao-top"><span>Volume por semana (t)</span>'
      + delta(variacao(treinos,aTreinos))+'</div>'
      + grafBarras(volSem,labSem,'#FF7A45',64)
      + '<div class="cartao-pe"><b>'+treinos+'</b> treinos em '+n+' dias</div></div>';

    var evo=Object.keys(S.cargas||{}).filter(function(x){ return (S.cargas[x]||[]).length>=2; });
    if(evo.length){
      h+='<div class="barras">'+evo.slice(0,12).map(function(x){
        var hi=S.cargas[x], a=hi[hi.length-1].kg*hi[hi.length-1].reps, b=hi[0].kg*hi[0].reps;
        var dif=Math.round((b-a)/a*100);
        return '<div class="carga-linha"><span class="barra-lab">'+esc(x)+'</span>'
          +'<span class="carga-v">'+hi[0].kg+'kg × '+hi[0].reps+'</span>'
          +'<span class="carga-dif '+(dif>0?"up":dif<0?"down":"")+'">'+(dif>0?"+":"")+dif+'%</span></div>';
      }).join("")+'</div>';
    }
  }

  /* ---- comida ---- */
  if(mostra("comida")){
    var mediaP=nProt?Math.round(somaProt/nProt):0;
    var mediaA=nAgua?(somaAgua/nAgua).toFixed(1):0;
    var cp=consistencia("prot",n), ca=consistencia("agua",n);
    h+='<h3 class="sub">Comida</h3>'
      + blocoLeitura("comida",n)
      + '<div class="dash-resumo">'
      + metrica(Math.round((cp.taxa||0)*100)+'<i>%</i>','proteína na meta',cp.taxa||0,'var(--ambar)')
      + metrica(Math.round((ca.taxa||0)*100)+'<i>%</i>','água na meta',ca.taxa||0,'var(--verde)')
      + metrica(cp.melhor+'','melhor sequência',Math.min(1,cp.melhor/14),'var(--ambar)')
      + metrica((mediaProteinaSemana(n)).toFixed(0)+'<i>g</i>','média semanal',Math.min(1,mediaProteinaSemana(n)/metaProt()),'var(--ambar)')
      + '</div>'
      +'<div class="cartao"><div class="cartao-top"><span>Proteína por dia (g)</span>'
      + delta(variacao(mediaP, aNP?Math.round(aProt/aNP):0))+'</div>'
      + grafLinha(atual.map(function(x){ return x.prot; }), '#E0B23C', 92)
      + '<div class="cartao-pe">média de <b>'+mediaP+' g</b> · meta '+metaProt()+' g</div></div>'
      +'<div class="cartao"><div class="cartao-top"><span>Água por dia (copos)</span></div>'
      + grafBarras(atual.slice(-14).map(function(x){ return x.agua; }), null, '#2BB3A3', 54)
      + '<div class="cartao-pe">média de <b>'+mediaA+' copos</b> · meta '+metaAgua()+'</div></div>';
  }

  /* ---- prioridade (preservado) ---- */
  if(mostra("estudo")||foco==="tudo"){
    var abertas=N.filter(function(x){ return x.duvida&&!x.resolvida; });
    var resolv=N.filter(function(x){ return x.duvida&&x.resolvida; }).length;
    var mins=porMateria(n);
    h+='<h3 class="sub">Prioridade</h3>';
    if(!abertas.length && !S.provas.length){
      h+='<div class="vazio">'+(resolv?"Nenhuma dúvida aberta. Você já fechou "+resolv+"."
        :"Cadastre as datas das provas e registre dúvidas na revisão — aqui aparece por onde começar.")+'</div>';
    } else {
      var linhas=S.materias.map(function(m){
        var dv=abertas.filter(function(x){ return x.tag===m; }).length;
        var hh=(mins[m]||0)/60;
        var pr=S.provas.filter(function(x){ return x.materia===m&&diasAte(x.data)>=0; })
                       .sort(function(a,b){ return a.data.localeCompare(b.data); })[0];
        var dp=pr?diasAte(pr.data):null;
        var urg=dp===null?1:Math.min(6,Math.max(1,14/Math.max(1,dp)));
        return {m:m,dv:dv,h:hh,dp:dp,score:((dv+0.5)/(hh+0.5))*urg};
      }).sort(function(a,b){ return b.score-a.score; });
      var top=linhas[0], maxDv=1;
      linhas.forEach(function(x){ maxDv=Math.max(maxDv,x.dv); });
      var partes=[];
      if(top.dv) partes.push(top.dv+(top.dv===1?" dúvida aberta":" dúvidas abertas"));
      partes.push(top.h<1?"menos de 1h estudada":Math.round(top.h)+"h estudadas");
      if(top.dp!==null) partes.push(top.dp===0?"prova é hoje":"prova em "+top.dp+(top.dp===1?" dia":" dias"));
      h+='<div class="veredito"><div class="eyebrow">comece por aqui</div><h4>'+esc(top.m)+'</h4>'
        +'<p>'+partes.join(" · ")+'. É a pior combinação entre o que você não entendeu, o tempo dado à matéria e a proximidade da prova.</p></div>'
        +'<div class="barras">'+linhas.map(function(x){
            return linhaBarra(x.m, x.dv/maxDv, (x.dp!==null?x.dp+"d":(x.dv||"—")), "dv");
          }).join("")+'</div>'
        +'<p class="explica">'+abertas.length+' dúvidas abertas · '+resolv+' fechadas.</p>';
    }
  }
  return h;
}

/* ---- ajustes ---- */
function viewAjustes(){

    ["rotina","lista","Rotina do dia","Horários, blocos, o que é essencial"],
    ["materias","estudo","Matérias","Nomes usados no estudo, provas e notas"],
    ["remedio","remedio","Medicação e foco","Janela de efeito e check diário"],
    ["alertas","sino","Lembretes","Avisos no app e horários pro celular"],
    ["metas","dieta","Comida e água","Meta de proteína e copos por dia"],
    ["aparencia","tema","Aparência","Escuro ou claro"],
    ["aplicativo","celular","Aplicativo","Instalação, versão e armazenamento"],
    ["exportar","baixar","Exportar","Relatório em PDF e planilha"],
    ["backup","cofre","Backup","Salvar e restaurar seus dados"]

  if(!atual){
    h+='<ul class="menu">'+MENU.map(function(m){
      return '<li><button data-a="sec:'+escA(m[0])+'"><span class="menu-ic">'+icone(m[1],17)+'</span>'
        +'<span class="menu-txt"><b>'+m[2]+'</b><em>'+m[3]+'</em></span>'
        +'<span class="menu-seta">'+icone("seta",16)+'</span></button></li>';
    }).join("")+'</ul>'
    +'<p class="explica">Tudo aqui é opcional. Se estiver funcionando, não mexe.</p>'
    +'</div></div>';
    return h;
  }

  if(UI.sec==="aparencia"){
    var temas=[["escuro","Escuro","O padrão. Melhor pra usar à noite."],
               ["claro","Claro","Fundo branco, pra sol na tela."]];
    h+=temas.map(function(t){
      var on=(S.tema||"escuro")===t[0];
      return '<button class="tema-op'+(on?" on":"")+'" data-a="tema:'+escA(t[0])+'">'
        +'<span class="tema-bola '+t[0]+'"></span><span class="tema-txt"><b>'+t[1]+'</b><em>'+t[2]+'</em></span>'
        +'<span class="tema-ck">'+(on?"✓":"")+'</span></button>';
    }).join("");
    h+='<p class="explica">O escuro é o padrão porque à noite, que é quando o app mais é aberto, tela clara atrapalha o sono.</p>'
      +'<h3 class="sub">Idioma</h3>'
      +'<select class="in-larga" data-f="idioma" style="width:100%">'
      +Object.keys(IDIOMAS).map(function(k){
          return '<option value="'+k+'"'+((S.idioma||"pt-BR")===k?" selected":"")+'>'+IDIOMAS[k].nome+'</option>';
        }).join("")+'</select>'
      +'<p class="explica">A tradução cobre a tela inicial e os rótulos principais. '
      +'O conteúdo que você escreve — blocos, matérias, notas — fica como está.</p>'
      +'<h3 class="sub">Seu nome</h3>'
      +'<input class="in-texto" data-f="nome" placeholder="Como quer ser chamado" value="'+escA(S.nome||"")+'">'
      +'<p class="explica">Usado só na saudação da tela inicial. Deixe em branco se preferir sem nome.</p>';
  }

  if(UI.sec==="materias"){
    h+='<ul class="lista-ed">'+S.materias.map(function(m,i){
      return '<li><input class="in-texto" value="'+esc(m)+'" data-mat="'+i+'" data-f="mat'+i+'">'
        +'<button class="del" data-a="mat-del:'+i+'">✕</button></li>';
    }).join("")+'</ul>'
    +'<button class="btn-ghost" data-a="mat-add">+ adicionar matéria</button>'
    +'<h3 class="sub">Categorias das notas</h3>'
    +'<ul class="lista-ed">'+(S.categorias||[]).map(function(c,i){
      return '<li><input class="in-texto" value="'+esc(c)+'" data-cat="'+i+'" data-f="cat'+i+'">'
        +'<button class="del" data-a="cat-del:'+i+'">✕</button></li>';
    }).join("")+'</ul>'
    +'<button class="btn-ghost" data-a="cat-add">+ adicionar categoria</button>'
    +'<p class="explica">Renomear não apaga anotações antigas: elas continuam com a tag do nome anterior.</p>';
  }

  if(UI.sec==="rotina"){
    h+='<div class="tipos">'+Object.keys(BLOCOS_PADRAO).map(function(k){
        return '<button class="tipo'+(UI.tipo===k?" on":"")+'" data-a="tipo:'+escA(k)+'">'+NOME_TEMPLATE[k]+'</button>';
      }).join("")+'</div>';

    var destinos=Object.keys(BLOCOS_PADRAO).filter(function(k){ return k!==UI.tipo; });
    h+='<div class="rot-acoes"><span>Copiar este dia para:</span>'
      +destinos.map(function(k){
        return '<button class="btn-ghost-mini" data-a="rot-copiar:'+escA(k)+'">'+NOME_TEMPLATE[k]+'</button>';
      }).join("")+'</div>';

    var lista=(S.blocos[UI.tipo]||[]).slice().sort(function(a,b){ return a.t-b.t; });
    var PRIO=[["baixa","baixa"],["normal","normal"],["alta","alta"]];

function horaDe(qual){
  var b=S.blocos.semana||[];
  function acha(f){ var r=b.filter(f).sort(function(x,y){return x.t-y.t;})[0]; return r?r.t:0; }
  if(qual==="treino") return acha(function(x){ return x.k==="treino"; });
  if(qual==="estudo") return acha(function(x){ return x.k==="estudo"; });
  if(qual==="aula") return acha(function(x){ return x.k==="aula"; });
  if(qual==="revisao"){
    var r=b.filter(function(x){ return x.k==="estudo"; }).sort(function(x,y){return y.t-x.t;})[0];
    return r?r.t:0;
  }
  return 0;
}

  if(ds.f==="evtit"){ UI.novoEv.titulo=t.value; return; }
  if(ds.f==="evrec"){ UI.novoEv.rec=t.value; render(); return; }
  if(ds.f==="pdata"){ UI.novaProva.data=t.value; return; }
  if(ds.f==="psel"){ UI.novaProva.materia=t.value; return; }

  if(ds.bl){

    if(!b) return;
    if(ds.campo==="t"){ var p=t.value.split(":").map(Number); if(!isNaN(p[0])) b.t=p[0]*60+p[1]; }
    else if(ds.campo==="dur") b.dur=Math.max(5,Number(t.value)||5);
    else if(ds.campo==="titulo") b.titulo=t.value;
    else if(ds.campo==="k") b.k=t.value;

  if(ds.med){

    else S.med.horas=Math.min(24,Math.max(1,Number(t.value)||1));

function acao(cmd,arg){
  var d=dia();
  if(cmd==="tab"){ UI.aba=arg; render(); return; }
  if(cmd==="mes"){
    if(!UI.mesRef) UI.mesRef=new Date(UI.agora.getFullYear(),UI.agora.getMonth(),1);
    UI.mesRef=new Date(UI.mesRef.getFullYear(),UI.mesRef.getMonth()+Number(arg),1);
    render(); return;
  }
  if(cmd==="dsel"){ UI.diaSel=arg; render(); return; }
  if(cmd==="per"){ UI.per=Number(arg); render(); return; }
  if(cmd==="foco"){ UI.foco=arg; render(); return; }
  if(cmd==="cal-vista"){ UI.vistaCal=arg; render(); return; }
  if(cmd==="sem"){
    var b=UI.semanaRef?new Date(UI.semanaRef):new Date(UI.agora);
    b.setDate(b.getDate()+Number(arg)*7); UI.semanaRef=b; render(); return;
  }
  if(cmd==="sem-dia"){ UI.diaSel=arg; UI.vistaCal="mes"; render(); return; }
  if(cmd==="ev-edit"){
    var alvo=(S.eventos||[]).filter(function(e){ return String(e.id)===arg; })[0];
    if(alvo){
      UI.novoEv={id:alvo.id, hora:alvo.hora!=null?hhmm(alvo.hora):"", titulo:alvo.titulo, rec:alvo.rec||""};
      render();
    }
    return;
  }
  if(cmd==="ev-add"){
    var tit=(UI.novoEv.titulo||"").trim();
    if(!tit) return;
    var hr=null;
    if(UI.novoEv.hora){ var ph=UI.novoEv.hora.split(":").map(Number); hr=ph[0]*60+ph[1]; }
    if(UI.novoEv.id){
      /* edição: preserva o id e a data de origem da recorrência */
      S.eventos=(S.eventos||[]).map(function(e){
        return String(e.id)===String(UI.novoEv.id)
          ? Object.assign({},e,{hora:hr,titulo:tit,rec:UI.novoEv.rec||""}) : e;
      });
    } else {
      S.eventos=(S.eventos||[]).concat([{id:uid("e"),data:UI.diaSel,hora:hr,
        titulo:tit,rec:UI.novoEv.rec||""}]);
    }
    UI.novoEv={hora:"",titulo:"",rec:""};
    salvar(); render(); return;
  }
  if(cmd==="ev-del"){
    S.eventos=(S.eventos||[]).filter(function(e){ return String(e.id)!==arg; });
    salvar(); render(); return;
  }
  if(cmd==="ajustes"){ UI.ajustes=true; UI.sec=null; UI.msg=""; render(); return; }
  if(cmd==="ajustes-fechar"||cmd==="fechar-fundo"){ UI.ajustes=false; UI.sec=null; UI.msg=""; render(); return; }
  if(cmd==="sec-voltar"){ UI.sec=null; UI.msg=""; render(); return; }
  if(cmd==="sec"){ UI.sec=arg; UI.msg=""; UI.expMsg=""; render(); return; }
  if(cmd==="tipo"){ UI.tipo=arg; render(); return; }
  if(cmd==="alerta-ok"){ UI.alerta=null; render(); return; }

  if(cmd==="tema"){ S.tema=arg; salvar(); render(); return; }
  if(cmd==="mat-add"){ S.materias.push("Nova matéria"); salvar(); render(); return; }
  if(cmd==="mat-del"){
    if(S.materias.length<=1) return;
    S.materias.splice(Number(arg),1); salvar(); render(); return;
  }
  if(cmd==="bl-add"){
    S.blocos[UI.tipo].push(B(uid(),720,"Novo bloco","base",30,0,""));
    salvar(); render(); return;
  }
  if(cmd==="bl-del"){
    S.blocos[UI.tipo]=S.blocos[UI.tipo].filter(function(x){ return x.id!==arg; });
    salvar(); render(); return;
  }
  if(cmd==="bl-sobe" || cmd==="bl-desce"){
    var arr=(S.blocos[UI.tipo]||[]).slice().sort(function(x,y){ return x.t-y.t; });
    var pos=-1; arr.forEach(function(x,n){ if(x.id===arg) pos=n; });
    var alvo=cmd==="bl-sobe"?pos-1:pos+1;
    if(pos<0||alvo<0||alvo>=arr.length) return;
    var tmp=arr[pos].t; arr[pos].t=arr[alvo].t; arr[alvo].t=tmp;
    salvar(); render(); return;
  }
  if(cmd==="bl-dup"){
    var o=(S.blocos[UI.tipo]||[]).filter(function(x){ return x.id===arg; })[0];
    if(!o) return;
    var novoT=Math.min(1435,o.t+o.dur);
    S.blocos[UI.tipo].push(B(uid(),novoT,o.titulo,o.k,o.dur,o.e,o.nota));
    var criado=S.blocos[UI.tipo][S.blocos[UI.tipo].length-1];
    criado.p=prioDe(o);
    salvar(); render(); return;
  }
  if(cmd==="bl-prio"){
    var bp=(S.blocos[UI.tipo]||[]).filter(function(x){ return x.id===arg; })[0];
    if(bp){ bp.p=(prioDe(bp)+1)%3; salvar(); render(); }
    return;
  }
  if(cmd==="rot-copiar"){
    if(!BLOCOS_PADRAO[arg]) return;
    S.blocos[arg]=JSON.parse(JSON.stringify(S.blocos[UI.tipo])).map(function(x){
      x.id=uid(); return x;
    });
    UI.msg="Rotina copiada para "+NOME_TEMPLATE[arg]+".";
    salvar(); render(); return;
  }
  if(cmd==="bl-ess"){
    var b=S.blocos[UI.tipo].filter(function(x){ return x.id===arg; })[0];
    if(b){ b.e=!b.e; salvar(); render(); }
    return;
  }
  if(cmd==="restaurar"){
    S.blocos[UI.tipo]=JSON.parse(JSON.stringify(BLOCOS_PADRAO[UI.tipo]));
    salvar(); render(); return;
  }
  if(cmd==="med-toggle"){ S.med.ativo=!S.med.ativo; salvar(); render(); return; }
  if(cmd==="med-check"){ mudarDia({med:!d.med}); return; }
  if(cmd==="alertas-toggle"){ S.alertas=!S.alertas; salvar(); render(); return; }
  if(cmd==="pedir-perm"){
    try{
      if(window.Notification) Notification.requestPermission().then(function(p){
        if(p==="granted"){
          var n=agendarAvisos();
          UI.msg="Notificações liberadas. "+n+" aviso(s) agendado(s) para as próximas horas. "
                +"Com o app fechado, o celular pode não entregar — mantenha também os lembretes do sistema.";
        } else UI.msg="O navegador não liberou. Use os Lembretes do celular.";
        render();
      });
      else { UI.msg="Este navegador não suporta notificação aqui. Use os Lembretes."; render(); }
    }catch(e){ UI.msg="Não deu pra pedir permissão. Use os Lembretes do celular."; render(); }
    return;
  }
  if(cmd==="pwa-instalar"){
    PWA.instalar().then(function(r){
      UI.pwaMsg = r==="aceito" ? "Instalado. Procure o ícone do Ritmo na tela de início."
                : r==="recusado" ? "Instalação cancelada. Dá para tentar de novo quando quiser."
                : "Este navegador não oferece instalação automática.";
      render();
    });
    return;
  }
  if(cmd==="pwa-atualizar"){ UI.temAtualizacao=false; PWA.aplicarAtualizacao(); return; }
  if(cmd==="pwa-diag"){
    Persistencia.diagnostico().then(function(d){
