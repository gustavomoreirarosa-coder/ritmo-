/* Tradução com queda para pt-BR e, por fim, para a própria chave. */
function t(chave){
  var id=(typeof S!=="undefined" && S && S.idioma) ? S.idioma : "pt-BR";
  var d=IDIOMAS[id]||IDIOMAS["pt-BR"];
  return d[chave]!==undefined ? d[chave] : (IDIOMAS["pt-BR"][chave]!==undefined ? IDIOMAS["pt-BR"][chave] : chave);
}

/* ================= helpers ================= */
function pad(n){ return String(n).padStart(2,"0"); }
function hhmm(m){ m=((m%1440)+1440)%1440; return pad(Math.floor(m/60))+":"+pad(m%60); }
function chave(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function tipoDia(d){ return d.getDay()===6?"sabado":d.getDay()===0?"domingo":"semana"; }
function montarDia(d){
  return cache("md:"+chave(d), function(){ return montarDiaCalc(d); });
}
function montarDiaCalc(d){
  var lista=(S.blocos[tipoDia(d)]||[]).slice();
  var aj=(S.dias[chave(d)]||{}).ajuste;
  if(aj) lista=lista.map(function(b){
    return (aj[b.id]!=null) ? {id:b.id,t:aj[b.id],titulo:b.titulo,k:b.k,dur:b.dur,e:b.e,nota:b.nota,p:b.p} : b;
  });
  return lista.sort(function(a,b){ return a.t-b.t; });
}
function diasAte(iso){
  var base=(typeof UI!=="undefined" && UI && UI.agora)?UI.agora:new Date();
  var h=new Date(base.getFullYear(),base.getMonth(),base.getDate());
  var p=iso.split("-").map(Number);
  return Math.round((new Date(p[0],p[1]-1,p[2])-h)/86400000);
}
/* Escape para valores que viram ARGUMENTO de ação dentro de um atributo.
   Sem isto, uma matéria chamada Cálculo "Aplicado" truncava o atributo
   e o botão parava de funcionar. */
function escA(v){
  return String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;")
                  .replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
var _seqId=0;
/* Identificador único mesmo em criações no mesmo milissegundo:
   tempo em base36 + contador de sessão + ruído. */
function uid(pref){
  _seqId++;
  return (pref||"b")+Date.now().toString(36)+"-"+_seqId.toString(36)
    +Math.floor(Math.random()*1296).toString(36);
}


/* =====================================================================
   PERSISTÊNCIA — IndexedDB com degradação em cascata
   ---------------------------------------------------------------------
   Ordem de tentativa: IndexedDB -> window.storage (artifact) -> memória.
   O app inteiro fala só com Persistencia; nada acima daqui sabe qual
   camada está ativa. Dados nunca são apagados automaticamente.
   ===================================================================== */
var DB = (function(){
  var NOME="ritmoDB", VERSAO=1, conexao=null;

  /* Cada store guarda um pedaço coeso do estado. Chaves são naturais
     (data ou id), o que torna a escrita idempotente e evita duplicação. */
  var STORES={
    rotina:        "id",     /* moldes de blocos: semana, sabado, domingo   */
    tarefas:       "data",   /* blocos feitos/ajustados em cada dia         */
    notas:         "id",     /* anotações e dúvidas                         */
    treino:        "nome",   /* histórico de carga por exercício            */
    provas:        "id",     /* datas de prova                              */
    calendario:    "id",     /* compromissos                                */
    configuracoes: "id",     /* metas diárias, tema, matérias, remédio…     */
    estatisticas:  "data",   /* minutos de estudo por dia e matéria         */
    hidratacao:    "data",   /* copos de água por dia                       */
    alimentacao:   "data",   /* proteína e refeições por dia                */
    progresso:     "id"      /* metas de longo prazo e seu andamento        */
  };

  function suportado(){
    try{ return typeof indexedDB!=="undefined" && indexedDB!==null; }catch(e){ return false; }
  }

  async function abrir(){
    if(conexao) return conexao;
    if(!suportado()) throw new Error("IndexedDB indisponível neste ambiente");
    conexao = await new Promise(function(ok,erro){
      var req;
      try{ req=indexedDB.open(NOME,VERSAO); }
      catch(e){ return erro(e); }

      /* Migração de versões: cada faixa cria só o que ainda não existe,
         então subir a versão no futuro nunca destrói dados antigos. */
      req.onupgradeneeded=function(ev){
        var bd=ev.target.result, de=ev.oldVersion;
        console.info("[Ritmo] migrando banco da versão",de,"para",VERSAO);
        if(de<1){
          Object.keys(STORES).forEach(function(nome){
            if(!bd.objectStoreNames.contains(nome))
              bd.createObjectStore(nome,{keyPath:STORES[nome]});
          });
        }
        /* if(de<2){ ...alterações futuras aqui, sem apagar nada... } */
      };
      req.onsuccess=function(){ ok(req.result); };
      req.onerror=function(){ erro(req.error||new Error("falha ao abrir o banco")); };
      req.onblocked=function(){ erro(new Error("banco bloqueado por outra aba aberta")); };
    });
    conexao.onversionchange=function(){ try{ conexao.close(); }catch(e){} conexao=null; };
    return conexao;
  }

  function transacao(stores,modo){
    return abrir().then(function(bd){ return bd.transaction(stores,modo); });
  }
  function promessa(req){
    return new Promise(function(ok,erro){
      req.onsuccess=function(){ ok(req.result); };
      req.onerror=function(){ erro(req.error); };
    });
  }

  return {
    stores:STORES,
    suportado:suportado,
    abrir:abrir,

    /* salvar / atualizar — put é upsert, então servem aos dois casos */
    async salvar(store,obj){
      var tx=await transacao([store],"readwrite");
      await promessa(tx.objectStore(store).put(obj));
      return obj;
    },
    async salvarVarios(store,lista){
      if(!lista.length) return 0;
      var tx=await transacao([store],"readwrite");
      var os=tx.objectStore(store);
      lista.forEach(function(o){ os.put(o); });
      await new Promise(function(ok,erro){
        tx.oncomplete=ok; tx.onerror=function(){ erro(tx.error); };
      });
      return lista.length;
    },
    async atualizar(store,chave,mudancas){
      var atual=await this.buscar(store,chave);
      var novo=Object.assign({},atual||{},mudancas);
      return this.salvar(store,novo);
    },
    async excluir(store,chave){
      var tx=await transacao([store],"readwrite");
      await promessa(tx.objectStore(store).delete(chave));
      return true;
    },
    async buscar(store,chave){
      var tx=await transacao([store],"readonly");
      return promessa(tx.objectStore(store).get(chave));
    },
    async buscarTudo(store){
      var tx=await transacao([store],"readonly");
      return promessa(tx.objectStore(store).getAll());
    },
    async contar(store){
      var tx=await transacao([store],"readonly");
      return promessa(tx.objectStore(store).count());
    },
    /* Só é chamado quando o usuário pede restauração de backup. */
    async limpar(store){
      var tx=await transacao([store],"readwrite");
      await promessa(tx.objectStore(store).clear());
      return true;
    }
  };
})();

var Persistencia = (function(){
  var modo="memoria";          /* indexeddb | storage | memoria */
  var memoria={};
  var cache={};                /* último valor gravado, para não reescrever igual */

  function log(){ 
    var a=["[Ritmo]"].concat([].slice.call(arguments));
    console.info.apply(console,a);
  }
  function aviso(){
    var a=["[Ritmo]"].concat([].slice.call(arguments));
    console.warn.apply(console,a);
  }

  /* Leitura defensiva: qualquer registro corrompido é ignorado
     individualmente, sem derrubar o carregamento inteiro. */
  function valida(obj,campos){
    if(!obj||typeof obj!=="object") return null;
    for(var i=0;i<campos.length;i++) if(obj[campos[i]]===undefined) return null;
    return obj;
  }
  function mudou(chave,valor){
    var t=JSON.stringify(valor);
    if(cache[chave]===t) return false;
    cache[chave]=t; return true;
  }

  /* --- estado -> stores --- */
  function decompor(S){
    var pacotes={rotina:[],tarefas:[],estatisticas:[],hidratacao:[],alimentacao:[],
                 treino:[],provas:[],calendario:[],configuracoes:[],progresso:[]};

    Object.keys(S.blocos||{}).forEach(function(k){
      pacotes.rotina.push({id:k,blocos:S.blocos[k]});
    });
    Object.keys(S.dias||{}).forEach(function(k){
      var d=S.dias[k]||{};
      pacotes.tarefas.push({data:k,feitos:d.feitos||{},sobrevivencia:!!d.sobrevivencia,
        treino:d.treino||null,med:!!d.med,ajuste:d.ajuste||null});
      pacotes.estatisticas.push({data:k,minutos:d.minutos||{}});
      pacotes.hidratacao.push({data:k,agua:Number(d.agua)||0});
      pacotes.alimentacao.push({data:k,prot:Number(d.prot)||0,refs:d.refs||{}});
    });
    Object.keys(S.cargas||{}).forEach(function(n){
      pacotes.treino.push({nome:n,historico:S.cargas[n]});
    });
    (S.provas||[]).forEach(function(p){ pacotes.provas.push({id:String(p.id),materia:p.materia,data:p.data}); });
    (S.eventos||[]).forEach(function(e){
      pacotes.calendario.push({id:String(e.id),data:e.data,hora:e.hora,
        titulo:e.titulo,rec:e.rec||""});
    });
    (S.metas2||[]).forEach(function(g){ pacotes.progresso.push(Object.assign({},g)); });

    [["metas",S.metas],["med",S.med],["alertas",S.alertas],["tema",S.tema],
     ["materias",S.materias],["categorias",S.categorias],["rotacao",S.rotacao],
     ["planoEstudo",S.planoEstudo],["nome",S.nome],["idioma",S.idioma],
     ["pomo",S.pomo],["backupAuto",S.backupAuto]].forEach(function(par){
      pacotes.configuracoes.push({id:par[0],valor:par[1]});
    });
    return pacotes;
  }

  /* --- stores -> estado --- */
  function compor(dados,base){
    var S=base;
    (dados.rotina||[]).forEach(function(r){
      if(valida(r,["id","blocos"]) && Array.isArray(r.blocos)) S.blocos[r.id]=r.blocos;
    });
    var dias={};
    function slot(k){ 
      if(!dias[k]) dias[k]={feitos:{},sobrevivencia:false,minutos:{},treino:null,
                            prot:0,agua:0,refs:{},med:false,ajuste:null};
      return dias[k];
    }
    (dados.tarefas||[]).forEach(function(t){
      if(!valida(t,["data"])) return;
      var d=slot(t.data);
      d.feitos=t.feitos||{}; d.sobrevivencia=!!t.sobrevivencia;
      d.treino=t.treino||null; d.med=!!t.med; d.ajuste=t.ajuste||null;
    });
    (dados.estatisticas||[]).forEach(function(e){
      if(valida(e,["data"])) slot(e.data).minutos=e.minutos||{};
    });
    (dados.hidratacao||[]).forEach(function(a){
      if(valida(a,["data"])) slot(a.data).agua=Number(a.agua)||0;
    });
    (dados.alimentacao||[]).forEach(function(a){
      if(valida(a,["data"])){ var d=slot(a.data); d.prot=Number(a.prot)||0; d.refs=a.refs||{}; }
    });
    if(Object.keys(dias).length) S.dias=dias;

    var cargas={};
    (dados.treino||[]).forEach(function(t){
      if(valida(t,["nome","historico"]) && Array.isArray(t.historico)) cargas[t.nome]=t.historico;
    });
    if(Object.keys(cargas).length) S.cargas=cargas;

    var pv=(dados.provas||[]).filter(function(p){ return valida(p,["id","materia","data"]); });
    if(pv.length) S.provas=pv.map(function(p){ return {id:p.id,materia:p.materia,data:p.data}; });

    var ev=(dados.calendario||[]).filter(function(e){ return valida(e,["id","titulo","data"]); });
    if(ev.length) S.eventos=ev;

    var mt=(dados.progresso||[]).filter(function(g){ return valida(g,["id","titulo","alvo"]); });
    if(mt.length) S.metas2=mt;

    (dados.configuracoes||[]).forEach(function(c){
      if(!valida(c,["id"])||c.valor===undefined||c.valor===null) return;
      if(c.id in S) S[c.id]=c.valor;
    });
    return S;
  }

  return {
    modo:function(){ return modo; },

    async iniciar(){
      if(DB.suportado()){
        try{
          await DB.abrir();
          modo="indexeddb";
          log("persistência: IndexedDB");
          await this.migrarDoStorage();
          return modo;
        }catch(e){ aviso("IndexedDB indisponível:",e.message); }
      }
      if(typeof window!=="undefined" && window.storage){
        modo="storage"; log("persistência: storage do ambiente");
      } else {
        modo="memoria"; aviso("sem persistência: os dados valem só para esta sessão");
      }
      return modo;
    },

    /* Traz dados da versão anterior do app. Roda uma única vez e nunca apaga a origem. */
    async migrarDoStorage(){
      try{
        var marca=await DB.buscar("configuracoes","_migrado");
        if(marca && marca.valor) return false;
        if(!(typeof window!=="undefined" && window.storage)) {
          await DB.salvar("configuracoes",{id:"_migrado",valor:true});
          return false;
        }
        var bruto=null, notas=null;
        try{ bruto=await window.storage.get("ritmo:v1"); }catch(e){}
        try{ notas=await window.storage.get("ritmo:notas:v1"); }catch(e){}
        if(bruto && bruto.value){
          var Sant=JSON.parse(bruto.value);
          await this.salvarEstado(Sant,true);
          log("dados da versão anterior importados para o banco");
        }
        if(notas && notas.value){
          var Nant=JSON.parse(notas.value);
          if(Array.isArray(Nant)) await this.salvarNotas(Nant,true);
        }
        await DB.salvar("configuracoes",{id:"_migrado",valor:true});
        return true;
      }catch(e){ aviso("migração não concluída:",e.message); return false; }
    },

    async carregar(padraoS){
      var S=padraoS, N=[];
      if(modo==="indexeddb"){
        try{
          var nomes=Object.keys(DB.stores), dados={};
          for(var i=0;i<nomes.length;i++){
            try{ dados[nomes[i]]=await DB.buscarTudo(nomes[i]); }
            catch(e){ aviso("store",nomes[i],"ilegível:",e.message); dados[nomes[i]]=[]; }
          }
          S=compor(dados,S);
          N=(dados.notas||[]).filter(function(n){ return n&&n.txt!==undefined; });
          /* Espelha no cache exatamente o que veio do banco — e só isso.
             Espelhar o estado composto marcaria como "já salvo" o que veio
             dos padrões e nunca foi gravado (foi o que aconteceu com os
             moldes de rotina na primeira versão desta camada). */
          Object.keys(dados).forEach(function(store){
            (dados[store]||[]).forEach(function(o){
              if(!o) return;
              var ch=store+":"+(o.id!==undefined?o.id:o.data!==undefined?o.data:o.nome);
              mudou(ch,o);
            });
          });
          if((dados.notas||[]).length) mudou("notas",N);
          log("carregado do banco:",Object.keys(S.dias).length,"dias,",N.length,"notas");
          return {S:S,N:N};
        }catch(e){ aviso("falha ao ler o banco, tentando o storage:",e.message); }
      }
      if(modo==="storage" || modo==="indexeddb"){
        try{
          var r=await window.storage.get("ritmo:v1");
          if(r&&r.value) S=Object.assign(padraoS,JSON.parse(r.value));
          var n2=await window.storage.get("ritmo:notas:v1");
          if(n2&&n2.value) N=JSON.parse(n2.value)||[];
        }catch(e){ aviso("storage ilegível:",e.message); }
      }
      if(modo==="memoria" && memoria.S){ S=memoria.S; N=memoria.N||[]; }
      return {S:S,N:N};
    },

    /* Grava só o que mudou desde a última vez — menos acesso ao banco. */
    async salvarEstado(S,forcar){
      if(modo==="indexeddb"){
        var pac=decompor(S), escritas=0;
        for(var store in pac){
          var lista=pac[store];
          /* mudou() sempre é chamado, inclusive no modo forçado: ele grava
             o cache. Sem isso, a gravação seguinte a um forcar reescrevia
             o banco inteiro. */
          var pendentes=lista.filter(function(o){
            var ch=store+":"+(o.id!==undefined?o.id:o.data!==undefined?o.data:o.nome);
            var dif=mudou(ch,o);
            return forcar || dif;
          });
          if(pendentes.length){
            await DB.salvarVarios(store,pendentes);
            escritas+=pendentes.length;
          }
        }
        return escritas;
      }
      if(modo==="storage"){
        var payload=JSON.stringify(S);
        if(!forcar && !mudou("blob",payload)) return 0;
        var ok=await window.storage.set("ritmo:v1",payload);
        if(!ok) throw new Error("storage recusou a gravação");
        return 1;
      }
      memoria.S=S; return 1;
    },

    async salvarNotas(N,forcar){
      if(modo==="indexeddb"){
        var difN=mudou("notas",N);
        if(!forcar && !difN) return 0;
        var atuais=await DB.buscarTudo("notas");
        var vivos={};
        N.forEach(function(n){ vivos[String(n.id)]=true; });
        for(var i=0;i<atuais.length;i++){
          if(!vivos[String(atuais[i].id)]) await DB.excluir("notas",atuais[i].id);
        }
        await DB.salvarVarios("notas",N.map(function(n){
          return Object.assign({},n,{id:String(n.id)});
        }));
        return N.length;
      }
      if(modo==="storage"){
        if(!forcar && !mudou("notasBlob",N)) return 0;
        var ok=await window.storage.set("ritmo:notas:v1",JSON.stringify(N));
        if(!ok) throw new Error("storage recusou a gravação");
        return 1;
      }
      memoria.N=N; return 1;
    },

    /* Usado pela restauração de backup: troca tudo, mas só a pedido do usuário. */
    async substituirTudo(S,N){
      if(modo==="indexeddb"){
        var nomes=Object.keys(DB.stores);
        for(var i=0;i<nomes.length;i++){
          if(nomes[i]==="configuracoes") continue;
          try{ await DB.limpar(nomes[i]); }catch(e){ aviso("limpeza de",nomes[i],e.message); }
        }
        cache={};
      }
      await this.salvarEstado(S,true);
      await this.salvarNotas(N,true);
      log("backup restaurado pelo usuário");
      return true;
    },

    /* Cópia de segurança guardada no próprio banco, sobrescrita uma vez
       por dia. Não substitui o backup manual — protege de erro de edição. */
    async backupAutomatico(S_,N_){
      if(!S_ || S_.backupAuto && S_.backupAuto.ativo===false) return false;
      try{
        var hoje=chave(UI.agora);
        var atual=await DB.buscar("configuracoes","_backup");
        if(atual && atual.quando===hoje) return false;
        await DB.salvar("configuracoes",{
          id:"_backup", quando:hoje,
          valor:JSON.stringify({estado:S_,notas:N_}).slice(0,4500000)
        });
        log("backup automático do dia gravado");
        return true;
      }catch(e){ aviso("backup automático:",e.message); return false; }
    },
    async lerBackupAutomatico(){
      try{
        var b=await DB.buscar("configuracoes","_backup");
        return b && b.valor ? {quando:b.quando, dados:b.valor} : null;
      }catch(e){ return null; }
    },
    /* Apaga tudo. Só é chamado com dupla confirmação do usuário. */
    async resetGeral(){
      if(modo!=="indexeddb") { memoria={}; cache={}; return true; }
      var nomes=Object.keys(DB.stores);
      for(var i=0;i<nomes.length;i++){
        try{ await DB.limpar(nomes[i]); }catch(e){ aviso("reset de",nomes[i],e.message); }
      }
      cache={};
      log("reset geral executado pelo usuário");
      return true;
    },

    async diagnostico(){
      var out={modo:modo,stores:{}};
      if(modo==="indexeddb"){
        var nomes=Object.keys(DB.stores);
        for(var i=0;i<nomes.length;i++){
          try{ out.stores[nomes[i]]=await DB.contar(nomes[i]); }
          catch(e){ out.stores[nomes[i]]="erro"; }
        }
      }
      return out;
    }
  };
})();

function volumeTreino(dias){ return cache("vt:"+dias,function(){ return volumeTreinoCalc(dias); }); }
function volumeTreinoCalc(dias){
  var lim=Date.now()-dias*86400000, v=0, s=0;
  Object.keys(S.cargas||{}).forEach(function(n){
    (S.cargas[n]||[]).forEach(function(r){
      if(r.ts>=lim){ v+=r.kg*r.reps; s++; }

  });
  return {vol:v,series:s};

  hi.forEach(function(r){ if(r.kg*r.reps > best.kg*best.reps) best=r; });
  return best;
}

function planoDoDia(){
  var d=dia(), min=UI.agora.getHours()*60+UI.agora.getMinutes();
  var blocos=montarDia(UI.agora);
  var vis=d.sobrevivencia?blocos.filter(function(b){return b.e;}):blocos;

  /* aula e blocos de base ficam onde estão; só tarefa real é remanejada */
  var movivel=function(b){
    return !d.feitos[b.id] && b.k!=="aula" &&
      (b.e || b.k==="estudo" || b.k==="treino" || b.k==="dieta");
  };
  var fixos=vis.filter(function(b){ return b.k==="aula" || (!movivel(b) && !d.feitos[b.id]); });
  var pend=vis.filter(function(b){ return movivel(b) && (b.t+b.dur)>min; })
    .concat(vis.filter(function(b){ return movivel(b) && (b.t+b.dur)<=min; }))
    .sort(function(a,b){ return a.t-b.t; });

  var cursor=min, mud=[], cort=[];
  pend.forEach(function(b){
    for(var g=0;g<8;g++){
      var bateu=false;
      fixos.forEach(function(f){
        if(cursor < f.t+f.dur && cursor+b.dur > f.t){ cursor=f.t+f.dur; bateu=true; }
      });
      if(!bateu) break;
    }
    if(cursor+b.dur>1440){ cort.push(b); return; }
    if(cursor!==b.t) mud.push({id:b.id,de:b.t,para:cursor,titulo:b.titulo,dur:b.dur});
    cursor+=b.dur;
  });
  return {mudancas:mud, cortados:cort};
}

/* =====================================================================
   GERADOR DE PDF
   PDF é um formato de texto: dá para escrever o arquivo inteiro à mão,
   sem biblioteca e sem rede. Usa as fontes base-14 (Helvetica), que todo
   leitor de PDF já tem, então nada precisa ser embutido.
   ===================================================================== */
function latin1(t){
  return String(t).replace(/[^\x00-\xFF]/g,function(c){
    var m={"–":"-","—":"-","’":"'","‘":"'","“":'"',"”":'"',"…":"...",
           "✓":"v","•":"-","→":"->","←":"<-","≥":">=","≤":"<="};
    return m[c]||"?";
  });
}
function pEsc(t){ return latin1(t).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)"); }

function PDF(){
  this.paginas=[]; this.atual=null; this.y=0;
  this.L=48; this.R=547; this.TOPO=800; this.BASE=56;
  this.novaPagina();
}
PDF.prototype.novaPagina=function(){
  this.atual={c:""}; this.paginas.push(this.atual); this.y=this.TOPO;
};
PDF.prototype.espaco=function(h){
  if(this.y-h < this.BASE){ this.novaPagina(); return true; }
  return false;
};
PDF.prototype.cor=function(hex,traco){
  var r=parseInt(hex.substr(1,2),16)/255, g=parseInt(hex.substr(3,2),16)/255, b=parseInt(hex.substr(5,2),16)/255;
  this.atual.c+=r.toFixed(3)+" "+g.toFixed(3)+" "+b.toFixed(3)+(traco?" RG\n":" rg\n");
};
PDF.prototype.texto=function(t,x,y,tam,negrito,hex){
  this.cor(hex||"#1A1A1A");
  this.atual.c+="BT /"+(negrito?"F2":"F1")+" "+tam+" Tf "+x+" "+y+" Td ("+pEsc(t)+") Tj ET\n";
};
PDF.prototype.ret=function(x,y,w,h,hex){
  this.cor(hex); this.atual.c+=x+" "+y+" "+w+" "+h+" re f\n";
};
PDF.prototype.linha=function(x1,y1,x2,y2,hex,esp){
  this.cor(hex||"#DDDDDD",true);
  this.atual.c+=(esp||0.6)+" w "+x1+" "+y1+" m "+x2+" "+y2+" l S\n";
};
/* Quebra de linha simples, largura estimada pela métrica média da Helvetica. */
PDF.prototype.paragrafo=function(t,tam,hex,larg){
  var max=Math.floor((larg||(this.R-this.L))/(tam*0.5));
  var pal=String(t).split(" "), ln="", linhas=[];
  pal.forEach(function(w){
    if((ln+" "+w).trim().length>max){ linhas.push(ln.trim()); ln=w; }
    else ln+=" "+w;
  });
  if(ln.trim()) linhas.push(ln.trim());
  var self=this;
  linhas.forEach(function(l){
    self.espaco(tam+4);
    self.texto(l,self.L,self.y,tam,false,hex||"#444444");
    self.y-=tam+4;
  });
};
PDF.prototype.titulo=function(t){
  this.espaco(46);
  this.y-=12;
  this.texto(t,this.L,this.y,13,true,"#7C6BFF");
  this.y-=6;
  this.linha(this.L,this.y,this.R,this.y,"#E4E6F0",0.8);
  this.y-=16;
};
/* Caixa de indicador: valor grande, rótulo pequeno. */
PDF.prototype.indicadores=function(itens){
  var n=itens.length, larg=(this.R-this.L-(n-1)*8)/n;
  this.espaco(56);
  var x=this.L, self=this;
  itens.forEach(function(it){
    self.ret(x,self.y-42,larg,46,"#F6F7FB");
    self.texto(it[0],x+10,self.y-18,15,true,it[2]||"#1A1A1A");
    self.texto(it[1],x+10,self.y-34,7.5,false,"#77809E");
    x+=larg+8;
  });
  this.y-=58;
};
/* Barras horizontais com rótulo e valor. */
PDF.prototype.barras=function(dados,cor){
  var max=1; dados.forEach(function(d){ max=Math.max(max,d[1]); });
  var self=this;
  dados.forEach(function(d){
    self.espaco(20);
    self.texto(d[0],self.L,self.y,8.5,false,"#333333");
    var x0=self.L+150, larg=self.R-60-x0;
    self.ret(x0,self.y-2,larg,7,"#EDEFF6");
    self.ret(x0,self.y-2,Math.max(1,larg*(d[1]/max)),7,cor||"#7C6BFF");
    self.texto(d[2],self.R-52,self.y,8.5,false,"#77809E");
    self.y-=17;
  });
  this.y-=6;
};
/* Frases da leitura automática, com marcador colorido. */
PDF.prototype.frases=function(fs){
  var cores={bom:"#2BB3A3",atencao:"#D99A18",neutro:"#8A93B8"};
  var self=this;
  fs.forEach(function(f){
    self.espaco(24);
    self.ret(self.L,self.y+1,3,8,cores[f.tom]||"#8A93B8");
    var guardaL=self.L; self.L+=12;
    self.paragrafo(f.txt,9,"#333333",self.R-self.L);
    self.L=guardaL;
    self.y-=4;
  });
};
PDF.prototype.gerar=function(titulo,subtitulo){
  /* cabeçalho e rodapé em todas as páginas */
  var self=this, total=this.paginas.length;
  this.paginas.forEach(function(pg,i){
    var cab="";
    cab+="0.486 0.420 1 rg\n"+self.L+" 818 "+(self.R-self.L)+" 2 re f\n";
    cab+="BT /F2 9 Tf "+self.L+" 826 Td (RITMO) Tj ET\n";
    cab+="0.47 0.50 0.62 rg\nBT /F1 8 Tf "+(self.R-170)+" 826 Td ("+pEsc(subtitulo)+") Tj ET\n";
    cab+="0.60 0.63 0.72 rg\nBT /F1 7.5 Tf "+self.L+" 38 Td ("+pEsc(titulo)+") Tj ET\n";
    cab+="BT /F1 7.5 Tf "+(self.R-40)+" 38 Td ("+(i+1)+"/"+total+") Tj ET\n";
    pg.c=cab+pg.c;
  });

  var objs=[], n=0;
  var add=function(t){ objs.push(t); return ++n; };
  var idCat=1, idPags=2;
  n=2;
  var idsPg=[], idsCt=[];
  this.paginas.forEach(function(){ idsPg.push(++n); idsCt.push(++n); });
  var idF1=++n, idF2=++n;

  var partes=[];
  partes[idCat]="<< /Type /Catalog /Pages "+idPags+" 0 R >>";
  partes[idPags]="<< /Type /Pages /Kids ["+idsPg.map(function(i){return i+" 0 R";}).join(" ")
    +"] /Count "+idsPg.length+" >>";
  this.paginas.forEach(function(pg,i){
    partes[idsPg[i]]="<< /Type /Page /Parent "+idPags+" 0 R /MediaBox [0 0 595 842] "
      +"/Resources << /Font << /F1 "+idF1+" 0 R /F2 "+idF2+" 0 R >> >> /Contents "+idsCt[i]+" 0 R >>";
    partes[idsCt[i]]="<< /Length "+pg.c.length+" >>\nstream\n"+pg.c+"endstream";
  });
  partes[idF1]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  partes[idF2]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";

  var out="%PDF-1.4\n", offs=[];
  for(var i=1;i<=n;i++){
    offs[i]=out.length;
    out+=i+" 0 obj\n"+partes[i]+"\nendobj\n";
  }
  var xref=out.length;
  out+="xref\n0 "+(n+1)+"\n0000000000 65535 f \n";
  for(var j=1;j<=n;j++) out+=("0000000000"+offs[j]).slice(-10)+" 00000 n \n";
  out+="trailer\n<< /Size "+(n+1)+" /Root "+idCat+" 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  return out;
};

    [Math.round(pct/(nReg||1)*100)+"%","conclusao da rotina","#7C6BFF"],
    [(somaMinT/60).toFixed(1)+"h","estudo no periodo","#7C6BFF"],
    [String(treinos),"treinos","#FF7A45"],
    [seq.atual+"d","sequencia atual","#2BB3A3"]
  ]);

  /* produtividade */
  doc.titulo("Produtividade");
  C={}; doc.frases(leitura("rotina",n));
  var T=turnos(Math.max(n,28));
  var tb=[];
  [["manha","Manha (5h-11h)"],["tarde","Tarde (12h-17h)"],["noite","Noite (18h-23h)"]].forEach(function(x){
    if(T[x[0]].t>0) tb.push([x[1], (T[x[0]].taxa||0)*100, Math.round((T[x[0]].taxa||0)*100)+"%"]);
  });
  if(tb.length) doc.barras(tb,"#7C6BFF");
  var ds=porDiaSemana(28);
  doc.barras(ds.map(function(v,i){
    return [NOMES_DIA[i].charAt(0).toUpperCase()+NOMES_DIA[i].slice(1), v*100, Math.round(v*100)+"%"];
  }),"#9B8DFF");

  /* estudos */
  doc.titulo("Estudos");
  C={}; doc.frases(leitura("estudo",n));
  var pm=porMateria(n);
  doc.barras(S.materias.map(function(m){
    return [m, num(pm[m]), fmtMin(num(pm[m]))];
  }),"#7C6BFF");

  /* treino */
  doc.titulo("Treino");
  C={}; doc.frases(leitura("treino",n));
  var tp=treinoPerdidos(n), vol=volumeTreino(n);
  doc.indicadores([
    [String(tp.feitos||treinos),"realizados","#FF7A45"],
    [String(tp.perdidos),"perdidos","#E05A72"],
    [Math.round((tp.taxa||0)*100)+"%","aproveitamento","#2BB3A3"],
    [Math.round(vol.vol/1000)+"t","volume","#FF7A45"]
  ]);
  var evo=Object.keys(S.cargas||{}).filter(function(x){ return (S.cargas[x]||[]).length>=2; });
  if(evo.length){
    doc.barras(evo.slice(0,8).map(function(x){
      var hi=S.cargas[x], a=hi[hi.length-1].kg*hi[hi.length-1].reps, b=hi[0].kg*hi[0].reps;
      var dif=Math.round((b-a)/a*100);
      return [x, Math.max(0,dif+100), (dif>0?"+":"")+dif+"%"];
    }),"#FF9A6B");
  }

  /* alimentacao */
  doc.titulo("Alimentacao");
  C={}; doc.frases(leitura("comida",n));
  var cp=consistencia("prot",n), ca=consistencia("agua",n);
  doc.indicadores([
    [Math.round((cp.taxa||0)*100)+"%","proteina na meta","#E0B23C"],
    [Math.round((ca.taxa||0)*100)+"%","agua na meta","#2BB3A3"],
    [(nP?Math.round(prot/nP):0)+"g","media diaria","#E0B23C"],
    [cp.melhor+"d","melhor sequencia","#E0B23C"]
  ]);

  /* rotina */
  doc.titulo("Rotina");
  var blocos=montarDia(UI.agora);
  doc.barras(blocos.filter(function(b){ return b.k!=="base"; }).slice(0,12).map(function(b){
    var hb=histBloco(b.id,Math.min(n,28));
    var t=hb.t?hb.f/hb.t*100:0;
    return [hhmm(b.t)+" "+b.titulo.slice(0,26), t, hb.t?hb.f+"/"+hb.t:"-"];
  }),"#6E7899");

  /* metas */
  if((S.metas2||[]).length){
    doc.titulo("Metas");
    doc.barras(S.metas2.map(function(g){
      var P=progressoMeta(g);
      return [g.titulo.slice(0,30), Math.min(100,P.pct), Math.round(P.pct)+"%"];
    }),"#2BB3A3");
    S.metas2.forEach(function(g){
      var P=progressoMeta(g);
      doc.espaco(16);
      doc.texto(g.titulo+": "+fmtMeta(P.acum,g)+" de "+fmtMeta(g.alvo,g)
        +" - "+P.estado+", restam "+P.per.restantes+" dias",doc.L,doc.y,8,false,"#666666");
      doc.y-=13;
    });
    doc.y-=6;
  }

  /* evolucao */
  doc.titulo("Evolucao");
  var semanas=Math.min(8,Math.floor(n/7));
  if(semanas>=2){
    var ls=[];
    for(var w=semanas-1;w>=0;w--){
      var sm=0; serieDias(7,w*7).forEach(function(x){ sm+=x.min; });
      ls.push([w===0?"semana atual":"ha "+w+" semana"+(w>1?"s":""), sm/60, (sm/60).toFixed(1)+"h"]);
    }
    doc.barras(ls,"#7C6BFF");
  } else {
    doc.paragrafo("Ainda nao ha semanas completas suficientes para comparar a evolucao.",9,"#77809E");
  }

  return doc.gerar("Ritmo - relatorio local, gerado no proprio aparelho", periodoTxt(n));
}

/* ---------- planilha (SpreadsheetML: varias abas, sem compactacao) ---------- */
function xmlEsc(t){
  return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function aba(nome,cabec,linhas){
  var x='<Worksheet ss:Name="'+xmlEsc(nome)+'"><Table>';
  cabec.forEach(function(){ x+='<Column ss:AutoFitWidth="1" ss:Width="95"/>'; });
  x+='<Row ss:StyleID="cab">'+cabec.map(function(c){
    return '<Cell><Data ss:Type="String">'+xmlEsc(c)+'</Data></Cell>'; }).join("")+'</Row>';
  linhas.forEach(function(l){
    x+='<Row>'+l.map(function(v){
      var num_ = (typeof v==="number" && isFinite(v));
      return '<Cell><Data ss:Type="'+(num_?"Number":"String")+'">'
        +(num_?v:xmlEsc(v===null||v===undefined?"":v))+'</Data></Cell>';
    }).join("")+'</Row>';
  });
  return x+'</Table><WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel">'
    +'<FreezePanes/><SplitHorizontal>1</SplitHorizontal><TopRowBottomPane>1</TopRowBottomPane>'
    +'<ActivePane>2</ActivePane></WorksheetOptions></Worksheet>';
}

    }));

    (S.metas2||[]).map(function(g){
      var P=progressoMeta(g);
      return [g.titulo, g.escopo==="ano"?"Anual":"Mensal", FONTES[g.fonte].lab,
        Math.round(P.acum*10)/10, g.alvo, Math.round(P.pct), P.estado, P.per.restantes];
    }));

  /* estatisticas */
  var somaM=0,tre=0,pc=0,nr=0;
  serie.forEach(function(d){ somaM+=d.min; if(d.treino) tre++; if(d.reg){ pc+=d.pct; nr++; } });
  var sm=sessaoMedia(n), tp=treinoPerdidos(n), cp=consistencia("prot",n), ca=consistencia("agua",n);
  var T=turnos(Math.max(n,28)), sq=sequencias();
  var est=[
    ["Período (dias)",n],["Dias com registro",nr],
    ["Conclusão média da rotina (%)",Math.round(pc/(nr||1)*100)],
    ["Sequência atual (dias)",sq.atual],["Melhor sequência (dias)",sq.melhor],
    ["Horas estudadas",Math.round(somaM/60*10)/10],
    ["Média por sessão (min)",Math.round(sm.media)],
    ["Dias com estudo",sm.dias],
    ["Treinos realizados",tre],["Treinos perdidos",tp.perdidos],
    ["Volume total (kg)",volumeTreino(n).vol],
    ["Proteína na meta (%)",Math.round((cp.taxa||0)*100)],
    ["Água na meta (%)",Math.round((ca.taxa||0)*100)],
    ["Conclusão manhã (%)",Math.round((T.manha.taxa||0)*100)],
    ["Conclusão tarde (%)",Math.round((T.tarde.taxa||0)*100)],
    ["Conclusão noite (%)",Math.round((T.noite.taxa||0)*100)]
  ];
  x+=aba("Estatísticas",["Indicador","Valor"],est);

  return x+'</Workbook>';
}

/* ---------- download local ---------- */
var _ultimoArquivo=null;
function baixar(nome,conteudo,mime,binario){
  _ultimoArquivo={nome:nome,conteudo:conteudo,mime:mime,binario:binario};
  try{
    var dados;
    if(binario){
      var b=new Uint8Array(conteudo.length);
      for(var i=0;i<conteudo.length;i++) b[i]=conteudo.charCodeAt(i)&0xFF;
      dados=b;
    } else dados="\uFEFF"+conteudo;
    var blob=new Blob([dados],{type:mime});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=nome; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ URL.revokeObjectURL(url); a.remove(); }catch(e){} },2000);
    return true;
  }catch(e){ console.error("[Ritmo] download falhou:",e); return false; }
}

/* Plano B para quando o navegador bloqueia o download — comum em PWA
   instalado no iOS. Abre o arquivo numa aba, de onde dá para salvar
   ou compartilhar pelo menu do sistema. */
function abrirEmAba(){
  if(!_ultimoArquivo) return false;
  try{
    var a=_ultimoArquivo, dados;
    if(a.binario){
      var b=new Uint8Array(a.conteudo.length);
      for(var i=0;i<a.conteudo.length;i++) b[i]=a.conteudo.charCodeAt(i)&0xFF;
      dados=b;
    } else dados="\uFEFF"+a.conteudo;
    var url=URL.createObjectURL(new Blob([dados],{type:a.mime}));
    var w=window.open(url,"_blank");
    if(!w) return false;
    setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} },30000);
    return true;
  }catch(e){ console.error("[Ritmo] abrir em aba falhou:",e); return false; }
}

/* =====================================================================
   ANÁLISE DE PRODUTIVIDADE
   Métricas derivadas do histórico e a leitura em texto de cada área.
   Nenhuma frase é escrita sem o número que a sustenta.
   ===================================================================== */

/* Conclusão por turno do dia. */
function turnos(n){
  return cache("turnos:"+n,function(){
    var f=perfilHorario("todos",n);
    var faixa=function(a,b){
      var ok=0,t=0;
      for(var h=a;h<=b;h++){ ok+=f[h].f; t+=f[h].t; }
      return {f:ok,t:t,taxa:t?ok/t:null};
    };
    return {manha:faixa(5,11), tarde:faixa(12,17), noite:faixa(18,23)};
  });
}

/* Média de minutos por sessão — um par (dia, matéria) com estudo registrado. */
function sessaoMedia(n){
  return cache("sm:"+n,function(){
    var soma=0,cont=0,dias=0;
    for(var i=0;i<n;i++){
      var reg=S.dias[chave(diasAtras(i))];
      if(!reg||!reg.minutos) continue;
      var teve=false;
      Object.keys(reg.minutos).forEach(function(m){
        var v=num(reg.minutos[m]);
        if(v>0){ soma+=v; cont++; teve=true; }
      });
      if(teve) dias++;
    }
    return {media:cont?soma/cont:0, sessoes:cont, dias:dias, total:soma};
  });
}

/* Treinos agendados que não aconteceram. */
function treinoPerdidos(n){
  return cache("tp:"+n,function(){
    var perdidos=0, agendados=0, feitos=0;
    for(var i=1;i<=n;i++){
      var d=diasAtras(i), reg=S.dias[chave(d)];
      if(!reg) continue;
      var tem=montarDia(d).filter(function(b){ return b.k==="treino"; });
      if(!tem.length) continue;
      agendados++;
      if(reg.treino || tem.some(function(b){ return reg.feitos&&reg.feitos[b.id]; })) feitos++;
      else perdidos++;
    }
    return {agendados:agendados, feitos:feitos, perdidos:perdidos,
            taxa:agendados?feitos/agendados:null};
  });
}

/* Consistência: fração de dias que bateram a meta, e a maior sequência. */
function consistencia(campo,n){
  return cache("cons:"+campo+":"+n,function(){
    var alvo = campo==="prot"?metaProt():metaAgua();
    var ok=0,total=0,run=0,melhor=0;
    for(var i=n-1;i>=0;i--){
      var reg=S.dias[chave(diasAtras(i))];
      if(!reg) continue;
      var v=num(reg[campo]);
      if(v<=0) continue;
      total++;
      if(v>=alvo){ ok++; run++; melhor=Math.max(melhor,run); } else run=0;
    }
    return {ok:ok, total:total, taxa:total?ok/total:null, seq:run, melhor:melhor};
  });
}

/* Média por semana e por mês de uma métrica diária. */
function medias(fn,n){
  var serie=serieDias(n), soma=0, dias=0;
  serie.forEach(function(x){ if(x.reg){ soma+=fn(x); dias++; } });
  var mediaDia=dias?soma/dias:0;
  return {dia:mediaDia, semana:mediaDia*7, mes:mediaDia*30, dias:dias, total:soma};
}

/* Leitura automática de uma área: frases construídas a partir dos números. */
function leitura(area,n){
  var out=[];
  var A=serieDias(n), B=serieDias(n,n);
  var somaA=function(f){ var t=0; A.forEach(function(x){ t+=f(x); }); return t; };
  var somaB=function(f){ var t=0; B.forEach(function(x){ t+=f(x); }); return t; };

  if(area==="rotina"){
    var T=turnos(Math.max(n,28));
    var nomes={manha:"nas manhãs",tarde:"nas tardes",noite:"nas noites"};
    var cands=["manha","tarde","noite"].filter(function(k){ return T[k].t>=6; });
    if(cands.length>=2){
      cands.sort(function(a,b){ return T[b].taxa-T[a].taxa; });
      if(T[cands[0]].taxa-T[cands[cands.length-1]].taxa>=0.2)
        out.push({tom:"bom",txt:"Você produz mais "+nomes[cands[0]]+" — "
          +Math.round(T[cands[0]].taxa*100)+"% de conclusão, contra "
          +Math.round(T[cands[cands.length-1]].taxa*100)+"% "+nomes[cands[cands.length-1]]+"."});
    }
    var ds=porDiaSemana(28), mel=0, pio=0;
    ds.forEach(function(v,i){ if(v>ds[mel]) mel=i; if(v<ds[pio]) pio=i; });
    if(ds[mel]-ds[pio]>=0.2)
      out.push({tom:"neutro",txt:NOMES_DIA[mel].charAt(0).toUpperCase()+NOMES_DIA[mel].slice(1)
        +" costuma ser seu melhor dia ("+Math.round(ds[mel]*100)+"%), e "+NOMES_DIA[pio]
        +" o mais difícil ("+Math.round(ds[pio]*100)+"%)."});
    var pA=0,cA=0,pB=0,cB=0;
    A.forEach(function(x){ if(x.reg){ pA+=x.pct; cA++; } });
    B.forEach(function(x){ if(x.reg){ pB+=x.pct; cB++; } });
    /* comparar contra um período quase vazio produz números sem sentido */
    if(cA>=5 && cB>=Math.max(5,n*0.3)){
      var mA=pA/cA, mB=pB/cB, dif=Math.round((mA-mB)/mB*100);
      if(dif<=-15) out.push({tom:"atencao",txt:"Seu rendimento caiu "+Math.abs(dif)+"% nos últimos "+n+" dias em relação ao período anterior."});
      else if(dif>=15) out.push({tom:"bom",txt:"Seu rendimento subiu "+dif+"% em relação ao período anterior."});
      else out.push({tom:"neutro",txt:"Rendimento estável: "+Math.round(mA*100)+"% de média, praticamente o mesmo do período anterior."});
    }
  }

  if(area==="estudo"){
    var pm=porMateria(n), ord=S.materias.slice().filter(function(m){ return true; })
      .sort(function(a,b){ return (pm[b]||0)-(pm[a]||0); });
    var tot=0; S.materias.forEach(function(m){ tot+=num(pm[m]); });
    if(tot>0){
      var top=ord[0], bot=ord[ord.length-1];
      out.push({tom:"neutro",txt:top+" é a mais estudada: "+Math.round(num(pm[top])/tot*100)
        +"% do seu tempo ("+fmtMin(num(pm[top]))+")."});
      if(num(pm[bot])/tot<0.10)
        out.push({tom:"atencao",txt:"Você está estudando pouco "+bot+" em comparação às outras — "
          +(num(pm[bot])?fmtMin(num(pm[bot])):"nenhum minuto")+" no período."});
    }
    var sm=sessaoMedia(n);
    if(sm.sessoes>=3)
      out.push({tom:"neutro",txt:"Suas sessões duram em média "+Math.round(sm.media)
        +" min, em "+sm.dias+" dias com estudo."});
    var je=melhorJanela("estudo",28);
    if(je) out.push({tom:"bom",txt:"O horário de maior rendimento é "+pad(je.melhor.h)
      +"h, com "+Math.round(je.melhor.taxa*100)+"% dos blocos concluídos."});
    var mA2=somaA(function(x){ return x.min; }), mB2=somaB(function(x){ return x.min; });
    var diasB=0; B.forEach(function(x){ if(x.reg) diasB++; });
    /* só compara se o período anterior tiver histórico de verdade */
    if(mB2>=120 && diasB>=Math.max(5,n*0.3)){
      var d2=Math.round((mA2-mB2)/mB2*100);
      if(d2>=200) out.push({tom:"bom",txt:"Horas de estudo mais que triplicaram em relação aos "+n+" dias anteriores."});
      else if(Math.abs(d2)>=15)
        out.push({tom:d2>0?"bom":"atencao",txt:"Horas de estudo "+(d2>0?"subiram ":"caíram ")
          +Math.abs(d2)+"% em relação aos "+n+" dias anteriores."});
    }
  }

  if(area==="treino"){
    var tp=treinoPerdidos(n);
    var tA=somaA(function(x){ return x.treino?1:0; });
    var porSem=(tA/n*7);
    if(tA>0) out.push({tom:porSem>=3?"bom":"neutro",
      txt:"Frequência de "+porSem.toFixed(1)+" treinos por semana ("+tA+" em "+n+" dias)."});
    if(tp.agendados>=5){
      /* fala sempre pelos que faltaram: é o mesmo número dos indicadores */
      if(tp.taxa>=0.8) out.push({tom:"bom",txt:"Ótima consistência: só "+tp.perdidos
        +" dos "+tp.agendados+" treinos agendados ficaram para trás ("
        +Math.round(tp.taxa*100)+"% de aproveitamento)."});
      else out.push({tom:"atencao",txt:tp.perdidos+" treinos agendados não aconteceram — "
        +Math.round(tp.taxa*100)+"% de aproveitamento."});
    }
    var v1=volumeTreino(n).vol, v2=volumeTreino(n*2).vol-volumeTreino(n).vol;
    if(v2>=1000){
      var dv=Math.round((v1-v2)/v2*100);
      if(Math.abs(dv)>=10)
        out.push({tom:dv>0?"bom":"atencao",txt:"Volume "+(dv>0?"subiu ":"caiu ")+Math.abs(dv)
          +"% — "+Math.round(v1/1000)+" t contra "+Math.round(v2/1000)+" t no período anterior."});
    }
  }

  if(area==="comida"){
    var cp=consistencia("prot",n), ca=consistencia("agua",n);
    if(cp.total>=5){
      out.push({tom:cp.taxa>=0.7?"bom":"atencao",
        txt:"Proteína na meta em "+Math.round(cp.taxa*100)+"% dos dias registrados"
          +(cp.melhor>=3?", com sequência máxima de "+cp.melhor+" dias":"")+"."});
    }
    if(ca.total>=5){
      out.push({tom:ca.taxa>=0.7?"bom":"atencao",
        txt:"Água na meta em "+Math.round(ca.taxa*100)+"% dos dias"
          +(ca.taxa<0.5?" — é seu ponto mais fraco da alimentação.":".")});
    }
    var mp=medias(function(x){ return x.prot; },n);
    if(mp.dias>=5){
      var falta=metaProt()-mp.dia;
      out.push({tom:falta>15?"atencao":"neutro",
        txt:"Média de "+Math.round(mp.dia)+" g por dia contra meta de "+metaProt()+" g"
          +(falta>15?" — faltam "+Math.round(falta)+" g diários, cerca de um shake ou dois ovos."
            :", dentro do esperado.")});
    }
  }

  return out;
}

/* =====================================================================
   METAS
   Cada meta tem uma FONTE. Fontes automáticas são recalculadas a partir
   do histórico a cada abertura; só "manual" (livros, dinheiro) depende
   de o usuário informar o número.
   ===================================================================== */
var FONTES={
  estudo_h:  {lab:"Horas estudadas",       unid:"h",     modo:"soma"},
  treinos:   {lab:"Treinos feitos",        unid:"",      modo:"soma"},
  blocos:    {lab:"Blocos concluídos",     unid:"",      modo:"soma"},
  rotina_pct:{lab:"Conclusão da rotina",   unid:"%",     modo:"media"},
  agua_dias: {lab:"Dias batendo a água",   unid:" dias", modo:"soma"},
  prot_dias: {lab:"Dias batendo proteína", unid:" dias", modo:"soma"},
  manual:    {lab:"Contagem manual",       unid:"",      modo:"soma"}
};

/* Prazo próprio da meta, quando definido, tem prioridade sobre o fim do período. */
function prazoMeta(g){
  if(!g.prazo) return null;
  var p=g.prazo.split("-").map(Number);
  return new Date(p[0],p[1]-1,p[2]);
}
function diasParaPrazo(g){
  var d=prazoMeta(g);
  return d===null?null:diasAte(g.prazo);
}

/* Limites do período de uma meta e quanto dele já passou. */
var CAT_META={
  estudos:  {lab:"Estudos",     cor:"var(--azul)"},
  trabalho: {lab:"Trabalho",    cor:"var(--roxo)"},
  exercicio:{lab:"Exercícios",  cor:"var(--laranja)"},

  financas: {lab:"Finanças",    cor:"var(--ambar)"},
  outra:    {lab:"Personalizada",cor:"var(--fraco)"}
};
var ESCOPOS=[["dia","Diária"],["semana","Semanal"],["mes","Mensal"],["ano","Anual"]];

function periodoMeta(escopo){
  var a=UI.agora.getFullYear(), m=UI.agora.getMonth(), hj=UI.agora.getDate();
  var ini, fim;
  if(escopo==="dia"){
    ini=new Date(a,m,hj); fim=new Date(a,m,hj);
  } else if(escopo==="semana"){
    /* semana começando na segunda-feira */
    var dow=(UI.agora.getDay()+6)%7;
    ini=new Date(a,m,hj-dow); fim=new Date(a,m,hj-dow+6);
  } else if(escopo==="ano"){
    ini=new Date(a,0,1); fim=new Date(a,11,31);
  } else {
    ini=new Date(a,m,1); fim=new Date(a,m+1,0);
  }
  var hoje=new Date(UI.agora.getFullYear(),UI.agora.getMonth(),UI.agora.getDate());
  var total=Math.round((fim-ini)/86400000)+1;
  var passados=Math.min(total, Math.round((hoje-ini)/86400000)+1);
  return {ini:ini, fim:fim, total:total, passados:Math.max(1,passados),
          restantes:Math.max(0,total-passados)};
}

/* Valor de uma fonte automática em um registro de dia. */
function valorDoDia(fonte,reg,d){
  if(!reg) return 0;
  if(fonte==="estudo_h") return somaMin(reg)/60;
  if(fonte==="treinos")  return reg.treino?1:0;
  if(fonte==="blocos")   return Object.keys(reg.feitos||{}).length;
  if(fonte==="agua_dias")return num(reg.agua)>=metaAgua()?1:0;
  if(fonte==="prot_dias")return num(reg.prot)>=metaProt()?1:0;
  if(fonte==="rotina_pct"){
    var vis=visiveis(reg,montarDia(d));
    return vis.length?Object.keys(reg.feitos||{}).length/vis.length*100:null;
  }
  return 0;
}

/* Progresso completo de uma meta, com série acumulada para o gráfico. */
function progressoMeta(g){
  return cache("meta:"+g.id,function(){
    var per=periodoMeta(g.escopo), modo=FONTES[g.fonte].modo;
    var serie=[], acum=0, soma=0, n=0;

    if(g.fonte==="manual"){
      acum=num(g.valor);
      /* histórico guardado a cada alteração, por mês */
      var meses=Object.keys(g.hist||{}).sort();
      serie=meses.map(function(k){ return num(g.hist[k]); });
      if(!serie.length) serie=[acum];
    } else {
      for(var i=0;i<per.passados;i++){
        var d=new Date(per.ini); d.setDate(d.getDate()+i);
        var v=valorDoDia(g.fonte,S.dias[chave(d)],d);
        if(modo==="media"){ if(v!==null){ soma+=v; n++; } serie.push(n?soma/n:0); }
        else { acum+=v; serie.push(acum); }
      }
      if(modo==="media") acum=n?soma/n:0;
      /* série anual em passo diário fica ilegível: reduz para ~40 pontos */
      if(serie.length>40){
        var passo=Math.ceil(serie.length/40), red=[];
        for(var j=0;j<serie.length;j+=passo) red.push(serie[j]);
        red.push(serie[serie.length-1]);
        serie=red;
      }
    }

    var pct = g.alvo>0 ? Math.min(999, acum/g.alvo*100) : 0;
    var esperado = modo==="media" ? g.alvo : g.alvo*(per.passados/per.total);
    var ritmo = per.passados ? acum/per.passados : 0;
    var previsto = modo==="media" ? acum : ritmo*per.total;
    var falta = Math.max(0, g.alvo-acum);
    var diasNecessarios = ritmo>0 ? Math.ceil(falta/ritmo) : null;
    var dataPrevista=null;
    if(modo!=="media" && diasNecessarios!==null && falta>0){
      dataPrevista=new Date(UI.agora); dataPrevista.setDate(dataPrevista.getDate()+diasNecessarios);
    }
    var estado = acum>=g.alvo ? "feita"
      : (modo==="media" ? (acum>=g.alvo*0.95?"no ritmo":"atrasada")
         : (acum>=esperado*0.95 ? (acum>=esperado*1.15?"adiantada":"no ritmo") : "atrasada"));

    return {acum:acum, pct:pct, esperado:esperado, previsto:previsto, ritmo:ritmo,
            falta:falta, dataPrevista:dataPrevista, estado:estado, per:per,
            serie:serie, modo:modo};
  });
}

/* Data curta, com o ano só quando cai fora do ano corrente — senão
   "02/01" para uma previsão de 2027 é lido como se já tivesse passado. */
function dataCurta(d){
  var t=pad(d.getDate())+"/"+pad(d.getMonth()+1);
  return d.getFullYear()!==UI.agora.getFullYear() ? t+"/"+d.getFullYear() : t;
}

/* Guarda o valor de cada mês para a meta manual ter evolução. */
function registraHist(g){
  var k=UI.agora.getFullYear()+"-"+pad(UI.agora.getMonth()+1);
  g.hist=g.hist||{};
  g.hist[k]=num(g.valor);
}

function fmtMeta(v,g){
  var u=g.unid!==undefined?g.unid:FONTES[g.fonte].unid;
  var n = v>=100 ? Math.round(v) : (Math.round(v*10)/10);
  if(u===" R$") return "R$ "+Math.round(v).toLocaleString("pt-BR");
  return n+u;
}

/* Gráfico de acumulado contra a linha ideal do período. */
function grafMeta(serie,alvo,cor){
  var n=serie.length; if(!n) return "";
  var max=Math.max(alvo, Math.max.apply(null,serie))||1;
  var pts=serie.map(function(v,i){ return [(i/(n-1||1))*100, 36-(v/max)*32]; });
  var linha=pts.map(function(q,i){ return (i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1); }).join(" ");
  var yAlvo=36-(alvo/max)*32;
  var gid="grad"+(++seqGrad);
  return '<div class="graf" style="--c:'+cor+';height:64px"><svg viewBox="0 0 100 40" preserveAspectRatio="none">'
    +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="'+cor+'" stop-opacity=".3"/>'
    +'<stop offset="100%" stop-color="'+cor+'" stop-opacity="0"/></linearGradient></defs>'
    +'<line x1="0" y1="'+yAlvo.toFixed(1)+'" x2="100" y2="'+yAlvo.toFixed(1)+'" stroke="currentColor" '
    +'stroke-dasharray="2 2" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".45"/>'
    +'<path d="'+linha+' L100 40 L0 40 Z" fill="url(#'+gid+')"/>'
    +'<path d="'+linha+'" fill="none" stroke="'+cor+'" stroke-width="1.6" '
    +'vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg></div>';
}

/* =====================================================================
   ANÁLISE DE PADRÕES
   Tudo aqui sai do histórico já salvo: quais blocos foram marcados,
   quando, e em que dia. Nenhum dado novo é pedido ao usuário.
   ===================================================================== */

/* Taxa de conclusão por faixa de horário, para uma categoria de bloco.
   Usa o horário AGENDADO do bloco — é isso que responde "a que horas
   as coisas realmente acontecem quando estão marcadas para essa hora". */
function perfilHorario(cat,dias){
  return cache("ph:"+cat+":"+dias,function(){
    var faixas=[];
    for(var i=0;i<24;i++) faixas.push({f:0,t:0});
    for(var k=1;k<=dias;k++){
      var d=diasAtras(k), reg=S.dias[chave(d)];
      if(!reg) continue;
      montarDia(d).forEach(function(b){
        if(cat!=="todos" && b.k!==cat) return;
        if(b.k==="base") return;
        var h=Math.floor(b.t/60);
        if(h>23) return;
        faixas[h].t++;
        if(reg.feitos&&reg.feitos[b.id]) faixas[h].f++;
      });
    }
    faixas.forEach(function(x){ x.taxa=x.t?x.f/x.t:null; });
    return faixas;
  });
}

/* Melhor janela contínua de 2h para uma categoria, com amostra suficiente.
   Devolve null quando não há dado bastante — silêncio é melhor que palpite. */
function melhorJanela(cat,dias){
  var f=perfilHorario(cat,dias||28);
  var melhor=null, pior=null;
  /* Compara horas que de fato têm blocos. Somar a hora vizinha inflava a
     janela: com dado só às 12h, o app anunciava "11h às 13h". */
  for(var h=5;h<=23;h++){
    if(f[h].t<6) continue;                      /* amostra pequena não vira afirmação */
    var taxa=f[h].taxa;
    if(!melhor||taxa>melhor.taxa) melhor={h:h,taxa:taxa,n:f[h].t};
    if(!pior||taxa<pior.taxa) pior={h:h,taxa:taxa,n:f[h].t};
  }
  if(!melhor||!pior||melhor.h===pior.h) return null;
  if(melhor.taxa-pior.taxa<0.25) return null;   /* diferença pequena não é padrão */
  return {melhor:melhor,pior:pior};
}

/* Carga de hoje contra o que costuma ser concluído de fato. */
function sobrecarga(){
  var d=dia(), vis=visiveis(d,montarDia(UI.agora));
  var planejado=0;
  vis.forEach(function(b){ if(b.k!=="base"&&b.k!=="aula") planejado+=b.dur; });
  var amostras=[];
  for(var i=1;i<=14;i++){
    var dd=diasAtras(i), reg=S.dias[chave(dd)];
    if(!reg) continue;
    var feito=0;
    montarDia(dd).forEach(function(b){
      if(b.k!=="base"&&b.k!=="aula"&&reg.feitos&&reg.feitos[b.id]) feito+=b.dur;
    });
    amostras.push(feito);
  }
  if(amostras.length<5) return null;
  amostras.sort(function(a,b){ return a-b; });
  var mediana=amostras[Math.floor(amostras.length/2)];
  if(!mediana) return null;
  return {planejado:planejado, mediana:mediana, razao:planejado/mediana};
}

/* Hora de dormir de ontem, pela última marcação do dia. */
function dormiuTarde(){
  var d=diasAtras(1), k=chave(d), reg=S.dias[k];
  var fim=fimDoDia(reg,k);
  if(fim===null) return null;
  return {min:fim, tarde:fim>=1470};   /* 00:30 ou depois */
}

/* Hábitos repetitivos encontrados no histórico, cada um com a evidência. */
function padroes(){
  return cache("padroes",function(){
    var out=[];

    var je=melhorJanela("estudo",28);
    if(je) out.push({tipo:"estudo",
      txt:"Você costuma estudar melhor entre "+pad(je.melhor.h)+"h e "+pad(je.melhor.h+2)+"h",
      por:Math.round(je.melhor.taxa*100)+"% dos blocos concluídos nesse horário, contra "
        +Math.round(je.pior.taxa*100)+"% às "+pad(je.pior.h)+"h ("+je.melhor.n+" observações)"});

    var jt=melhorJanela("treino",28);
    if(jt) out.push({tipo:"treino",
      txt:"O treino rende mais entre "+pad(jt.melhor.h)+"h e "+pad(jt.melhor.h+2)+"h",
      por:Math.round(jt.melhor.taxa*100)+"% de conclusão nesse horário, contra "
        +Math.round(jt.pior.taxa*100)+"% às "+pad(jt.pior.h)+"h"});

    var ds=porDiaSemana(28), mel=0, pio=0;
    ds.forEach(function(v,i){ if(v>ds[mel]) mel=i; if(v<ds[pio]) pio=i; });
    if(ds[mel]-ds[pio]>0.25)
      out.push({tipo:"dia",
        txt:NOMES_DIA[mel].charAt(0).toUpperCase()+NOMES_DIA[mel].slice(1)+" é seu dia mais forte; "
          +NOMES_DIA[pio]+" o mais fraco",
        por:Math.round(ds[mel]*100)+"% contra "+Math.round(ds[pio]*100)+"% de conclusão nas últimas 4 semanas"});

    var piorB=null;
    montarDia(UI.agora).forEach(function(b){
      var hb=histBloco(b.id,21);
      if(hb.t>=10 && (!piorB||hb.f/hb.t<piorB.taxa)) piorB={b:b,taxa:hb.f/hb.t,hb:hb};
    });
    if(piorB && piorB.taxa<=0.35)
      out.push({tipo:"bloco", txt:'"'+piorB.b.titulo+'" quase nunca acontece',
        por:"feito "+piorB.hb.f+" de "+piorB.hb.t+" dias — o horário é que está errado"});

    /* marcação em lote: sinal de que o app é preenchido no fim do dia */
    var tardias=0, comHora=0;
    for(var i=1;i<=14;i++){
      var dd=diasAtras(i), kk=chave(dd), reg=S.dias[kk];
      if(!reg||!reg.feitos) continue;
      Object.keys(reg.feitos).forEach(function(id){
        var m=minutoMarcado(reg,id,kk);
        if(m===null) return;
        comHora++;
        var bl=montarDia(dd).filter(function(x){ return x.id===id; })[0];
        if(bl && m-(bl.t+bl.dur)>180) tardias++;
      });
    }
    if(comHora>=15 && tardias/comHora>0.5)
      out.push({tipo:"habito", txt:"Você marca os blocos bem depois de fazê-los",
        por:Math.round(tardias/comHora*100)+"% das marcações vêm 3h ou mais atrasadas — as sugestões do dia perdem precisão assim"});

    var sc=sobrecarga();
    if(sc && sc.razao>1.5)
      out.push({tipo:"carga", txt:"Seus dias são planejados acima do que você entrega",
        por:"hoje tem "+Math.round(sc.planejado/60)+"h de tarefas, e a mediana concluída em 14 dias é "
          +(sc.mediana/60).toFixed(1)+"h"});

    return out;
  });
}

/* =====================================================================
   PLANEJADOR SEMANAL
   Distribui as matérias pelos blocos de estudo dos próximos dias.
   Só propõe: nada é gravado sem o usuário confirmar.
   ===================================================================== */

/* Peso de uma matéria: quanto ela precisa de atenção agora.
   Sobe com dúvidas abertas e proximidade da prova, cai com horas já dadas. */
function pesoMateria(m){
  var dv=N.filter(function(x){ return x.duvida&&!x.resolvida&&x.tag===m; }).length;
  var horas=(porMateria(14)[m]||0)/60;
  var pr=S.provas.filter(function(x){ return x.materia===m&&diasAte(x.data)>=0; })
                 .sort(function(a,b){ return a.data.localeCompare(b.data); })[0];
  var dias=pr?diasAte(pr.data):null;
  var urg = dias===null ? 1 : Math.min(8, Math.max(1, 21/Math.max(1,dias)));
  var frio=ultimoEstudo(m);
  var esquec = (frio===null||frio>=10) ? 1.6 : (frio>=7 ? 1.3 : 1);
  return {
    m:m, peso:((dv+1)/(horas+1))*urg*esquec,
    dv:dv, horas:horas, prova:dias, frio:frio, dataProva:pr?pr.data:null
  };
}

/* Motivo curto e verificável, para o plano não parecer palpite. */
function motivoDe(w,ehVespera){
  if(ehVespera) return "véspera da prova";
  if(w.prova!==null && w.prova<=7) return "prova em "+w.prova+(w.prova===1?" dia":" dias");
  if(w.dv>0) return w.dv+(w.dv===1?" dúvida aberta":" dúvidas abertas");
  if(w.frio===null) return "nunca estudada";
  if(w.frio>=7) return "há "+w.frio+" dias sem tocar";
  if(w.horas<1) return "menos de 1h em 14 dias";
  return "manter em circulação";
}

function planoSemanal(nDias){
  nDias=nDias||7;
  var min=UI.agora.getHours()*60+UI.agora.getMinutes();

  /* 1. blocos de estudo disponíveis daqui pra frente */
  var vagas=[];
  for(var i=0;i<nDias;i++){
    var d=diasFrente(i), k=chave(d);
    montarDia(d).forEach(function(b){
      if(b.k!=="estudo") return;
      if(i===0 && b.t+b.dur<=min) return;          /* hoje: só o que ainda vem */
      vagas.push({data:k,dia:d,id:b.id,t:b.t,titulo:b.titulo,dur:b.dur});
    });
  }
  vagas.sort(function(a,b){ return a.data.localeCompare(b.data)||a.t-b.t; });

  /* 2. pesos iniciais */
  var pesos={}; S.materias.forEach(function(m){ pesos[m]=pesoMateria(m); });

  /* 3. alocação cronológica */
  var restante={}; S.materias.forEach(function(m){ restante[m]=pesos[m].peso; });
  var itens=[], ultimoNoDia={};

  vagas.forEach(function(v){
    var candidatas=S.materias.filter(function(m){
      var w=pesos[m];
      /* prova já passou nesta data: não faz sentido continuar alocando */
      if(w.dataProva && w.dataProva < v.data) return false;
      return true;
    });
    if(!candidatas.length) return;

    /* véspera de prova: aquele bloco é revisão da matéria que cai */
    var vespera=candidatas.filter(function(m){
      var w=pesos[m];
      if(!w.dataProva) return false;
      var pp=w.dataProva.split("-").map(Number);
      var ant=new Date(pp[0],pp[1]-1,pp[2]); ant.setDate(ant.getDate()-1);
      return chave(ant)===v.data || w.dataProva===v.data;
    })[0];

    var escolhida;
    if(vespera){
      /* véspera e dia da prova: o dia inteiro é daquela matéria, de propósito */
      escolhida=vespera;
    } else {
      var ordenadas=candidatas.slice().sort(function(a,b){ return restante[b]-restante[a]; });
      escolhida=ordenadas[0];
      /* fora da véspera, nunca dois blocos seguidos da mesma matéria:
         intercalar fixa mais do que repetir na sequência */
      if(ultimoNoDia[v.data]===escolhida){
        var alt=ordenadas.filter(function(m){ return m!==ultimoNoDia[v.data]; })[0];
        if(alt) escolhida=alt;
      }
    }

    ultimoNoDia[v.data]=escolhida;
    restante[escolhida]=restante[escolhida]*0.45;   /* espalha ao longo da semana */
    itens.push({data:v.data,dia:v.dia,id:v.id,t:v.t,titulo:v.titulo,dur:v.dur,
      materia:escolhida, motivo:motivoDe(pesos[escolhida], !!vespera)});
  });

  /* 4. resumo por matéria */
  var totais={};
  itens.forEach(function(x){ totais[x.materia]=(totais[x.materia]||0)+x.dur; });

  return {itens:itens, totais:totais, pesos:pesos, vagas:vagas.length};
}

/* Matéria planejada para um bloco, se houver plano aceito. */
function materiaDoBloco(dataK,idBloco){
  var dia_=(S.planoEstudo||{})[dataK];
  return dia_ ? (dia_[idBloco]||null) : null;
}

/* =====================================================================
   RELATÓRIO SEMANAL
   Comparação com a semana anterior e três ajustes concretos,
   cada um derivado de um número que o app já tem.
   ===================================================================== */
function relatorioSemana(){
  var a=serieDias(7), b=serieDias(7,7);
  function agrega(serie){
    var o={min:0,prot:0,nP:0,agua:0,nA:0,treinos:0,pct:0,nR:0};
    serie.forEach(function(x){
      o.min+=x.min;
      if(x.prot>0){ o.prot+=x.prot; o.nP++; }
      if(x.agua>0){ o.agua+=x.agua; o.nA++; }
      if(x.treino) o.treinos++;
      if(x.reg){ o.pct+=x.pct; o.nR++; }
    });
    o.rotina=o.nR?o.pct/o.nR:0;
    o.protMed=o.nP?o.prot/o.nP:0;
    o.aguaMed=o.nA?o.agua/o.nA:0;
    return o;
  }
  var A=agrega(a), B=agrega(b);
  var abertas=N.filter(function(x){ return x.duvida&&!x.resolvida; });

  /* candidatos a ajuste, cada um com severidade e um número que o sustenta */
  var cand=[];

  montarDia(UI.agora).forEach(function(bl){
    var hb=histBloco(bl.id,14);
    if(hb.t>=7 && hb.f/hb.t<=0.35)
      cand.push({cat:"bloco", sev:90-Math.round(hb.f/hb.t*100), txt:'Mudar o horário de "'+bl.titulo+'"',
        por:"feito "+hb.f+" de "+hb.t+" dias — depois de duas semanas assim o horário é que está errado",
        acao:{lab:"abrir rotina",cmd:"ir-rotina"}});
  });

  S.materias.forEach(function(m){
    var pr=S.provas.filter(function(x){ return x.materia===m&&diasAte(x.data)>=0; })
                   .sort(function(x,y){ return x.data.localeCompare(y.data); })[0];
    var h=(porMateria(7)[m]||0)/60;
    if(pr && diasAte(pr.data)<=14 && h<2)
      cand.push({cat:"materia", sev:88, txt:"Dar mais blocos a "+m,
        por:"prova em "+diasAte(pr.data)+" dias e só "+h.toFixed(1)+"h nesta semana",
        acao:{lab:"montar plano",cmd:"tab:estudo"}});
  });

  if(A.nP && A.protMed < metaProt()*0.75)
    cand.push({cat:"comida", sev:80, txt:"Ajustar a meta de proteína ou o café da manhã",
      por:"média de "+Math.round(A.protMed)+" g contra meta de "+metaProt()+" g",
      acao:{lab:"abrir metas",cmd:"ir-metas"}});

  var ds=porDiaSemana(28), pior=0;
  ds.forEach(function(v,i){ if(v<ds[pior]) pior=i; });
  if(ds[pior]>0 && ds[pior]<0.45)
    cand.push({cat:"diasemana", sev:70, txt:"Aliviar "+NOMES_DIA[pior]+" — menos blocos ou modo sobrevivência",
      por:"média de "+Math.round(ds[pior]*100)+"% de conclusão nesse dia nas últimas 4 semanas",
      acao:{lab:"abrir rotina",cmd:"ir-rotina"}});

  if(abertas.length>=4)
    cand.push({cat:"duvidas", sev:68, txt:"Fechar as dúvidas mais antigas",
      por:abertas.length+" abertas — dúvida que passa da semana vira buraco na prova",
      acao:{lab:"abrir dúvidas",cmd:"ir-duvidas"}});

  if(A.treinos<=1 && B.treinos>=2)
    cand.push({cat:"treino", sev:66, txt:"Recolocar o treino na semana",
      por:A.treinos+" treino(s) contra "+B.treinos+" na semana anterior"});
  else if(A.treinos>=6)
    cand.push({cat:"treino", sev:64, txt:"Marcar um dia de descanso",
      por:A.treinos+" treinos em 7 dias, sem folga"});

  if(A.nA && A.aguaMed < metaAgua()*0.6)
    cand.push({cat:"comida", sev:55, txt:"Deixar a garrafa à vista na mesa de estudo",
      por:"média de "+A.aguaMed.toFixed(1)+" de "+metaAgua()+" copos"});

  if(A.min < B.min*0.7 && B.min>0)
    cand.push({cat:"materia", sev:75, txt:"Recuperar o ritmo de estudo",
      por:(A.min/60).toFixed(1)+"h contra "+(B.min/60).toFixed(1)+"h na semana passada",
      acao:{lab:"montar plano",cmd:"tab:estudo"}});

  cand.sort(function(x,y){ return y.sev-x.sev; });

  /* Três conselhos sobre o mesmo assunto não são três conselhos.
     Um por categoria: o diagnóstico cobre frentes diferentes da semana. */
  var vistos={}, escolhidos=[];
  cand.forEach(function(x){
    if(escolhidos.length>=3) return;
    if(vistos[x.cat]) return;
    vistos[x.cat]=true; escolhidos.push(x);
  });

  return {
    atual:A, anterior:B, ajustes:escolhidos,
    inicio:a[0].d, fim:a[a.length-1].d,
    temDados:A.nR>0
  };
}
