<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ritmo</title>
<meta name="description" content="Assistente pessoal de rotina para estudo, treino e alimentação. Funciona offline e guarda tudo no próprio aparelho.">
<meta name="theme-color" content="#0E1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ritmo">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="./splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="./splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="./splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="./splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="./splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
<link rel="apple-touch-startup-image" href="./splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{background:#0E1020;min-height:100%}
html[data-tema="claro"]{background:#FBFBFD;color-scheme:light}
[data-tema="claro"] body{background:var(--ink,#FBFBFD) !important}
#app{min-height:100vh;background:var(--ink,#0E1020)}
[data-tema="claro"] #app{background:var(--ink,#F2F4FB)}
[data-tema="claro"]{
  --ink:#FBFBFD;--ink2:#FFFFFF;--ink3:#FFFFFF;--linha:#E8E9EF;--linha2:#DCDEE7;
  --texto:#12131A;--mute:#6C7080;--fraco:#A6AAB8;--borda2:#D2D5DF;
  --navbg:rgba(251,251,253,.86);--overlaybg:rgba(20,22,34,.32);--sombra:rgba(20,26,54,.14);
  --roxo:#6355E8;--roxo2:#7C6BFF;--azul:#4E74F0;--laranja:#DD6A2C;
  --verde:#1E9E86;--ambar:#B8891F;--rosa:#D45585;--vermelho:#DC4A66;
  --el1:0 1px 1px rgba(20,26,54,.04),0 2px 8px -3px rgba(20,26,54,.07);
  --el2:0 1px 2px rgba(20,26,54,.05),0 10px 30px -12px rgba(20,26,54,.14);
  --el3:0 2px 6px rgba(20,26,54,.06),0 24px 56px -24px rgba(20,26,54,.18);
  --luz:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,0))}
[data-tema="claro"] .cel{background:#6355E8}
[data-tema="claro"] .bfill{background:#6355E8}
[data-tema="claro"] .mat.on,[data-tema="claro"] .tipo.on,
[data-tema="claro"] .sec.on,[data-tema="claro"] .btn-salvar,
[data-tema="claro"] .btn-grande.roxo{background:#6355E8;border-color:#6355E8;color:#fff}
[data-tema="claro"] .filtro.on{background:#141A33;border-color:#141A33;color:#fff}
[data-tema="claro"] .agora-btn,[data-tema="claro"] .btn-grande{color:#fff}
[data-tema="claro"] .agora-btn.done{color:var(--c)}
[data-tema="claro"] .alerta{background:#6355E8;color:#fff}
[data-tema="claro"] .alerta button{background:rgba(255,255,255,.22);color:#fff}
[data-tema="claro"] .quick button{color:#9A7714}
[data-tema="claro"] .ref.on{color:#9A7714}
[data-tema="claro"] .medidor,[data-tema="claro"] .stat,
[data-tema="claro"] .nota,[data-tema="claro"] .ex,
[data-tema="claro"] .comp,[data-tema="claro"] .prova{box-shadow:0 1px 3px var(--sombra)}
html,body{
  /* superfícies: três níveis de elevação, diferença sutil mas perceptível */
  --ink:#0B0D18;--ink2:#141830;--ink3:#191E3A;--linha:#232945;--linha2:#2E3554;
  --texto:#F2F4FC;--mute:#8E96B8;--fraco:#5A628C;--borda2:#39415F;
  --navbg:rgba(11,13,24,.88);--overlaybg:rgba(4,5,12,.66);--sombra:rgba(0,0,0,.55);
  /* paleta de categorias: matizes vizinhos, saturação contida */
  --roxo:#7C6BFF;--roxo2:#9587FF;--azul:#6B8AFF;--laranja:#F0803C;
  --verde:#35B79E;--ambar:#DDB04A;--rosa:#E8709A;--vermelho:#F0637E;
  /* escala tipográfica */
  --t-hero:34px;--t-titulo:27px;--t-sub:18px;--t-texto:15px;--t-cap:12px;--t-micro:10px;
  /* espaçamento 4-8-12-16-24-32-48 */
  --e1:4px;--e2:8px;--e3:12px;--e4:16px;--e5:24px;--e6:32px;--e7:48px;
  /* raios */
  --r1:12px;--r2:16px;--r3:20px;--r4:22px;--r5:28px;
  /* movimento: curva de saída da Apple, sem repique */
  --ease:cubic-bezier(.32,.72,0,1);
  --t:180ms var(--ease);--t2:220ms var(--ease);--tl:250ms var(--ease);
  /* sombras em camadas, quase imperceptíveis */
  --el1:0 1px 1px rgba(0,0,0,.16),0 2px 6px -2px rgba(0,0,0,.24);
  --el2:0 1px 2px rgba(0,0,0,.2),0 8px 28px -12px rgba(0,0,0,.55);
  --el3:0 2px 4px rgba(0,0,0,.24),0 20px 48px -20px rgba(0,0,0,.6);
  /* brilho interno que dá volume ao card sem gradiente visível */
  --luz:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 42%);
  color-scheme:dark;
  margin:0;min-height:100vh;background:var(--ink,#0E1020) !important;color:var(--texto);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;padding-bottom:92px;-webkit-font-smoothing:antialiased}
.load{padding:80px 24px;color:var(--mute);font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:13px}
button,input,select,textarea{font-family:inherit}

.top{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 20px 12px}
.top-dir{display:flex;align-items:center;gap:8px}
.eyebrow{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute)}
.logo{font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0}
.clock{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:15px;color:var(--mute);
  border:1px solid var(--linha);border-radius:999px;padding:5px 12px}
.gear{background:var(--ink2);border:1px solid var(--linha);color:var(--mute);border-radius:999px;
  width:34px;height:34px;font-size:15px;cursor:pointer}
main{padding:0 20px;max-width:620px;margin:0 auto}

/* alerta de bloco */
body>.alerta,#app>.alerta{position:fixed;left:12px;right:12px;top:12px;z-index:60;background:#7C6BFF;color:#0E1020;
  border-radius:15px;padding:14px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:0 12px 40px var(--sombra)}
.alerta b{font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:15px;display:block}
.alerta span{font-size:12px;opacity:.75}
.alerta button{margin-left:auto;background:rgba(14,16,32,.18);border:none;color:#0E1020;
  border-radius:9px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer}

/* faixa do remédio */
.med{display:flex;align-items:center;gap:10px;background:var(--ink2);border:1px solid var(--linha);
  border-radius:14px;padding:12px 14px;margin-bottom:14px}
.med-dot{width:9px;height:9px;border-radius:50%;background:var(--borda2);flex-shrink:0}
.med.on .med-dot{background:#2BB3A3;box-shadow:0 0 12px #2BB3A3}
.med-txt{flex:1;font-size:13px;line-height:1.4}
.med-txt em{font-style:normal;display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
.med-btn{background:transparent;border:1px solid var(--linha);color:var(--mute);border-radius:9px;
  padding:8px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.med.on .med-btn{border-color:#2BB3A3;color:#2BB3A3}

.agora{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px 20px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,var(--ink2)),var(--ink2));
  border:1px solid color-mix(in srgb,var(--c) 40%,transparent);margin-bottom:14px}
.agora-bar{position:absolute;top:0;left:0;height:3px;background:var(--c);transition:width .6s}
.agora-tag{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--c);margin-bottom:8px}
.agora-tit{font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:27px;line-height:1.12;font-weight:700;
  letter-spacing:-.02em;margin:0 0 8px}
.agora-meta{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--mute)}
.agora-nota{font-size:13.5px;line-height:1.5;color:#B8C0DE;margin:12px 0 0}
.agora-acoes{display:flex;gap:8px;margin-top:16px}
.agora-btn{flex:1;padding:13px;border-radius:13px;border:none;background:var(--c);color:#0E1020;
  font-weight:600;font-size:15px;cursor:pointer}
.agora-btn.done{background:transparent;border:1px solid var(--c);color:var(--c)}
.agora-nota-btn{padding:13px 15px;border-radius:13px;background:transparent;
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);
  font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}

.sobrev{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--ink2);
  border:1px dashed var(--linha);border-radius:15px;padding:13px 15px;color:var(--texto);
  cursor:pointer;margin-bottom:18px}
.sobrev.on{border:1px solid #FF7A45;background:rgba(255,122,69,.08)}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--borda2);flex-shrink:0}
.sobrev.on .sdot{background:#FF7A45;box-shadow:0 0 12px #FF7A45}
.sobrev strong{display:block;font-size:14px;font-weight:600}
.sobrev em{display:block;font-style:normal;font-size:12px;color:var(--mute);margin-top:2px}

.ptrack{flex:1;height:5px;background:var(--linha);border-radius:9px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,#7C6BFF,#2BB3A3);transition:width .4s}
.pfill.prot{background:#E0B23C}
.pnum{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--mute)}

.timeline{list-style:none;padding:0;margin:0 0 26px}
.bloco{display:grid;grid-template-columns:46px 20px 1fr 22px;align-items:center;gap:9px;
  padding:11px 4px;border-bottom:1px solid var(--linha);cursor:pointer}
.bl-hora{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--mute)}
.bl-pino{color:var(--c);font-size:14px;text-align:center}
.bl-tit{font-size:14.5px;line-height:1.3}
.bl-ess{display:inline-block;font-style:normal;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:8.5px;
  letter-spacing:.1em;text-transform:uppercase;color:#FF7A45;border:1px solid rgba(255,122,69,.4);
  border-radius:4px;padding:1px 5px;margin-left:7px;vertical-align:middle}
.bl-pico{display:inline-block;font-style:normal;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:8.5px;
  letter-spacing:.1em;text-transform:uppercase;color:#2BB3A3;border:1px solid rgba(43,179,163,.4);
  border-radius:4px;padding:1px 5px;margin-left:7px;vertical-align:middle}
.bl-check{color:#2BB3A3;font-size:15px;text-align:right}
.bloco.atual{background:rgba(124,107,255,.07);border-left:2px solid var(--c);padding-left:8px;border-radius:0 8px 8px 0}
.bloco.passou{opacity:.38}
.bloco.feito{opacity:.75}
.bloco.feito .bl-tit{color:var(--mute);text-decoration:line-through}

h3.sub{font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);margin:26px 0 12px;font-weight:500}
.explica{font-size:13px;line-height:1.55;color:var(--mute);border-left:2px solid var(--linha);
  padding-left:13px;margin:16px 0}

.refs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.ref{padding:11px 4px;border-radius:11px;background:var(--ink2);border:1px solid var(--linha);
  color:var(--mute);font-size:12.5px;cursor:pointer}
.ref.on{background:rgba(224,178,60,.14);border-color:#E0B23C;color:#E0B23C;font-weight:600}
.medidor{background:var(--ink2);border:1px solid var(--linha);border-radius:15px;padding:14px;margin-bottom:14px}
.med-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;font-size:13.5px}
.med-top b{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px;color:var(--mute)}
.quick{display:flex;gap:6px;margin-top:11px}
.quick button{flex:1;padding:9px;border-radius:10px;background:transparent;border:1px solid var(--linha);
  color:#E0B23C;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;cursor:pointer}
.quick button.undo{color:var(--mute)}
.copos{display:flex;gap:5px;flex-wrap:wrap}
.copo{width:26px;height:32px;border-radius:4px 4px 9px 9px;background:transparent;
  border:1.5px solid var(--borda2);cursor:pointer;padding:0}
.copo.on{background:#2BB3A3;border-color:#2BB3A3}

.treino-nome{font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:38px;font-weight:700;letter-spacing:-.03em;
  margin:4px 0 2px;color:#FF7A45}
.treino-foco{font-size:14px;color:var(--mute)}
.exs{list-style:none;padding:0;margin:0 0 18px}
.ex{padding:12px;background:var(--ink2);border:1px solid var(--linha);border-radius:13px;margin-bottom:8px}
.ex.up{border-color:rgba(43,179,163,.45)}
.ex.down{border-color:rgba(255,92,122,.35)}
.ex-head{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:9px;margin-bottom:10px}
.ex-n{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--fraco)}
.ex-nome{font-size:14.5px}
.ex-series{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:#FF7A45}
.ex-carga{display:flex;align-items:center;gap:7px}
.ex-ult{flex:1;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;color:var(--fraco)}
.in{width:58px;background:var(--ink);border:1px solid var(--linha);border-radius:9px;padding:8px;
  color:var(--texto);font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;text-align:center;outline:none}
.in:focus{border-color:#FF7A45}
.xx{color:var(--fraco);font-size:12px}
.seta{width:14px;font-size:14px;color:#2BB3A3}
.ex.down .seta{color:#FF5C7A}
.ex.eq .seta{color:var(--mute)}
.btn-grande{width:100%;padding:15px;border-radius:14px;border:none;background:#FF7A45;color:#0E1020;
  font-weight:600;font-size:15px;cursor:pointer}
.btn-grande.roxo{background:#7C6BFF}
.btn-ghost{width:100%;padding:14px;border-radius:14px;background:transparent;border:1px solid var(--linha);
  color:var(--mute);font-size:14px;cursor:pointer}
.flash{margin-top:12px;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:#2BB3A3;text-align:center}
.fila{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px}
.fila-item{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;padding:5px 10px;border:1px solid var(--linha);
  border-radius:999px;color:var(--mute)}
.fila-item.on{border-color:#FF7A45;color:#FF7A45}
.carga-linha{display:grid;grid-template-columns:1fr auto 50px;align-items:center;gap:9px}
.carga-v{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;color:var(--mute)}
.carga-dif{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;text-align:right;color:var(--mute)}
.carga-dif.up{color:#2BB3A3}
.carga-dif.down{color:#FF5C7A}

.provas{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.prova{display:flex;align-items:baseline;gap:7px;background:var(--ink2);border:1px solid var(--linha);
  border-radius:12px;padding:11px 13px}
.prova b{font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:21px;font-weight:700}
.prova span{font-size:11px;color:var(--mute)}
.prova em{font-style:normal;font-size:14px;margin-left:auto}
.prova button{background:none;border:none;color:var(--fraco);font-size:12px;cursor:pointer;padding:0 0 0 10px}
.prova.perto{border-color:rgba(255,92,122,.4);background:rgba(255,92,122,.07)}
.prova.perto b{color:#FF5C7A}
.add-prova{display:flex;gap:7px}
.in-sel,.in-data{background:var(--ink2);border:1px solid var(--linha);border-radius:11px;padding:10px;
  color:var(--texto);font-size:13px;outline:none}
.in-sel{flex:1;min-width:0}
.in-data{width:140px}

.materias{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 22px}
.mat{font-size:12.5px;padding:7px 12px;border-radius:999px;background:var(--ink2);border:1px solid var(--linha);
  color:var(--mute);cursor:pointer}
.mat.on{background:#7C6BFF;border-color:#7C6BFF;color:#0E1020;font-weight:600}
.pomo{position:relative;width:200px;margin:0 auto 20px}
.ring{width:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#252B4A;stroke-width:9}
.ring-fg{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.pomo-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pomo-t{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:38px;font-weight:700}
.pomo-l{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--mute);margin-top:4px}
.pomo-btns{display:flex;flex-direction:column;gap:9px}

.barras{display:flex;flex-direction:column;gap:9px}
.barra-linha{display:grid;grid-template-columns:108px 1fr 40px;align-items:center;gap:9px}
.barra-lab{font-size:11.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{height:7px;background:var(--linha);border-radius:9px;overflow:hidden}
.bfill{height:100%;background:#7C6BFF;border-radius:9px;transition:width .4s}
.bfill.dv{background:#FF5C7A}
.barra-v{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--mute);text-align:right}

.comp{background:var(--ink2);border:1px solid var(--linha);border-radius:17px;padding:14px;margin:8px 0 16px}
.comp.editando{border-color:#7C6BFF;box-shadow:0 0 0 3px rgba(124,107,255,.12)}
.comp-txt{width:100%;background:transparent;border:none;resize:none;color:var(--texto);
  font-size:15px;line-height:1.55;outline:none}
.comp-txt::placeholder{color:var(--fraco)}
.comp-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px;padding-top:12px;border-top:1px solid var(--linha)}
.tag{font-size:11.5px;padding:5px 10px;border-radius:999px;background:transparent;border:1px solid var(--linha);
  color:var(--mute);cursor:pointer}
.tag.on{background:var(--c);border-color:var(--c);color:#0E1020;font-weight:600}

nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--navbg);backdrop-filter:blur(14px);border-top:1px solid var(--linha);
  padding:9px 0 max(9px,env(safe-area-inset-bottom));z-index:20}
.navbtn{background:none;border:none;color:var(--fraco);font-size:8.5px;display:flex;
  flex-direction:column;align-items:center;gap:3px;padding:5px;cursor:pointer}
.navbtn.on{color:var(--texto)}
.navic{font-size:16px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #7C6BFF;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ============ ETAPA 1 · refinamento visual ============ */
main{padding:0 var(--e5);max-width:640px}
main.entrar>*{animation:sobe var(--tl) both}
main.entrar>*:nth-child(2){animation-delay:40ms}
main.entrar>*:nth-child(3){animation-delay:80ms}
main.entrar>*:nth-child(4){animation-delay:120ms}
main.entrar>*:nth-child(n+5){animation-delay:160ms}
@keyframes sobe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulsar{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

button{transition:transform var(--t),background var(--t),border-color var(--t),color var(--t),opacity var(--t)}
button:active{transform:scale(.975)}
.bloco,.menu button,.tema-op,.mes-dia{transition:background var(--t),border-color var(--t),opacity var(--t)}

/* cabeçalho */
.top{padding:var(--e5) var(--e5) var(--e3)}
.logo{font-size:25px;letter-spacing:-.03em}
.eyebrow{font-size:10px;letter-spacing:.18em}
.clock{font-variant-numeric:tabular-nums;padding:6px 13px;border-radius:var(--r1)}
.gear{width:36px;height:36px;border-radius:var(--r1)}
.gear:hover{color:var(--texto);border-color:var(--roxo)}

/* saudação */
.dash-ola{margin:var(--e1) 0 var(--e4)}
.dash-ola h2{font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:26px;font-weight:700;
  letter-spacing:-.03em;margin:0;line-height:1.1}
.dash-ola p{margin:6px 0 0;font-size:13.5px;color:var(--mute);line-height:1.45}

/* bloco atual */
.agora{border-radius:var(--r4);padding:var(--e5) var(--e5) var(--e4);margin-bottom:var(--e3);
  box-shadow:var(--el2)}
.agora-bar{height:2px;transition:width var(--tl)}
.agora-tag{display:flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:.26em;margin-bottom:var(--e2)}
.pulso{width:6px;height:6px;border-radius:50%;background:var(--c);display:inline-block;
  animation:pulsar 2.4s ease-in-out infinite}
.agora-tit{font-size:28px;line-height:1.1;margin-bottom:var(--e2);text-wrap:balance}
.agora-meta{font-variant-numeric:tabular-nums;font-size:11.5px}
.agora-falta{color:var(--c);margin-left:6px}
.agora-nota{margin-top:var(--e3);font-size:13px;line-height:1.5;max-width:44ch}
.agora-acoes{gap:var(--e2);margin-top:var(--e5)}
.agora-btn{padding:14px;border-radius:var(--r2);font-size:14.5px;letter-spacing:-.01em}
.agora-nota-btn{padding:14px var(--e4);border-radius:var(--r2);font-size:13px}

/* próxima tarefa */
.dash-prox{display:flex;align-items:center;gap:var(--e3);width:100%;text-align:left;
  background:var(--ink2);border:1px solid var(--linha);border-left:2px solid var(--c);
  border-radius:var(--r1) var(--r2) var(--r2) var(--r1);padding:var(--e3) var(--e4);
  color:var(--texto);cursor:pointer;margin-bottom:var(--e4)}
.dash-prox:hover{border-color:var(--c)}
.prox-ic{color:var(--c);font-size:14px;flex-shrink:0}
.prox-txt{flex:1;min-width:0}
.prox-txt em{display:block;font-style:normal;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.prox-txt b{display:block;font-size:14px;font-weight:500;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prox-em{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--mute);
  font-variant-numeric:tabular-nums;flex-shrink:0}

/* resumo */
.dash-resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--e2);margin-bottom:var(--e3)}
.mtr{background:var(--ink2);border:1px solid var(--linha);border-radius:var(--r2);
  padding:var(--e3) var(--e2) var(--e2);text-align:center;box-shadow:var(--el1)}
.mtr b{display:block;font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:19px;font-weight:700;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.mtr b i{font-style:normal;font-size:11px;font-weight:400;color:var(--mute);margin-left:1px}
.mtr span{display:block;font-size:10px;color:var(--mute);margin:5px 0 7px}
.mtr-tr{height:3px;background:var(--linha);border-radius:9px;overflow:hidden}
.mtr-fl{height:100%;background:var(--c);border-radius:9px;transition:width var(--tl)}

/* progresso */
.dash-prog{display:flex;align-items:center;gap:var(--e3);margin-bottom:var(--e3)}
.dash-prog .pnum{font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.ptrack{height:6px}

/* aviso */
.dash-aviso{display:flex;gap:var(--e3);align-items:flex-start;border-radius:var(--r2);
  padding:var(--e3) var(--e4);margin-bottom:var(--e5);border:1px solid var(--linha);background:var(--ink2)}
.dash-aviso p{margin:0;font-size:13px;line-height:1.5;color:#B8C0DE}
.aviso-ic{width:7px;height:7px;border-radius:50%;background:var(--mute);flex-shrink:0;margin-top:6px}
.dash-aviso.urgente{border-color:rgba(255,92,122,.4);background:rgba(255,92,122,.07)}
.dash-aviso.urgente .aviso-ic{background:var(--rosa);box-shadow:0 0 10px var(--rosa)}
.dash-aviso.atencao{border-color:rgba(224,178,60,.35);background:rgba(224,178,60,.06)}
.dash-aviso.atencao .aviso-ic{background:var(--ambar)}
.dash-aviso.bom{border-color:rgba(43,179,163,.35);background:rgba(43,179,163,.06)}
.dash-aviso.bom .aviso-ic{background:var(--verde)}
[data-tema="claro"] .dash-aviso p{color:var(--texto)}

/* seções e listas */
h3.sub{margin:var(--e6) 0 var(--e3);font-size:11px;letter-spacing:.16em}
.bloco{padding:var(--e3) var(--e1);gap:var(--e2)}
.bloco:hover{background:rgba(124,107,255,.05)}
.bl-tit{font-size:14px;line-height:1.35}
.bl-hora{font-variant-numeric:tabular-nums}
.bl-check{transition:opacity var(--t)}
.timeline{margin-bottom:var(--e5)}

/* medidores */
.medidor{border-radius:var(--r3);padding:var(--e4);margin-bottom:var(--e3);box-shadow:var(--el1)}
.med-top b{font-variant-numeric:tabular-nums}
.refs{gap:var(--e2);margin-bottom:var(--e3)}
.ref{padding:12px 4px;border-radius:var(--r2)}
.quick button{padding:10px;border-radius:var(--r1)}
.quick button:hover{border-color:var(--ambar)}
.copo{transition:background var(--t),border-color var(--t),transform var(--t)}
.copo:active{transform:scale(.9)}
.med{border-radius:var(--r2);padding:var(--e3) var(--e4);margin-bottom:var(--e3)}
.sobrev{border-radius:var(--r3);padding:var(--e3) var(--e4);margin-bottom:var(--e5)}

/* cartões gerais */
.prova,.ex,.nota,.comp,.lembrete,.ed-bloco,.menu button,.tema-op{box-shadow:var(--el1)}
.ex{border-radius:var(--r2);padding:var(--e3)}
.nota{border-radius:var(--e1) var(--r2) var(--r2) var(--e1)}
.comp{border-radius:var(--r3)}
.btn-grande,.btn-ghost{border-radius:var(--r2);padding:15px}
.btn-grande{letter-spacing:-.01em}
.btn-ghost:hover{border-color:var(--roxo);color:var(--texto)}
.veredito{border-radius:var(--r3);padding:var(--e4)}
.barra-v,.carga-v,.carga-dif,.pnum,.prova b{font-variant-numeric:tabular-nums}

/* mês */
.mes-dia:hover{border-color:var(--roxo)}
.mes-nav:hover{border-color:var(--roxo)}

/* ajustes */
.sheet{border-radius:var(--r4) var(--r4) 0 0;padding:var(--e5) var(--e5) 44px;
  animation:subirSheet var(--tl) both}
@keyframes subirSheet{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.menu button:hover{border-color:var(--roxo)}
.overlay{animation:aparecer var(--t) both}
@keyframes aparecer{from{opacity:0}to{opacity:1}}

/* navegação */
nav{padding:var(--e2) 0 max(var(--e2),env(safe-area-inset-bottom))}
.navbtn{gap:4px;padding:6px 2px;position:relative}
.navbtn .navic{font-size:15px;transition:transform var(--t)}
.navbtn.on .navic{transform:translateY(-1px)}
.navbtn.on::after{content:"";position:absolute;top:0;width:16px;height:2px;border-radius:9px;
  background:var(--roxo)}

/* telas maiores */
@media (min-width:520px){
  .dash-ola h2{font-size:30px}
  .agora-tit{font-size:32px}
  .mtr b{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  main.entrar>*,.sheet,.overlay{animation:none}
  .pulso{animation:none}
  button:active{transform:none}
}

/* etapa 2 · rotina */
.rot-acoes{display:flex;flex-wrap:wrap;align-items:center;gap:var(--e2);margin-bottom:var(--e4);
  padding-bottom:var(--e3);border-bottom:1px solid var(--linha)}
.rot-acoes span{font-size:12px;color:var(--mute);width:100%}
.ed-l3{display:flex;align-items:center;gap:6px;margin-top:var(--e2);
  padding-top:var(--e2);border-top:1px solid var(--linha)}
.mini-b{background:transparent;border:1px solid var(--linha);color:var(--mute);border-radius:8px;
  padding:6px 9px;font-size:11px;cursor:pointer;white-space:nowrap}
.mini-b:hover:not(:disabled){border-color:var(--roxo);color:var(--texto)}
.mini-b:disabled{opacity:.3;cursor:default}
.mini-b.prio.p2{border-color:var(--rosa);color:var(--rosa)}
.mini-b.prio.p0{opacity:.55}
.ed-hist{margin-left:auto;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;color:var(--fraco);
  white-space:nowrap}
.ed-bloco.prio-2{border-left:2px solid var(--rosa)}
.ed-bloco.prio-0{opacity:.72}
.bl-alta{display:inline-block;font-style:normal;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:8.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--rosa);border:1px solid rgba(255,92,122,.4);
  border-radius:4px;padding:1px 5px;margin-left:7px;vertical-align:middle}
.bloco.leve .bl-tit{color:var(--mute)}

/* etapa 2 · gráficos, recordes */
.spark{display:flex;align-items:flex-end;gap:2px;width:100%;background:var(--ink2);
  border:1px solid var(--linha);border-radius:var(--r2);padding:var(--e2);box-shadow:var(--el1)}
.spark i{flex:1;background:var(--c);border-radius:2px;min-height:2px;opacity:.85;
  transition:height var(--tl)}
.spark i:last-child{opacity:1}
.spark-lab{display:flex;gap:2px;margin-top:5px}
.spark-lab span{flex:1;text-align:center;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  font-size:9px;color:var(--fraco)}
.prs{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--e3)}
.pr{display:flex;align-items:baseline;gap:var(--e3);background:var(--ink2);border:1px solid var(--linha);
  border-radius:var(--r2);padding:11px 13px;box-shadow:var(--el1)}
.pr.novo{border-color:rgba(43,179,163,.45)}
.pr-nome{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr b{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;color:var(--laranja);
  font-variant-numeric:tabular-nums}
.pr b i{font-style:normal;font-size:10px;color:var(--mute)}
.pr em{font-style:normal;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;
  text-transform:uppercase;letter-spacing:.1em;color:var(--verde)}
.evo{background:var(--ink2);border:1px solid var(--linha);border-radius:var(--r2);
  padding:var(--e3);margin-bottom:var(--e2);box-shadow:var(--el1)}
.evo-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--e2);margin-bottom:var(--e2)}
.evo-top span{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evo-top b{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--mute)}
.evo-top b.up{color:var(--verde)}
.evo-top b.down{color:var(--rosa)}
.evo .spark{border:none;background:transparent;padding:0;box-shadow:none}
.evo-pe{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;color:var(--fraco);margin-top:6px}

/* etapa 2 · alimentação, notas, calendário */
.comp-esq{display:flex;gap:var(--e3);flex-wrap:wrap}
.chk-lista{display:flex;flex-direction:column;gap:2px;margin:0}
.chk{display:flex;align-items:flex-start;gap:9px;background:none;border:none;padding:5px 0;
  color:var(--texto);font-size:14px;line-height:1.45;text-align:left;cursor:pointer;width:100%}
.chk-box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--borda2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink);
  margin-top:1px;transition:background var(--t),border-color var(--t)}
.chk.on .chk-box{background:var(--verde);border-color:var(--verde)}
.chk.on span:last-child{color:var(--mute);text-decoration:line-through}
.chk-txt{display:block;font-size:14px;line-height:1.5;padding:4px 0}
.chk-prog{display:flex;align-items:center;gap:var(--e2);margin-top:var(--e2)}
.chk-prog .ptrack{height:4px}
.chk-prog .pnum{font-size:10.5px}
.filtro.fv.on{background:var(--roxo);border-color:var(--roxo);color:#fff}
.evs{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--e2)}
.ev{display:flex;align-items:center;gap:var(--e3);background:var(--ink2);border:1px solid var(--linha);
  border-left:2px solid var(--verde);border-radius:var(--r1) var(--r2) var(--r2) var(--r1);
  padding:11px 13px;box-shadow:var(--el1)}
.ev b{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--verde);
  font-variant-numeric:tabular-nums;flex-shrink:0}
.ev span{flex:1;font-size:13.5px;word-break:break-word}
.ev button{background:none;border:none;color:var(--fraco);font-size:12px;cursor:pointer;padding:0 2px}
.add-ev{display:flex;gap:7px;align-items:center;margin-bottom:var(--e5)}
.add-ev .in-texto{flex:1;min-width:0}
.pt.cp{background:var(--verde)}   /* compromisso — nome próprio para não colidir com .ev (cartão) */

/* etapa 3 · estatísticas */
.filtro-linha{display:flex;gap:var(--e2);margin:var(--e2) 0 var(--e3)}
.chip{flex:1;padding:10px 6px;border-radius:var(--r2);background:var(--ink2);border:1px solid var(--linha);
  color:var(--mute);font-size:12.5px;cursor:pointer}
.chip.on{background:var(--roxo);border-color:var(--roxo);color:#fff;font-weight:600}
.cartao{background:var(--ink2);border:1px solid var(--linha);border-radius:var(--r3);
  padding:var(--e4);margin-bottom:var(--e3);box-shadow:var(--el1)}
.cartao-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--e2);
  margin-bottom:var(--e3)}
.cartao-top span{font-size:12.5px;color:var(--mute)}
.cartao-pe{margin-top:var(--e3);font-size:12px;color:var(--mute)}
.cartao-pe b{color:var(--texto);font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.delta{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--mute);
  font-variant-numeric:tabular-nums;flex-shrink:0}
.delta.up{color:var(--verde)}
.delta.down{color:var(--rosa)}
.graf{position:relative;width:100%}
.graf svg{width:100%;height:100%;display:block;overflow:visible}
.graf-max{position:absolute;top:0;right:0;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:9.5px;
  color:var(--fraco);font-variant-numeric:tabular-nums}
.graf-nota{display:flex;justify-content:space-between;margin:5px 0 var(--e4);
  font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:9.5px;color:var(--fraco)}
.graf-b{width:100%}
.gb-bars{display:flex;align-items:flex-end;gap:3px;width:100%}
.gb{flex:1;height:100%;display:flex;align-items:flex-end}
.gb i{width:100%;background:var(--c);border-radius:3px 3px 2px 2px;min-height:2px;
  opacity:.9;transition:height var(--tl)}
.gb:last-child i{opacity:1}
.gb-labs{display:flex;gap:3px;margin-top:6px}
.gb-labs span{flex:1;text-align:center;font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:9px;
  color:var(--fraco)}
.calor{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
.calor i{aspect-ratio:1;border-radius:3px;background:var(--roxo);display:block}
@media (max-width:400px){.calor{grid-template-columns:repeat(10,1fr)}}

/* etapa 4 · inteligência */
.sugs{display:flex;flex-direction:column;gap:var(--e2);margin-bottom:var(--e5)}
.sug{display:flex;gap:var(--e3);align-items:flex-start;background:var(--ink2);
  border:1px solid var(--linha);border-radius:var(--r2);padding:var(--e3) var(--e4);
  box-shadow:var(--el1)}
.sug-ic{width:7px;height:7px;border-radius:50%;background:var(--mute);flex-shrink:0;margin-top:6px}
.sug-txt{flex:1;min-width:0}
.sug-txt b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.sug-txt p{margin:4px 0 0;font-size:12.5px;line-height:1.5;color:var(--mute)}
.sug-btn{margin-top:var(--e2);background:transparent;border:1px solid var(--linha);
  color:var(--texto);border-radius:9px;padding:7px 11px;font-size:12px;cursor:pointer}
.sug-btn:hover{border-color:var(--roxo)}
.sug.urgente{border-color:rgba(255,92,122,.4);background:rgba(255,92,122,.06)}
.sug.urgente .sug-ic{background:var(--rosa);box-shadow:0 0 10px var(--rosa)}
.sug.atencao{border-color:rgba(224,178,60,.32)}
.sug.atencao .sug-ic{background:var(--ambar)}
.sug.bom .sug-ic{background:var(--verde)}
.plano{background:var(--ink2);border:1px solid var(--roxo);border-radius:var(--r3);
  padding:var(--e4);margin-bottom:var(--e4);box-shadow:var(--el2)}
.plano.aplicado{border-color:var(--linha)}
.plano-top{margin-bottom:var(--e3)}
.plano-top b{display:block;font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:15px}
.plano-top span{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}
.plano-lista{list-style:none;padding:0;margin:0 0 var(--e3)}
.plano-lista li{display:flex;align-items:center;gap:var(--e2);padding:8px 0;
  border-bottom:1px solid var(--linha);font-size:13px}
.pl-tit{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-de{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;color:var(--fraco);
  text-decoration:line-through;font-variant-numeric:tabular-nums}
.pl-seta{color:var(--fraco);font-size:11px}
.pl-para{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--roxo);
  font-variant-numeric:tabular-nums}
.plano-corte,.plano-nota,.plano-vazio{margin:0 0 var(--e3);font-size:12px;line-height:1.5;color:var(--mute)}
.plano-corte{color:var(--ambar)}
.plano-btns{display:flex;gap:var(--e2);align-items:center}

/* ============ ETAPA 7 · polimento ============ */
/* Confirmação de toque: só o item recém-marcado anima, não a lista toda. */
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.bloco.pop .bl-check{animation:pop 320ms cubic-bezier(.2,1.3,.4,1) both}
.bloco.pop{animation:fade 220ms both}
.copo.on{animation:pop 260ms cubic-bezier(.2,1.3,.4,1) both}
.chk.on .chk-box{animation:pop 240ms cubic-bezier(.2,1.3,.4,1) both}

/* Alvos de toque: nada abaixo de 44px de altura efetiva. */
.bloco{min-height:46px}
.navbtn{min-height:46px}
.nota-ic{min-width:30px;min-height:30px}
.mini-b{min-height:34px}

/* Telas estreitas: 4 métricas em uma linha ficam ilegíveis. */
@media (max-width:359px){
  .dash-resumo{grid-template-columns:repeat(2,1fr)}
  main{padding:0 var(--e4)}
  .agora{padding:var(--e4)}
  .agora-tit{font-size:24px}
  .navbtn{font-size:8px}
}
/* Telas largas: respiro sem esticar a coluna de leitura. */
@media (min-width:700px){
  main{max-width:660px}
  .sheet{border-radius:var(--r4);margin-bottom:var(--e5)}
  .overlay{align-items:center}
}
/* Rolagem suave dentro do painel de ajustes, sem pular no iOS. */
.sheet{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.filtros,.secoes,.filtro-linha{overscroll-behavior-x:contain}

/* Estado de foco visível também em fundo claro. */
[data-tema="claro"] button:focus-visible{outline-color:#6355E8}

@media (prefers-reduced-motion:reduce){
  .bloco.pop .bl-check,.bloco.pop,.copo.on,.chk.on .chk-box{animation:none}
}

/* ============ ETAPA 8 · plano semanal e relatório ============ */
.psem{list-style:none;padding:0;margin:0 0 var(--e3)}
.psem-dia{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute);padding:var(--e3) 0 5px;border-bottom:1px solid var(--linha)}
.psem-item{display:flex;align-items:center;gap:var(--e3);padding:9px 0;border-bottom:1px solid var(--linha)}
.psem-h{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;color:var(--mute);
  font-variant-numeric:tabular-nums;flex-shrink:0}
.psem-txt{flex:1;min-width:0}
.psem-txt b{display:block;font-size:13.5px;font-weight:500}
.psem-txt em{display:block;font-style:normal;font-size:11px;color:var(--mute);margin-top:2px}
.psem-tot{display:flex;flex-wrap:wrap;gap:var(--e2);margin-bottom:var(--e3)}
.psem-tot span{font-size:11px;color:var(--mute);border:1px solid var(--linha);border-radius:999px;
  padding:5px 10px}
.psem-tot b{color:var(--roxo);font-family:'JetBrains Mono',ui-monospace,monospace}
.psem-ativo{background:var(--ink2);border:1px solid var(--linha);border-radius:var(--r2);
  padding:var(--e2) var(--e4);margin-bottom:var(--e2);box-shadow:var(--el1)}
.psem-linha{display:flex;justify-content:space-between;align-items:center;gap:var(--e3);
  padding:8px 0;border-bottom:1px solid var(--linha);font-size:13px}
.psem-linha:last-child{border-bottom:none}
.psem-linha span{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:var(--mute)}
.psem-linha b{font-weight:500}
.bl-mat{display:inline-block;font-style:normal;font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--roxo);
  border:1px solid rgba(124,107,255,.4);border-radius:4px;padding:1px 5px;margin-left:7px;
  vertical-align:middle}
.agora-mat{margin-top:6px;font-size:12px;color:var(--mute)}
.agora-mat b{color:var(--c);font-weight:600}
.rel{background:var(--ink2);border:1px solid var(--linha);border-radius:var(--r3);
  padding:var(--e4);margin-bottom:var(--e4);box-shadow:var(--el1)}
.rel-top{margin-bottom:var(--e3)}
.rel-top b{display:block;font-family:'Space Grotesk',sans-serif;font-size:17px;margin-top:2px}
.rel-grade{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--e2);margin-bottom:var(--e4)}
.rel-item{display:flex;align-items:baseline;gap:6px;background:var(--ink);border:1px solid var(--linha);
  border-radius:var(--r1);padding:10px 11px}
.rel-item span{font-size:11px;color:var(--mute);flex:1}
.rel-item b{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;
  font-variant-numeric:tabular-nums}
.rel-aj-tit{display:block;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:var(--e3)}
.aj{display:flex;gap:var(--e3);align-items:flex-start;padding:var(--e3) 0;border-top:1px solid var(--linha)}
.aj-n{width:20px;height:20px;border-radius:50%;background:var(--roxo);color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;margin-top:1px}
.aj-txt{flex:1;min-width:0}
.aj-txt b{display:block;font-size:13.5px;font-weight:600}
.aj-txt em{display:block;font-style:normal;font-size:12px;color:var(--mute);line-height:1.45;margin-top:3px}
@media (max-width:359px){.rel-grade{grid-template-columns:1fr}}

/* ============ padrões descobertos ============ */
.pads{display:flex;flex-direction:column;gap:var(--e2);margin-bottom:var(--e3)}
.pad{display:flex;gap:var(--e3);align-items:flex-start;background:var(--ink2);
  border:1px solid var(--linha);border-radius:var(--r2);padding:var(--e3) var(--e4);
  box-shadow:var(--el1)}
.pad-ic{width:26px;height:26px;border-radius:8px;background:var(--ink);border:1px solid var(--linha);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--roxo);
  flex-shrink:0;margin-top:1px}
.pad-txt{flex:1;min-width:0}
.pad-txt b{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
.pad-txt em{display:block;font-style:normal;font-size:11.5px;color:var(--mute);
  line-height:1.45;margin-top:4px}

/* ============ metas ============ */
.meta-c{background:var(--ink2);border:1px solid var(--linha);border-radius:var(--r3);
  padding:var(--e4);margin-bottom:var(--e3);box-shadow:var(--el1)}
.meta-c.feita{border-color:rgba(43,179,163,.45)}
.meta-c.atrasada{border-color:rgba(224,178,60,.35)}
.meta-top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--e2);margin-bottom:var(--e3)}
.meta-top b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.meta-top em{display:block;font-style:normal;font-size:11px;color:var(--mute);margin-top:3px}
.meta-x{background:none;border:none;color:var(--fraco);font-size:12px;cursor:pointer;padding:2px 4px}
.meta-num{display:flex;align-items:baseline;gap:6px;margin-bottom:var(--e2)}
.meta-num b{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.meta-num span{font-size:12.5px;color:var(--mute)}
.meta-pct{margin-left:auto;font-style:normal;font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.meta-linhas{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--e2);margin-top:var(--e3)}
.meta-linhas span{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;
  font-variant-numeric:tabular-nums}
.meta-linhas em{display:block;font-style:normal;font-family:'Inter',sans-serif;font-size:10px;
  color:var(--mute);margin-bottom:2px;text-transform:uppercase;letter-spacing:.1em}
.est.atrasada{color:var(--ambar)}
.est.feita{color:var(--verde)}
.est.adiantada{color:var(--verde)}
.meta-nota{margin:var(--e3) 0 0;font-size:12px;line-height:1.5;color:var(--mute)}
.meta-nota.feita{color:var(--verde)}
.meta-nota.fora-do-prazo{color:var(--ambar)}
.meta-manual{display:flex;gap:var(--e2);margin-top:var(--e3)}
.meta-manual .in-larga{flex:1}
.modelos{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--e3)}
.modelo{display:flex;align-items:center;gap:var(--e2);background:var(--ink2);border:1px solid var(--linha);
  border-radius:var(--r2);padding:12px 14px;color:var(--texto);font-size:13.5px;cursor:pointer;text-align:left}
.modelo:hover{border-color:var(--roxo)}
.modelo span{flex:1}
.modelo i{font-style:normal;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;
  text-transform:uppercase;letter-spacing:.1em;color:var(--mute);border:1px solid var(--linha);
  border-radius:999px;padding:3px 8px}

/* ============ leitura automática ============ */
.leitura{display:flex;flex-direction:column;gap:2px;margin-bottom:var(--e3)}
.leitura.destaque{background:var(--ink2);border:1px solid var(--linha);border-radius:var(--r3);
  padding:var(--e4);margin-bottom:var(--e4);box-shadow:var(--el1)}
.lt{display:flex;gap:10px;align-items:flex-start;margin:0;padding:7px 0;
  font-size:13px;line-height:1.5;color:#B8C0DE}
.lt span{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:7px;background:var(--mute)}
.lt.bom span{background:var(--verde)}
.lt.atencao span{background:var(--ambar)}
.lt.neutro span{background:var(--fraco)}
[data-tema="claro"] .lt{color:var(--texto)}

/* ============ exportação ============ */
.exp-b{display:flex;gap:var(--e3);align-items:flex-start;width:100%;text-align:left;
  background:var(--ink2);border:1px solid var(--linha);border-radius:var(--r3);
  padding:var(--e4);margin-bottom:var(--e2);color:var(--texto);cursor:pointer;
  box-shadow:var(--el1)}
.exp-b:hover{border-color:var(--roxo)}
.exp-ic{width:36px;height:36px;border-radius:var(--r1);background:var(--ink);
  border:1px solid var(--linha);display:flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--roxo);flex-shrink:0}
.exp-t{flex:1;min-width:0}
.exp-t b{display:block;font-size:14.5px;font-weight:600}
.exp-t em{display:block;font-style:normal;font-size:11.5px;color:var(--mute);
  line-height:1.45;margin-top:3px}

/* ============ vozes do assistente ============ */
.voz{display:block;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.aviso-txt{flex:1;min-width:0}
.dash-aviso{align-items:flex-start}
.dash-aviso .aviso-ic{margin-top:4px}
.sug-txt .voz{margin-bottom:4px}
.leitura>.voz{margin-bottom:var(--e2)}

/* ============ PWA ============ */
.atualizar{position:fixed;left:12px;right:12px;top:12px;z-index:70;background:var(--verde);
  color:#06231F;border-radius:15px;padding:13px 15px;display:flex;align-items:center;gap:12px;
  box-shadow:0 12px 40px var(--sombra)}
.atualizar b{display:block;font-family:'Space Grotesk',sans-serif;font-size:14.5px}
.atualizar span{font-size:11.5px;opacity:.75}
.atualizar button{margin-left:auto;background:rgba(6,35,31,.18);border:none;color:#06231F;
  border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:600;cursor:pointer}
.pwa-estado{display:flex;gap:var(--e3);align-items:flex-start;background:var(--ink2);
  border:1px solid var(--linha);border-radius:var(--r2);padding:var(--e3) var(--e4);
  margin-bottom:var(--e3);box-shadow:var(--el1)}
.pwa-estado.ok{border-color:rgba(43,179,163,.45)}
.pwa-dot{width:9px;height:9px;border-radius:50%;background:var(--fraco);flex-shrink:0;margin-top:5px}
.pwa-estado.ok .pwa-dot{background:var(--verde);box-shadow:0 0 12px var(--verde)}
.pwa-estado b{display:block;font-size:14px;font-weight:600}
.pwa-estado em{display:block;font-style:normal;font-size:11.5px;color:var(--mute);margin-top:3px;line-height:1.4}
.diag{background:var(--ink2);border:1px solid var(--linha);border-radius:var(--r1);
  padding:var(--e3);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;
  color:var(--mute);white-space:pre-wrap;margin:var(--e2) 0 0;overflow-x:auto}

/* =====================================================================
   SISTEMA VISUAL — camada de refinamento
   Tudo abaixo apenas ajusta o que já existe. Nenhum seletor novo de
   estrutura; nenhuma regra remove comportamento.
   ===================================================================== */

/* ---------- tipografia ---------- */
body{font-size:var(--t-texto);line-height:1.5;letter-spacing:-.006em;
  text-rendering:optimizeLegibility}
.logo{font-size:22px;letter-spacing:-.045em;font-weight:700}
.eyebrow{font-size:var(--t-micro);letter-spacing:.2em;font-weight:500}
.dash-ola h2{font-size:var(--t-hero);line-height:1.06;letter-spacing:-.045em;font-weight:700}
.dash-ola p{font-size:var(--t-texto);line-height:1.5;margin-top:var(--e2)}
.agora-tit{font-size:var(--t-titulo);line-height:1.12;letter-spacing:-.038em}
.treino-nome{font-size:var(--t-hero);letter-spacing:-.045em}
.mes-nome{font-size:var(--t-titulo);letter-spacing:-.035em}
h3.sub{font-size:var(--t-micro);letter-spacing:.19em;font-weight:600;
  margin:var(--e7) 0 var(--e4)}
.bl-tit,.sug-txt b,.aj-txt b,.menu-txt b,.pad-txt b{letter-spacing:-.012em}
.explica{font-size:13px;line-height:1.62;max-width:62ch}
.lt{font-size:13.5px;line-height:1.6}

/* ---------- superfícies ---------- */
.agora,.medidor,.cartao,.meta-c,.rel,.leitura.destaque,.sug,.pad,.exp-b,
.menu button,.tema-op,.ex,.nota,.comp,.prova,.ev,.psem-ativo,.lembrete,
.ed-bloco,.mtr,.pr,.evo,.plano,.pwa-estado,.spark,.modelo,.dash-prox,
.dash-aviso,.med,.sobrev{
  background-image:var(--luz);
  border-color:var(--linha);
}
.agora{border-radius:var(--r5);padding:var(--e5);box-shadow:var(--el3)}
.cartao,.meta-c,.rel,.leitura.destaque,.medidor,.exp-b,.pwa-estado{
  border-radius:var(--r4);padding:var(--e5);box-shadow:var(--el1)}
.sug,.pad,.menu button,.tema-op,.ex,.nota,.comp,.prova,.ev,.modelo,
.psem-ativo,.lembrete,.ed-bloco,.dash-prox,.dash-aviso,.med,.sobrev,.plano{
  border-radius:var(--r3);box-shadow:var(--el1)}
.mtr{border-radius:var(--r2);box-shadow:var(--el1)}
.veredito{border-radius:var(--r4);padding:var(--e5)}
.sheet{border-radius:var(--r5) var(--r5) 0 0;box-shadow:var(--el3)}

/* ---------- respiro ---------- */
main{padding:0 var(--e5) var(--e6)}
.dash-ola{margin:var(--e3) 0 var(--e5)}
.agora{margin-bottom:var(--e4)}
.dash-prox{margin-bottom:var(--e5);padding:var(--e4) var(--e5)}
.dash-resumo{gap:var(--e3);margin-bottom:var(--e4)}
.dash-prog{margin-bottom:var(--e4)}
.dash-aviso{padding:var(--e4) var(--e5);margin-bottom:var(--e6)}
.sugs{gap:var(--e3);margin-bottom:var(--e7)}
.sug{padding:var(--e4) var(--e5)}
.timeline{margin-bottom:var(--e6)}
.bloco{padding:var(--e4) var(--e2);gap:var(--e3);min-height:52px}
.medidor{margin-bottom:var(--e4)}
.refs{gap:var(--e2);margin-bottom:var(--e4)}
.cartao,.meta-c{margin-bottom:var(--e4)}
.barras{gap:var(--e3)}
.provas{gap:var(--e2)}
.sobrev{padding:var(--e4) var(--e5);margin-bottom:var(--e6)}

/* ---------- botões: seis estados ---------- */
.agora-btn,.btn-grande,.btn-salvar,.chip.on,.tipo.on,.mat.on{
  box-shadow:0 1px 2px rgba(0,0,0,.18)}
.agora-btn,.btn-grande{border-radius:var(--r2);padding:16px;font-size:15px;
  font-weight:600;letter-spacing:-.015em}
.btn-ghost,.btn-ghost-mini,.sug-btn,.mini-b,.chip,.filtro,.ref,.tipo,.mat,.sec{
  border-radius:var(--r2)}
.btn-ghost{padding:15px}
button{transition:transform var(--t),background var(--t2),border-color var(--t2),
  color var(--t2),opacity var(--t2),box-shadow var(--t2)}
button:hover:not(:disabled){filter:brightness(1.06)}
button:active:not(:disabled){transform:scale(.978);filter:brightness(.96)}
button:disabled,button[disabled]{opacity:.38;cursor:not-allowed;filter:none}
button:focus-visible{outline:2px solid var(--roxo);outline-offset:3px;border-radius:var(--r1)}
.btn-carregando{position:relative;color:transparent!important;pointer-events:none}
.btn-carregando::after{content:"";position:absolute;inset:0;margin:auto;
  width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;animation:girar 640ms linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}

/* ---------- listas ---------- */
.bloco{border-bottom-color:var(--linha)}
.bloco:last-child{border-bottom:none}
.bl-hora{font-size:var(--t-cap);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.bl-ess,.bl-alta,.bl-pico,.bl-mat{font-size:9px;letter-spacing:.09em;padding:2px 6px;
  border-radius:5px;font-weight:500}
.bloco.atual{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 12%,transparent),transparent 72%);
  border-left-width:2px;border-radius:0 var(--r1) var(--r1) 0}
.nota{border-radius:var(--e1) var(--r3) var(--r3) var(--e1)}
.prova{border-radius:var(--r3);padding:var(--e3) var(--e4)}
.prova b{font-size:24px;letter-spacing:-.04em}

/* ---------- indicadores ---------- */
.mtr{padding:var(--e4) var(--e3) var(--e3)}
.mtr b{font-size:22px;letter-spacing:-.045em}
.mtr b i{font-size:11px}
.mtr span{font-size:var(--t-micro);letter-spacing:.04em;margin:6px 0 9px}
.mtr-tr{height:3px;border-radius:99px}
.mtr-fl{transition:width 700ms var(--ease)}
.ptrack{height:6px;border-radius:99px;background:var(--linha)}
.pfill{border-radius:99px;transition:width 700ms var(--ease)}

/* ---------- gráficos ---------- */
.graf{position:relative}
.graf svg path{stroke-linejoin:round;stroke-linecap:round}
.graf-max{font-size:9px;letter-spacing:.06em;opacity:.8}
.gb i{border-radius:99px;transition:height 620ms var(--ease)}
.gb-bars{gap:4px}
.spark{border-radius:var(--r2);padding:var(--e3);gap:3px}
.spark i{border-radius:99px}
.calor{gap:4px}
.calor i{border-radius:4px;transition:opacity var(--t2)}
.bfill{transition:width 620ms var(--ease)}
.btrack{height:6px;border-radius:99px}
.barra-lab{font-size:12px}
.barra-v{font-size:11px}

/* ---------- calendário ---------- */
.mes-grade{gap:6px}
.mes-dia{border-radius:var(--r2);border-color:transparent;background:var(--ink2)}
.mes-dia:hover{background:var(--ink3);border-color:var(--linha)}
.mes-num{font-size:13.5px;letter-spacing:-.01em}
.mes-anel{border-radius:var(--r2)}
.pt{width:4px;height:4px}
.mes-pts{gap:3px;height:4px}
.mes-dia.hoje{border-color:var(--verde)}
.mes-dia.sel{border-color:transparent;
  box-shadow:0 0 0 2px var(--roxo),var(--el1);background:var(--ink3)}
.mes-dia.com-prova{border-color:color-mix(in srgb,var(--vermelho) 42%,transparent)}
.mes-nav{border-radius:var(--r2);width:40px;height:40px}
.legenda{gap:14px;margin:var(--e3) 0 var(--e5)}

/* ---------- navegação ---------- */
nav{background:var(--navbg);-webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--linha);
  padding:var(--e2) var(--e2) max(var(--e2),env(safe-area-inset-bottom))}
.navbtn{font-size:9.5px;letter-spacing:.01em;font-weight:500;gap:5px;
  border-radius:var(--r2);padding:8px 2px 7px}
.navbtn .navic{transition:transform var(--t2),opacity var(--t2)}
.navbtn.on{color:var(--texto)}
.navbtn.on .navic{transform:translateY(-1px) scale(1.04)}
.navbtn.on::after{content:"";position:absolute;top:2px;width:18px;height:2.5px;
  border-radius:99px;background:var(--roxo);
  animation:aba 250ms var(--ease) both}
@keyframes aba{from{width:0;opacity:0}to{width:18px;opacity:1}}
.navbtn:active{transform:none}
.navbtn:active .navic{transform:scale(.9)}

/* ---------- entradas ---------- */
.in,.in-larga,.in-texto,.in-sel,.in-data,.in-hora,.in-dur,.in-cat,.busca,.backup{
  border-radius:var(--r2);transition:border-color var(--t2),background var(--t2)}
.in:focus,.in-larga:focus,.in-texto:focus,.busca:focus{border-color:var(--roxo)}
.busca{padding:13px 16px}

/* ---------- painel de ajustes ---------- */
.sheet-top h2{font-size:var(--t-sub);letter-spacing:-.03em}
.menu button{padding:var(--e4) var(--e4)}
.menu li{margin-bottom:var(--e2)}
.menu-ic{border-radius:var(--r1);background:var(--ink3)}
.menu-txt b{font-size:var(--t-texto)}
.overlay{align-items:flex-end}

/* ---------- movimento ---------- */
main.entrar>*{animation:sobe var(--tl) both}
@keyframes sobe{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sheet{animation:subirSheet var(--tl) both}
@keyframes subirSheet{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.bloco.pop .bl-check{animation:pop 260ms var(--ease) both}

/* ---------- responsivo ---------- */
@media (min-width:600px){
  main{max-width:680px;padding:0 var(--e6) var(--e7)}
  .dash-ola h2{font-size:38px}
  .agora-tit{font-size:30px}
  .top{padding:var(--e6) var(--e6) var(--e4)}
}
@media (min-width:900px){
  main{max-width:720px}
  nav{max-width:560px;left:50%;transform:translateX(-50%);border-radius:var(--r4) var(--r4) 0 0;
    border-left:1px solid var(--linha);border-right:1px solid var(--linha)}
}
@media (max-width:359px){
  .dash-ola h2{font-size:28px}
  .agora-tit{font-size:23px}
  main{padding:0 var(--e4) var(--e5)}
  .agora{padding:var(--e4)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}
}

/* ---------- ícones ---------- */
.ic{display:block;flex-shrink:0}
.bl-pino,.prox-ic,.pad-ic,.menu-ic,.navic,.gear,.voltar,.mes-nav,.bl-check{
  display:flex;align-items:center;justify-content:center}
.bl-pino{color:var(--c);opacity:.9}
.bl-check{color:var(--verde)}
.menu-ic{color:var(--roxo)}
.navic{opacity:.9}
.navbtn.on .navic{opacity:1}
.menu-seta{color:var(--fraco);display:flex;align-items:center}

/* ---------- faixa de metas na home ---------- */
.metas-faixa{display:flex;gap:var(--e2);margin-bottom:var(--e5);overflow-x:auto;
  scrollbar-width:none;padding-bottom:2px}
.metas-faixa::-webkit-scrollbar{display:none}
.mf{flex:1;min-width:104px;display:flex;flex-direction:column;align-items:center;gap:var(--e2);
  background:var(--ink2);background-image:var(--luz);border:1px solid var(--linha);
  border-radius:var(--r3);padding:var(--e4) var(--e2);color:var(--texto);cursor:pointer;
  box-shadow:var(--el1)}
.mf:hover{border-color:var(--roxo)}
.mf-anel{position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.mf-anel svg{position:absolute;inset:0}
.mf-anel svg circle{transition:stroke-dashoffset 800ms var(--ease)}
.mf-anel i{font-style:normal;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;
  font-variant-numeric:tabular-nums;color:var(--texto)}
.mf-t{font-size:11px;line-height:1.3;color:var(--mute);text-align:center;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- ajustes finos de contraste e respiro ---------- */
body{padding-bottom:104px}

/* Item já passado precisa recuar sem sumir: 0.38 era ilegível no tema claro. */
.bloco.passou{opacity:.5}
.bloco.feito{opacity:.82}
.bloco.feito .bl-tit{text-decoration-color:var(--fraco);text-decoration-thickness:1px}
[data-tema="claro"] .bloco.passou{opacity:.55}
[data-tema="claro"] .bloco.feito{opacity:.85}

/* Texto secundário sobre cartão claro: sobe um degrau de contraste. */
html[data-tema="claro"]{--mute:#5E6373}
[data-tema="claro"] .dash-aviso p,
[data-tema="claro"] .sug-txt p,
[data-tema="claro"] .lt{color:#3A3E4D}
[data-tema="claro"] .sobrev em,
[data-tema="claro"] .med-txt em{color:#5E6373}

/* Selo do "agora" com peso suficiente para ancorar a tela. */
.agora-tag{font-weight:600;letter-spacing:.22em}
.agora-bar{height:2px;border-radius:0 99px 99px 0}
.agora-falta{font-weight:500}

/* Cabeçalho mais discreto: a saudação é o título da tela, não o logo. */
.top{padding-bottom:var(--e2)}
.clock{font-variant-numeric:tabular-nums;font-size:13px;padding:7px 13px;border-radius:var(--r2)}
.gear{border-radius:var(--r2);width:38px;height:38px}
.gear:hover{color:var(--texto);border-color:var(--roxo);background:var(--ink3)}

/* Barras dos gráficos: cantos redondos só no topo lê melhor que pílula. */
.gb i{border-radius:4px 4px 2px 2px}
.spark i{border-radius:3px 3px 1px 1px}

/* ---------- últimos detalhes ---------- */

/* Linhas roláveis ganham um desvanecer na borda: o corte deixa de parecer
   defeito e passa a indicar que há mais conteúdo à direita. */
.filtros,.secoes,.metas-faixa,.modelos{
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.filtros{gap:var(--e2);padding-bottom:var(--e2);margin-bottom:var(--e5)}
.filtro-linha{gap:var(--e2);margin:var(--e3) 0 var(--e3)}
.filtro{padding:8px 13px;font-size:12px;border-radius:99px}
.filtro.on{background:var(--texto);border-color:var(--texto);color:var(--ink)}
.chip{padding:11px 6px;font-size:13px;font-weight:500}

/* Trilhas de rolagem invisíveis, do jeito que o iOS faz. */
.filtros,.secoes,.metas-faixa,.modelos,.sheet{scrollbar-width:none}
.filtros::-webkit-scrollbar,.secoes::-webkit-scrollbar,
.metas-faixa::-webkit-scrollbar,.modelos::-webkit-scrollbar{display:none}

/* Seleção de texto na cor da marca. */
::selection{background:color-mix(in srgb,var(--roxo) 32%,transparent);color:var(--texto)}

/* O app é uma superfície de toque, não uma página: sem realce cinza no tap. */
*{-webkit-tap-highlight-color:transparent}
button,.bloco{-webkit-touch-callout:none}

/* ---------- painel de ajustes ---------- */
.sheet{padding:var(--e2) var(--e5) var(--e7);max-height:92vh}
.sheet-top{padding:var(--e5) 0 var(--e4);margin-bottom:var(--e2);gap:var(--e2);
  border-bottom:1px solid var(--linha)}
.sheet-top h2{font-size:22px;font-weight:700;letter-spacing:-.035em}
.fechar{width:34px;height:34px;border-radius:50%;background:var(--ink3);
  display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
.fechar:hover{color:var(--texto);border-color:var(--linha2)}
.voltar{width:34px;height:34px;border-radius:50%;background:var(--ink3);margin-right:var(--e2)}

/* Menu: alinhamento em grade fixa, para que descrições longas nunca
   empurrem o ícone nem encostem na seta. */
.menu{margin:var(--e3) 0 var(--e2)}
.menu li{margin-bottom:6px}
.menu button{display:grid;grid-template-columns:38px 1fr 18px;align-items:center;
  gap:var(--e3);padding:13px var(--e4);border-radius:var(--r2)}
.menu-ic{width:38px;height:38px;border-radius:var(--r1)}
.menu-txt{min-width:0}
.menu-txt b{font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.menu-txt em{font-size:12px;line-height:1.35;margin-top:3px;white-space:normal;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.menu-seta{justify-self:end}

/* Seções internas com o mesmo respiro do resto do app. */
.sheet .explica{margin:var(--e4) 0 0}
.sheet h3.sub{margin:var(--e6) 0 var(--e3)}
.tipos{gap:var(--e2);margin-bottom:var(--e4)}
.tipo{padding:11px 6px;border-radius:var(--r2);font-size:12.5px}
.lista-ed li{gap:var(--e2);margin-bottom:var(--e2)}
.in-texto,.in-larga{padding:12px 14px;font-size:14px}
.del{width:40px;height:42px;border-radius:var(--r2)}
.ed-bloco{padding:var(--e4);margin-bottom:var(--e2);border-radius:var(--r3)}
.ed-l1,.ed-l2{gap:var(--e2)}
.ed-l2{margin-top:var(--e2)}
.ed-l3{gap:6px;margin-top:var(--e3);padding-top:var(--e3)}
.metas{gap:var(--e3)}
.metas label{font-size:12px;gap:var(--e2)}
.tema-op{padding:var(--e4);border-radius:var(--r3);margin-bottom:var(--e2)}
.tema-bola{width:30px;height:30px}
.lembrete{padding:13px var(--e4);border-radius:var(--r2)}
.backup-btns{gap:var(--e2);margin-top:var(--e3)}
.exp-b{margin-bottom:var(--e3)}
.rot-acoes{gap:var(--e2);margin-bottom:var(--e5);padding-bottom:var(--e4)}

/* ---------- editor de rotina ---------- */

  return !!(m && m[1].trim().length > 2);

/* Progresso de uma nota com checklist: itens marcados sobre o total.
   Subtarefas são linhas indentadas — a contagem é a mesma. */
function progressoNota(n){
  var linhas=String(n.txt||"").split("\n");
  var f=0,tt=0;
  linhas.forEach(function(l){
    var m=l.match(/^\s*\[( |x)?\]/i);
    if(!m) return;
    tt++;
    if((m[1]||"").toLowerCase()==="x") f++;
  });
  return {feitos:f,total:tt,pct:tt?f/tt:0};
}
/* Estado do prazo, para ordenar e colorir. */
function prazoNota(n){
  if(!n.prazo) return null;
  var dd=diasAte(n.prazo);
  return {dias:dd, vencida:dd<0, hoje:dd===0, perto:dd>=0&&dd<=2};
}

function renderTexto(n){
  var linhas=n.txt.split("\n");
  var temCheck=linhas.some(function(l){ return /^\s*\[[ x]?\]/i.test(l); });
  if(!temCheck) return '<p class="nota-txt" data-a="nedit:'+n.id+'">'+esc(n.txt)+'</p>';
  var feitos=0,total=0;
  var corpo=linhas.map(function(l,i){
    var m=l.match(/^\s*\[( |x)?\]\s?(.*)$/i);
    if(!m) return l.trim()?'<span class="chk-txt">'+esc(l)+'</span>':'';
    total++;
    var ok=(m[1]||"").toLowerCase()==="x";
    if(ok) feitos++;
    return '<button class="chk'+(ok?" on":"")+'" data-a="nchk:'+n.id+'|'+i+'">'
      +'<span class="chk-box">'+(ok?"✓":"")+'</span><span>'+esc(m[2])+'</span></button>';
  }).join("");
  return '<div class="chk-lista">'+corpo+'</div>'
    +'<div class="chk-prog"><div class="ptrack"><div class="pfill" style="width:'
    +(total?feitos/total*100:0)+'%"></div></div><span class="pnum">'+feitos+'/'+total+'</span></div>';
}

/* Cache de um ciclo de render. As funções de agregação percorrem semanas
   de histórico; sem isto, o motor de regras as recalcularia a cada chamada.
   Limpo no início de render() — nunca sobrevive a uma mudança de estado. */
var C={}, seqGrad=0;
function cache(chaveC,calc){
  if(C[chaveC]===undefined) C[chaveC]=calc();
  return C[chaveC];
}

/* Número seguro: campo ausente, vazio ou inválido vira 0. */
function num(v){ var n=Number(v); return isFinite(n)?n:0; }

/* Data de N dias à frente. */
function diasFrente(n){
  var d=new Date(UI.agora);
  d.setDate(d.getDate()+n);
  return d;
}

/* Data de N dias atrás, a partir do "agora" da interface. */
function diasAtras(n){
  var d=new Date(UI.agora);
  d.setDate(d.getDate()-n);
  return d;
}

/* Minuto do dia em que um bloco foi marcado, ou null se o registro é
   antigo (quando só guardávamos `true`). Marcação feita depois da meia-noite
   volta como 1440+, para "dormiu 1h da manhã" não virar "dormiu à 1h da tarde". */
function minutoMarcado(reg,id,dataK){
  var v=reg&&reg.feitos?reg.feitos[id]:null;
  if(typeof v!=="number") return null;
  var q=new Date(v);
  var m=q.getHours()*60+q.getMinutes();
  if(chave(q)>dataK) m+=1440;
  return m;
}

/* Última marcação do dia, em minutos. Serve de proxy para a hora de dormir. */
function fimDoDia(reg,dataK){
  if(!reg||!reg.feitos) return null;
  var max=null;
  Object.keys(reg.feitos).forEach(function(id){
    var m=minutoMarcado(reg,id,dataK);
    if(m!==null && (max===null||m>max)) max=m;
  });
  return max;
}

/* Blocos que contam no dia: no modo sobrevivência, só os essenciais. */
function visiveis(d,blocos){
  return d.sobrevivencia ? blocos.filter(function(b){ return b.e; }) : blocos;
}

/* Total de minutos estudados em um registro de dia. */
function somaMin(reg){
  var t=0;
  if(reg&&reg.minutos) Object.keys(reg.minutos).forEach(function(m){ t+=num(reg.minutos[m]); });
  return t;
}
