/* ---- pomodoro ---- */
/* Fases do pomodoro: foco -> curto -> foco ... e, a cada N ciclos, longo. */
function cfgPomo(){
  var c=S.pomo||{};
  return {foco:num(c.foco)||25, curto:num(c.curto)||5, longo:num(c.longo)||15, ate:num(c.ate)||4};
}
function segundosDaFase(fase){
  var c=cfgPomo();
  return (fase==="foco"?c.foco:fase==="curto"?c.curto:c.longo)*60;
}
function ciclosHoje(){
  var k=hojeKey();
  return (S.pomo.ciclos||[]).filter(function(x){ return x.data===k && x.fase==="foco"; }).length;
}
function proximaFase(){
  var c=cfgPomo();
  if(UI.fase!=="foco") return "foco";
  var feitos=ciclosHoje();          /* o ciclo recém-concluído já está aqui */
  return (feitos>0 && feitos % c.ate === 0) ? "longo" : "curto";
}

function iniciarPomo(){
  UI.rodando=true; render();
  UI.timer=setInterval(function(){
    UI.seg--;
    if(UI.seg<=0){
      clearInterval(UI.timer); UI.rodando=false;
      if(UI.fase==="foco"){
        var min=cfgPomo().foco;
        var d=dia(),m=Object.assign({},d.minutos);
        m[UI.materia]=(m[UI.materia]||0)+min;
        /* registro do ciclo: alimenta o histórico e as estatísticas */
        S.pomo.ciclos=(S.pomo.ciclos||[]).concat([{
          data:hojeKey(), ts:Date.now(), fase:"foco", min:min, materia:UI.materia
        }]).slice(-500);
        mudarDia({minutos:m});
        notificar("Foco concluído", min+" min em "+UI.materia+". Hora da pausa.");
      } else {
        S.pomo.ciclos=(S.pomo.ciclos||[]).concat([{
          data:hojeKey(), ts:Date.now(), fase:UI.fase, min:segundosDaFase(UI.fase)/60
        }]).slice(-500);
        salvar();
        notificar("Pausa terminada", "Pronto para o próximo bloco de foco.");
      }
      UI.fase=proximaFase();
      UI.pausa=(UI.fase!=="foco");
      UI.seg=segundosDaFase(UI.fase);
      bip(); render(); return;
    }
    var r=document.getElementById("reloj");
    if(r){
      r.textContent=pad(Math.floor(UI.seg/60))+":"+pad(UI.seg%60);
      var total=segundosDaFase(UI.fase),C=2*Math.PI*74;
      var anel=document.getElementById("ring");
      if(anel) anel.style.strokeDashoffset=C*(UI.seg/total);
    }
  },1000);
}
function pararPomo(){ clearInterval(UI.timer); UI.rodando=false; render(); }

var ctxAudio=null;
function bip(){
  try{
    /* um único AudioContext para toda a sessão: o iOS bloqueia o áudio
       depois de meia dúzia de instâncias abertas. */
    if(!ctxAudio) ctxAudio=new (window.AudioContext||window.webkitAudioContext)();
    var ctx=ctxAudio;
    if(ctx.state==="suspended" && ctx.resume) ctx.resume();
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value=660; g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.5);
    o.start(); o.stop(ctx.currentTime+0.5);
  }catch(e){}
}

/* =====================================================================
   NOTIFICAÇÕES LOCAIS
   Sem servidor e sem push: usamos a API de Notification do navegador.
   Limite honesto — com o app fechado a entrega depende do sistema
   operacional; por isso o lembrete nativo continua sendo recomendado.
   ===================================================================== */
function podeNotificar(){
  try{ return typeof Notification!=="undefined" && Notification.permission==="granted"; }
  catch(e){ return false; }
}
function notificar(titulo,corpo,tag){
  if(typeof S==="undefined" || !S || !S.alertas) return false;
  try{
    if(!podeNotificar()) return false;
    if(typeof navigator!=="undefined" && navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){
        reg.showNotification(titulo,{body:corpo, tag:tag||"ritmo",
          icon:"./icone-192.png", badge:"./favicon-32.png"});
      }).catch(function(){ try{ new Notification(titulo,{body:corpo}); }catch(e){} });
      return true;
    }
    new Notification(titulo,{body:corpo});
    return true;
  }catch(e){ console.warn("[Ritmo] notificação falhou:",e.message); return false; }
}

/* Agenda os avisos enquanto o app está aberto. Cada bloco dispara uma
   vez só, controlado por chave, para não repetir a cada render. */
var _agendados={};
function agendarAvisos(){
  if(typeof S==="undefined" || !S || !S.alertas || !podeNotificar()) return 0;
  var min=UI.agora.getHours()*60+UI.agora.getMinutes();
  var d=dia(), vis=visiveis(d,montarDia(UI.agora)), n=0;
  vis.forEach(function(b){
    if(b.k==="base") return;
    var ch=hojeKey()+":"+b.id;
    if(_agendados[ch]) return;
    var faltam=(b.t-min)*60000;
    if(faltam<=0 || faltam>3*3600000) return;   /* só as próximas 3 horas */
    _agendados[ch]=setTimeout(function(){
      notificar(b.titulo,"Começa agora · "+hhmm(b.t),"bloco-"+b.id);
    },faltam);
    n++;
  });
  var chR=hojeKey()+":resumo";
  if(!_agendados[chR]){
    var alvo=(20*60-min)*60000;
    if(alvo>0 && alvo<6*3600000){
      _agendados[chR]=setTimeout(function(){
        var dd=dia(), vv=visiveis(dd,montarDia(UI.agora));
        var f=vv.filter(function(b){ return dd.feitos[b.id]; }).length;
        notificar("Resumo do dia",f+" de "+vv.length+" blocos concluídos.","resumo");
      },alvo);
      n++;
    }
  }
  return n;
}

/* ---- vigia de blocos ---- */
function vigiar(){
  if(!S.alertas) return;
  var d=dia(), blocos=montarDia(UI.agora);
  var vis=d.sobrevivencia?blocos.filter(function(b){return b.e;}):blocos;
  var min=UI.agora.getHours()*60+UI.agora.getMinutes();
  var at=null;
  vis.forEach(function(b){ if(min>=b.t&&min<b.t+b.dur) at=b; });
  var id=at?at.id:null;
  if(id && UI.ultimoBloco && id!==UI.ultimoBloco){
    UI.alerta=at.titulo;
    UI.alertaEm=Date.now();
    bip();
    try{
      if(window.Notification && Notification.permission==="granted")
        new Notification("Ritmo",{body:at.titulo});
    }catch(e){}
  }
  UI.ultimoBloco=id;
  /* o aviso se apaga sozinho depois de 1 min: banner preso vira ruído */
  if(UI.alerta && UI.alertaEm && Date.now()-UI.alertaEm>60000) UI.alerta=null;
}


/* =====================================================================
   PWA — registro, instalação e atualização
   Tudo aqui é opcional: se o ambiente não suportar (por exemplo dentro
   de um iframe), o app segue funcionando exatamente como antes.
   ===================================================================== */
var PWA = (function(){
  var promptInstalar=null, registro=null, atualizando=false;

  function instalado(){
    try{
      if(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
      if(window.navigator.standalone) return true;   /* iOS */
    }catch(e){}
    return false;
  }
  function podeInstalar(){ return !!promptInstalar; }

  async function registrar(){
    if(!("serviceWorker" in navigator)){
      console.info("[Ritmo] service worker não suportado neste navegador");
      return null;
    }
    /* Dentro de iframe sandbox o registro falha: avisa e segue a vida. */
    try{
      registro=await navigator.serviceWorker.register("./service-worker.js",{scope:"./"});
      console.info("[Ritmo] service worker registrado");

      if(registro.waiting) marcarAtualizacao();
      registro.addEventListener("updatefound",function(){
        var novo=registro.installing;
        if(!novo) return;
        novo.addEventListener("statechange",function(){
          if(novo.state==="installed" && navigator.serviceWorker.controller) marcarAtualizacao();
        });
      });
      navigator.serviceWorker.addEventListener("controllerchange",function(){
        if(atualizando){ atualizando=false; location.reload(); }
      });
      /* procura atualização ao voltar para o app */
      document.addEventListener("visibilitychange",function(){
        if(!document.hidden && registro) registro.update().catch(function(){});
      });
      return registro;
    }catch(e){
      console.info("[Ritmo] service worker indisponível aqui:",e.message);
      return null;
    }
  }

  function marcarAtualizacao(){
    UI.temAtualizacao=true;
    console.info("[Ritmo] nova versão disponível");
    try{ render(); }catch(e){}
  }

  function aplicarAtualizacao(){
    if(!registro||!registro.waiting) { location.reload(); return; }
    atualizando=true;
    registro.waiting.postMessage({tipo:"PULAR_ESPERA"});
  }

  async function instalar(){
    if(!promptInstalar) return "indisponivel";
    promptInstalar.prompt();
    var escolha=await promptInstalar.userChoice;
    promptInstalar=null;
    try{ render(); }catch(e){}
    return escolha && escolha.outcome==="accepted" ? "aceito" : "recusado";
  }

  window.addEventListener("beforeinstallprompt",function(ev){
    ev.preventDefault();
    promptInstalar=ev;
    console.info("[Ritmo] o app pode ser instalado");
    try{ render(); }catch(e){}
  });
  window.addEventListener("appinstalled",function(){
    promptInstalar=null;
    console.info("[Ritmo] app instalado");
    try{ render(); }catch(e){}
  });

  return {registrar:registrar, instalar:instalar, aplicarAtualizacao:aplicarAtualizacao,
          instalado:instalado, podeInstalar:podeInstalar,
          temRegistro:function(){ return !!registro; }};
})();

/* ================= boot ================= */
(async function(){
  try{
    await Persistencia.iniciar();
    var dados=await Persistencia.carregar(padrao());
    S=dados.S; N=dados.N||[];
    /* compatibilidade com o formato antigo de horários personalizados */
    if(S.custom && !S.blocos){
      Object.keys(S.blocos||{}).forEach(function(k){
        S.blocos[k]=S.blocos[k].map(function(b){
          if(S.custom[b.id]!=null) b.t=S.custom[b.id];
          return b;
        });
      });
    }
  }catch(e){
    console.error("[Ritmo] falha ao carregar:",e.message);
    UI.msg="Não foi possível ler os dados salvos. A rotina padrão foi carregada; seus dados não foram apagados.";
  }
  render();
  vigiar();
  PWA.registrar();
  /* backup do dia, uma vez por sessão, sem bloquear a abertura */
  setTimeout(function(){ Persistencia.backupAutomatico(S,N); }, 4000);

  /* Ao voltar de segundo plano o relógio podia ficar até 20s atrasado. */
  if(document.addEventListener) document.addEventListener("visibilitychange",function(){
    if(!document.hidden){ UI.agora=new Date(); vigiar(); render(); }
  });

  /* O relógio não precisa girar com o app em segundo plano: economiza
     bateria e evita renders invisíveis. Ao voltar, o listener de
     visibilidade atualiza tudo de uma vez. */
  var pulso=null;
  function ligarPulso(){
    if(pulso) return;
    pulso=setInterval(function(){
      UI.agora=new Date();
      vigiar();
      var tag=document.activeElement?document.activeElement.tagName:"";
      if(!UI.rodando && tag!=="INPUT" && tag!=="TEXTAREA" && tag!=="SELECT") render();
    },20000);
  }
  function desligarPulso(){ if(pulso){ clearInterval(pulso); pulso=null; } }
  ligarPulso();
  agendarAvisos();
  if(document.addEventListener) document.addEventListener("visibilitychange",function(){
    if(document.hidden) desligarPulso(); else { ligarPulso(); agendarAvisos(); }
  });
})();
</script>
